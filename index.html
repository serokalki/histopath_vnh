pecimen, which produces artefact that cannot be distinguished from disease.","Delaying processing, so enzyme histochemistry on the frozen sample fails.","Losing transverse orientation, so fibre-type analysis is impossible."],"prompts":[{"l":"Specimen","t":"c","o":["Peripheral nerve – name: ______","Muscle – name: ______","Both"]},{"l":"Laterality","t":"c","o":["Right","Left"]},{"l":"Clinical diagnosis / question","t":"t","h":""},{"l":"Received","t":"c","o":["Fresh – time ____","On saline gauze","In fixative","Frozen"]},{"l":"Time from excision to receipt (min)","t":"t","h":""},{"l":"Nerve length (mm) × diameter (mm)","t":"t","h":""},{"l":"Muscle dimensions (mm) and weight (g)","t":"t","h":""},{"l":"Appearance","t":"c","o":["Normal","Pale/fatty","Fibrotic","Atrophic"]},{"l":"Portion snap-frozen?","t":"c","o":["No","Yes – time ____, orientated transversely"]},{"l":"Portion for EM (glutaraldehyde)?","t":"c","o":["No","Yes"]},{"l":"Portion for resin / semithin sections?","t":"c","o":["No","Yes"]},{"l":"Orientation maintained for transverse sectioning?","t":"c","o":["Yes","No"]}]},{"id":"VNL-H-081","title":"Pituitary & sellar specimen","blocks":"Embed the entire specimen in a single cassette using lens paper – pituitary specimens are typically tiny and cannot be repeated. Request levels and a reticulin stain with the initial H&E, and retain material for EM where a functioning adenoma is suspected.","clinical":["The surgical approach and the clinical syndrome.","The relevant hormone levels: prolactin, growth hormone, cortisol and pituitary axis testing.","Imaging findings including tumour size and any suprasellar extension.","Whether electron microscopy or molecular studies are required."],"handling":["Pituitary specimens are typically tiny and cannot be repeated. Nothing may be wasted.","Use lens paper and a marker dye; embed in a single cassette.","Where a functioning adenoma is suspected, retain a fragment in glutaraldehyde for electron microscopy."],"steps":["Record the approach, the clinical syndrome and the number of fragments.","Measure the aggregate dimensions.","Describe the tissue: soft and tan, firm, gelatinous, haemorrhagic, necrotic, cystic or calcified.","Record any cyst fluid and its appearance, which may suggest craniopharyngioma.","Record whether normal gland or dura is identifiable.","Make smear preparations where sufficient tissue permits.","Retain a fragment for electron microscopy where indicated, before fixing the remainder.","Apply a marker dye and embed the entire remaining specimen in one cassette.","Request levels and a reticulin stain with the initial H&E, since reticulin architecture distinguishes adenoma from normal gland."],"pitfalls":["Dividing a tiny specimen across several cassettes, so each contains almost nothing.","Failing to request reticulin, so an adenoma cannot be distinguished from hyperplasia.","Losing the specimen in the sieve; pituitary fragments are frequently under 2 mm."],"prompts":[{"l":"Approach","t":"c","o":["Transsphenoidal","Transcranial","Autopsy"]},{"l":"Clinical syndrome","t":"c","o":["Non-functioning","Prolactinoma","Acromegaly","Cushing","Apoplexy","?Craniopharyngioma"]},{"l":"Number of fragments","t":"t","h":""},{"l":"Aggregate dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Appearance","t":"c","o":["Soft tan","Firm","Gelatinous","Haemorrhagic","Necrotic","Cystic","Calcified"]},{"l":"Cyst fluid present?","t":"c","o":["No","Yes – appearance: ______"]},{"l":"Normal gland / dura identifiable?","t":"c","o":["No","Yes"]},{"l":"Smear preparations made?","t":"c","o":["No","Yes"]},{"l":"Tissue for EM retained?","t":"c","o":["No","Yes"]},{"l":"Tissue for molecular / research retained?","t":"c","o":["No","Yes"]},{"l":"Marker dye used","t":"t","h":""},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No"]}]},{"id":"VNL-H-082","title":"Eye, orbit & ophthalmic specimen","blocks":"Fix the intact globe for 24–48 hours before opening. Take the optic nerve margin first. Open in the horizontal (or tumour-orientated) plane to produce a pupil–optic nerve section, keeping the calotte. Temporal artery: measure, then section transversely at 2–3 mm and embed in entirety with multiple levels.","clinical":["The specimen type, the side and the indication.","For enucleation, the tumour type and size on clinical examination and ultrasound.","For temporal artery biopsy, the clinical features, inflammatory markers and whether steroids have been started.","Visual acuity and any history of trauma or prior ocular surgery."],"handling":["Fix the intact globe for 24 to 48 hours before opening. An unfixed globe collapses and cannot be sectioned.","Do not open the globe to inspect it; transilluminate instead.","Take the optic nerve margin before opening.","Temporal artery specimens must be measured before sectioning, since length determines adequacy."],"steps":["Record the specimen type, the side and the indication.","Measure the globe in three dimensions: anteroposterior, horizontal and vertical.","Measure the optic nerve length and take an en-face section of the nerve margin before any other cut.","Measure the corneal diameter and record its clarity.","Inspect the external surface for extraocular tumour extension and record its site.","Transilluminate the fixed globe and record the position of any shadow, which locates an intraocular tumour.","Fix for 24 to 48 hours, then open in the horizontal plane, or in a plane through the tumour and the optic nerve, producing a pupil–optic nerve section.","Retain the calotte and record the tumour dimensions and its position within the globe.","Record retinal detachment and any other intraocular finding.","Temporal artery: measure the length, then section transversely at 2–3 mm, embed in entirety and request multiple levels."],"pitfalls":["Opening the globe before fixation, which destroys the internal architecture.","Taking the optic nerve margin after cutting through the tumour.","Reporting a temporal artery as negative on a short segment with few levels, when the arteritis is skip-lesional."],"prompts":[{"l":"Specimen type","t":"c","o":["Enucleation","Evisceration","Exenteration","Conjunctival biopsy","Corneal button","Temporal artery","Eyelid"]},{"l":"Laterality","t":"c","o":["Right","Left"]},{"l":"Indication","t":"c","o":["Tumour","Trauma","Blind painful eye","?Giant cell arteritis","Graft","Other"]},{"l":"Globe dimensions (mm)","t":"t","h":"AP ____ × Horiz ____ × Vert ____"},{"l":"Optic nerve length (mm) – margin taken?","t":"c","o":["Yes","No"]},{"l":"Cornea diameter (mm) and clarity","t":"t","h":""},{"l":"Extraocular extension seen?","t":"c","o":["No","Yes – site: ______"]},{"l":"Transillumination performed – shadow present?","t":"c","o":["No","Yes – location: ______"]},{"l":"Tumour dimensions (mm) and location within globe","t":"t","h":""},{"l":"Retinal detachment present?","t":"c","o":["No","Yes"]},{"l":"Temporal artery length (mm)","t":"t","h":""},{"l":"Photographed?","t":"c","o":["No","Yes – ref: ______"]}]}]}];
const ALL = [];
DATA.forEach(g => g.forms.forEach(f => ALL.push(Object.assign({}, f, {gkey:g.key, gname:g.name, ink:g.ink}))));
ALL.forEach(f => {
  f.hay = [f.id, f.title, f.gname, f.blocks,
    f.clinical.join(" "), f.handling.join(" "), f.steps.join(" "), f.pitfalls.join(" "),
    f.prompts.map(p => p.l + " " + (p.o ? p.o.join(" ") : (p.h||""))).join(" ")].join(" ").toLowerCase();
});

const state = { q:"", group:null, sel:new Set(), values:{}, tab:"proto" };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function matches(){
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  return ALL.filter(f => (!state.group || f.gkey === state.group) && terms.every(t => f.hay.includes(t)));
}
function hl(text, terms){
  let out = esc(text);
  terms.forEach(t => {
    const re = new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")","ig");
    out = out.replace(re, "<mark>$1</mark>");
  });
  return out;
}

function renderGroups(){
  const el = $("#groups");
  el.innerHTML =
    '<button class="gitem" data-g="" aria-pressed="' + (!state.group) + '">' +
      '<span class="bar" style="background:linear-gradient(#4A5560,#0B6E99)"></span>' +
      '<span class="lbl">All sections<small>VNL-H-001 – VNL-H-0' + ALL.length + '</small></span>' +
      '<span class="ct">' + ALL.length + '</span></button>' +
    DATA.map(g =>
      '<button class="gitem" data-g="' + g.key + '" aria-pressed="' + (state.group===g.key) + '">' +
        '<span class="bar" style="background:' + g.ink + '"></span>' +
        '<span class="lbl">' + esc(g.name) + '<small>' + g.forms[0].id + ' – ' + g.forms[g.forms.length-1].id + '</small></span>' +
        '<span class="ct">' + g.forms.length + '</span></button>').join("");
  el.querySelectorAll(".gitem").forEach(b => b.onclick = () => { state.group = b.dataset.g || null; render(); });
}

function renderResults(){
  const list = matches();
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  $("#count").textContent = list.length + (list.length===1 ? " worksheet" : " worksheets") +
    (state.group ? " in " + DATA.find(g=>g.key===state.group).name : "") +
    (state.q ? ' matching "' + state.q + '"' : "");

  const box = $("#results");
  if (!list.length){
    box.innerHTML = '<div class="empty" style="grid-column:1/-1"><b>No worksheet matches that</b>' +
      'Try the specimen name (appendix, placenta, thyroid), the procedure (mastectomy, TURP), ' +
      'or a step you need (inking, decalcify, flow cytometry). VNL-H-001 covers anything without a dedicated form.</div>';
    return;
  }
  box.innerHTML = list.map(f => {
    const on = state.sel.has(f.id);
    return '<article class="card' + (on?" on":"") + '" data-c="' + f.id + '">' +
      '<span class="spine" style="background:' + f.ink + '"></span>' +
      '<input class="tick" type="checkbox" ' + (on?"checked":"") + ' aria-label="Add ' + f.id + ' to print set">' +
      '<div class="body"><span class="code c">' + hl(f.id,terms) + '</span>' +
      '<h3>' + hl(f.title,terms) + '</h3><p class="g">' + esc(f.gname) + '</p></div></article>';
  }).join("");
  box.querySelectorAll(".card").forEach(card => {
    card.querySelector(".tick").onclick = e => { e.stopPropagation(); toggle(card.dataset.c); };
    card.onclick = () => openPreview(card.dataset.c);
  });
}

function renderTray(){
  const n = state.sel.size;
  $("#n1").textContent = n; $("#n2").textContent = n;
  ["print","pdf","clear"].forEach(id => $("#"+id).disabled = !n);
  $("#preview").hidden = !n;
  const tray = $("#tray");
  if (!n){ tray.innerHTML = "Nothing selected yet. Tick a worksheet to add it to the print set."; return; }
  tray.innerHTML = ALL.filter(f => state.sel.has(f.id)).map(f =>
    '<div style="display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--rule-soft)">' +
      '<span style="width:4px;align-self:stretch;background:' + f.ink + ';border-radius:2px;flex:none"></span>' +
      '<span style="flex:1;min-width:0;line-height:1.25"><span class="code" style="color:var(--slate);font-weight:600">' + f.id + '</span><br>' +
      '<span style="font-size:12.5px">' + esc(f.title) + '</span></span>' +
      '<button class="linkish" data-rm="' + f.id + '" style="font-size:16px;line-height:1;text-decoration:none;color:var(--slate)" aria-label="Remove ' + f.id + '">&times;</button>' +
    '</div>').join("");
  tray.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => toggle(b.dataset.rm));
}

function toggle(id){ state.sel.has(id) ? state.sel.delete(id) : state.sel.add(id); render(); }
function render(){ renderGroups(); renderResults(); renderTray(); }

/* ---------- protocol markup ---------- */
function head(f, label){
  return '<div class="lh"><img src="' + ARMS_SRC + '" alt="Coat of arms of Vanuatu">' +
    '<div><p class="org">Histology Section, Laboratory Department,<br>Vanuatu National Hospital.</p>' +
    '<div class="sh"><span class="code">' + f.id + '</span><h4>' + esc(f.title) + '</h4></div></div></div>' +
    '<p class="sub">' + esc(f.gname) + ' \u00b7 ' + label + '</p>';
}
function listBlock(title, items, numbered){
  return '<div class="band">' + title + '</div><table class="plist">' +
    items.map((it,i) => '<tr><td class="' + (numbered?"i":"b") + '">' + (numbered ? (i+1) : "\u25aa") + '</td><td>' + esc(it) + '</td></tr>').join("") +
    '</table>';
}
function protoHTML(f){
  let h = '<section class="proto" style="--band:' + f.ink + '">' + head(f, "Cut-up protocol");
  h += listBlock("Clinical information required before cut-up", f.clinical, false);
  h += listBlock("Specimen handling, fixation and triage", f.handling, false);
  h += listBlock("Dissection procedure", f.steps, true);
  h += '<div class="band">Blocks for histology \u2014 suggested minimum sampling</div><div class="samp">' + esc(f.blocks) + '</div>';
  h += '<div class="band red">Common errors to avoid</div><div class="errs">' +
    f.pitfalls.map(p => '<div>\u2717&nbsp;&nbsp;' + esc(p) + '</div>').join("") + '</div>';
  h += '<div class="foot"><span>VNL-H-WS-001 v2.0 \u00b7 ' + f.id + ' \u00b7 protocol</span><span>Uncontrolled when printed</span></div>';
  return h + '</section>';
}

/* ---------- worksheet markup ---------- */
function field(id, hint){
  const v = state.values[id] || "";
  return '<input type="text" data-f="' + id + '" value="' + esc(v) + '"' + (hint ? ' placeholder="' + esc(hint) + '"' : "") + '>';
}
function checks(id, opts){
  return '<div class="opts">' + opts.map((o,i) => {
    const key = id + ":" + i;
    return '<label><input type="checkbox" data-f="' + key + '"' + (state.values[key] ? " checked" : "") + '>' + esc(o) + '</label>';
  }).join("") + '</div>';
}
function sheetHTML(f){
  const id = f.id;
  const kv = (a,b,c,d) => '<tr><td class="k">' + a + '</td><td>' + b + '</td><td class="k">' + c + '</td><td>' + d + '</td></tr>';
  const wide = (a,b) => '<tr><td class="k">' + a + '</td><td colspan="3">' + b + '</td></tr>';

  let h = '<section class="sheet" style="--band:' + f.ink + '">' + head(f, "Cut-up worksheet");
  h += '<div class="band">Patient &amp; specimen identification</div><table>' +
    kv("Laboratory No.", field(id+"|lab"), "Date received", field(id+"|rec")) +
    kv("Surname, given names", field(id+"|name"), "Hospital / patient No.", field(id+"|hosp")) +
    kv("Date of birth / age", field(id+"|dob"), "Sex", checks(id+"|sex", ["M","F"])) +
    kv("Ward / clinic / source", field(id+"|ward"), "Requesting clinician", field(id+"|clin")) +
    kv("Date &amp; time collected", field(id+"|coll"), "Date &amp; time into fixative", field(id+"|fix")) +
    kv("No. of containers", field(id+"|cont"), "Fixative &amp; volume (\u226510:1)", field(id+"|fixv")) +
    wide("Specimen(s) as labelled", field(id+"|spec")) +
    wide("Clinical details / operation", field(id+"|hist")) + '</table>';

  h += '<div class="band">Macroscopic description</div><table>';
  f.prompts.forEach((p,i) => {
    const key = id + "|p" + i;
    h += '<tr><td class="k2">' + (i+1) + '. ' + esc(p.l) + '</td><td colspan="3">' +
      (p.t === "c" ? checks(key, p.o) : field(key, p.h)) + '</td></tr>';
  });
  h += '<tr class="free"><td class="k2">Further description / diagram</td><td colspan="3">' + field(id+"|free") + '</td></tr></table>';

  h += '<div class="band">Block key</div><div class="hint"><b>Suggested minimum sampling:</b> ' + esc(f.blocks) + '</div>' +
    '<table class="bk"><tr><td class="k n">Block</td><td class="k d">Site / description of tissue in block</td><td class="k">Pieces / notes</td></tr>';
  for (let i=1;i<=9;i++) h += '<tr><td class="n">' + i + '</td><td class="d">' + field(id+"|b"+i) + '</td><td>' + field(id+"|bn"+i) + '</td></tr>';
  h += '</table>';

  h += '<div class="band">Cut-up record, supervision &amp; verification</div><table>' +
    kv("Cut-up performed by", field(id+"|by"), "Designation", field(id+"|desig")) +
    kv("Date &amp; time of cut-up", field(id+"|when"), "Total blocks submitted", field(id+"|tot")) +
    kv("Supervision category", checks(id+"|sup", ["Direct","Indirect","Not required"]), "Supervising pathologist", field(id+"|path")) +
    kv("Pathologist verification", checks(id+"|ver", ["Description accepted","Amended"]), "Signature / date", field(id+"|sig")) +
    kv("Residual tissue retained?", checks(id+"|res", ["Yes","No \u2013 all embedded"]), "Retain until", field(id+"|until")) + '</table>';

  h += '<div class="foot"><span>VNL-H-WS-001 v2.0 \u00b7 ' + f.id + ' \u00b7 worksheet</span><span>Uncontrolled when printed</span></div>';
  return h + '</section>';
}

function bindFields(scope){
  scope.querySelectorAll("[data-f]").forEach(el => {
    if (el.type === "checkbox") el.onchange = () => { state.values[el.dataset.f] = el.checked; };
    else el.oninput = () => { state.values[el.dataset.f] = el.value; };
  });
}

/* ---------- preview ---------- */
let previewId = null;
function drawPreview(){
  const body = $("#dbody");
  if (previewId){
    const f = ALL.find(x => x.id === previewId);
    body.innerHTML = state.tab === "proto" ? protoHTML(f) : sheetHTML(f);
  } else {
    const chosen = ALL.filter(f => state.sel.has(f.id));
    body.innerHTML = chosen.map(f =>
      '<div style="margin-bottom:26px;padding-bottom:26px;border-bottom:1px dashed var(--rule)">' +
      (state.tab === "proto" ? protoHTML(f) : sheetHTML(f)) + '</div>').join("");
  }
  bindFields(body);
  $("#tabs").querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.t === state.tab)));
}
function openDrawer(){ $("#drawer").classList.add("open"); document.body.style.overflow = "hidden"; }
function openPreview(id){
  previewId = id;
  const f = ALL.find(x => x.id === id);
  $("#dtitle").textContent = f.id + " — " + f.title;
  drawPreview(); openDrawer();
}
function openPreviewSet(){
  previewId = null;
  $("#dtitle").textContent = state.sel.size + " worksheets selected";
  drawPreview(); openDrawer();
}
function closeDrawer(){ $("#drawer").classList.remove("open"); document.body.style.overflow = ""; }

/* ---------- print / PDF ---------- */
function pagesFor(ids){
  const wantP = $("#incProto").checked, wantS = $("#incSheet").checked;
  const out = [];
  ids.forEach(id => {
    const f = ALL.find(x => x.id === id);
    if (wantP) out.push(protoHTML(f));
    if (wantS) out.push(sheetHTML(f));
  });
  return out;
}
function doPrint(ids, msg){
  if (!ids.length) return;
  const pages = pagesFor(ids);
  if (!pages.length){ toast("Nothing to print — tick the protocol page, the worksheet page, or both."); return; }
  const root = $("#printroot");
  root.innerHTML = pages.join("");
  root.querySelectorAll("[data-f]").forEach(el => {
    const v = state.values[el.dataset.f];
    if (el.type === "checkbox") el.checked = !!v; else el.value = v || "";
  });
  toast(msg.replace("{n}", pages.length));
  setTimeout(() => window.print(), 120);
}
function toast(msg){
  const t = $("#toast");
  t.innerHTML = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 6000);
}
const selected = () => ALL.filter(f => state.sel.has(f.id)).map(f => f.id);

/* ---------- wiring ---------- */
$("#q").oninput = e => { state.q = e.target.value.trim(); renderResults(); };
$("#selall").onclick = () => { matches().forEach(f => state.sel.add(f.id)); render(); };
$("#clear").onclick = () => { state.sel.clear(); render(); };
$("#preview").onclick = openPreviewSet;
$("#dclose").onclick = closeDrawer;
$("#drawer").onclick = e => { if (e.target.id === "drawer") closeDrawer(); };
$("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { state.tab = b.dataset.t; drawPreview(); });
$("#dprint").onclick = () => doPrint(previewId ? [previewId] : selected(), "Sending {n} pages to the printer.");
$("#print").onclick = () => doPrint(selected(), "Sending {n} pages to the printer.");
$("#pdf").onclick = () => doPrint(selected(), "In the dialog that opens, set <b>Destination</b> to <b>Save as PDF</b> \u2014 that writes all {n} pages to one A4 PDF.");

document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.id !== "q" && !e.metaKey && !e.ctrlKey){
    e.preventDefault(); $("#q").focus(); $("#q").select();
  }
  if (e.key === "Escape"){
    if ($("#drawer").classList.contains("open")) closeDrawer();
    else if (state.q){ state.q=""; $("#q").value=""; renderResults(); }
  }
  if ((e.metaKey || e.ctrlKey) && e.key === "p" && state.sel.size){
    e.preventDefault(); doPrint(selected(), "Sending {n} pages to the printer.");
  }
});

render();
</script>
</body>
</html>
