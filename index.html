r or remote from it.","Measure the distance from the tumour to the proximal and distal margins.","Describe the background mucosa: atrophy, ulceration, polyps or intestinal metaplasia.","Submit at least four blocks through the tumour to the deepest point, including the serosa where breached.","Submit both margins, the tumour-to-normal interface, and representative body and antral mucosa.","Dissect all perigastric nodes and submit them by station where the surgeon has identified them.","Sample the omentum, and any spleen or duodenum received."],"pitfalls":["Cutting through the tumour when opening the stomach.","Failing to sample background mucosa, so the presence of atrophy or metaplasia is not reported.","Pooling all nodes together when the surgeon has taken the trouble to separate stations."],"prompts":[{"l":"Procedure","t":"c","o":["Partial/subtotal","Total","Sleeve","Wedge/GIST"]},{"l":"Neoadjuvant therapy?","t":"c","o":["No","Yes"]},{"l":"Specimen dimensions (mm) – greater/lesser curve","t":"t","h":""},{"l":"Attached structures (omentum, spleen, duodenum)","t":"t","h":""},{"l":"Tumour site","t":"c","o":["Cardia","Fundus","Body","Antrum","Pylorus"]},{"l":"Tumour dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Tumour appearance","t":"c","o":["Polypoid","Ulcerated","Infiltrative/linitis","Submucosal"]},{"l":"Serosal involvement / perforation?","t":"c","o":["No","Yes"]},{"l":"Distance to proximal margin (mm)","t":"t","h":""},{"l":"Distance to distal margin (mm)","t":"t","h":""},{"l":"Background mucosa","t":"c","o":["Normal","Atrophic","Ulcer(s)","Polyps"]},{"l":"Lymph nodes retrieved (total / by station)","t":"t","h":""}]},{"id":"VNL-H-026","title":"Small bowel resection","blocks":"Open along the antimesenteric border away from any lesion. Tumour: ≥4 blocks including deepest point and radial margin. Inflammatory disease: representative blocks from each affected and unaffected segment, both margins, and all nodes.","clinical":["The segment resected, the indication and the operative findings.","For inflammatory disease, the extent and duration of disease and current therapy.","For ischaemia, the vascular history and the timing of the event.","For tumour, the diagnosis on any prior biopsy."],"handling":["Open along the antimesenteric border, away from any lesion.","Rinse gently; do not scrub the mucosa.","Pin flat, mucosa up, and fix before dissection where the diagnosis is inflammatory."],"steps":["Record the segment, its length, and the dimensions of the attached mesentery.","Describe the serosal surface before opening: fibrin, fat wrapping, adhesions and any perforation.","Ink the mesenteric (radial) margin where a tumour is present.","Open along the antimesenteric border, avoiding any lesion, then pin and fix.","Record any lesion: site, three dimensions, appearance and distance from each end.","Measure the maximum wall thickness and describe the mucosa between lesions.","Measure the distance from the lesion to the proximal and distal margins.","Tumour: submit at least four blocks including the deepest invasion and the mesenteric margin.","Inflammatory disease: submit representative blocks from each involved and uninvolved segment, the deepest ulceration, and any stricture.","Submit both margins and dissect all mesenteric nodes."],"pitfalls":["Opening through a lesion or a stricture, which destroys the ability to assess it.","Failing to ink the mesenteric margin in a small bowel tumour.","Sampling only diseased bowel, so the extent and skip pattern cannot be reported."],"prompts":[{"l":"Indication","t":"c","o":["Tumour","Crohn's","Ischaemia","Obstruction","Perforation","Meckel's"]},{"l":"Segment and length (mm)","t":"t","h":""},{"l":"Mesentery included – dimensions (mm)","t":"t","h":""},{"l":"Serosal surface","t":"c","o":["Smooth","Fibrinous","Fat wrapping","Adhesions","Perforation"]},{"l":"Lesion present?","t":"c","o":["No","Yes"]},{"l":"Lesion site, dimensions (mm), appearance","t":"t","h":""},{"l":"Distance to proximal margin (mm)","t":"t","h":""},{"l":"Distance to distal margin (mm)","t":"t","h":""},{"l":"Mesenteric (radial) margin inked?","t":"c","o":["Yes","No"]},{"l":"Mucosa between lesions","t":"c","o":["Normal","Ulcerated","Cobblestone","Strictured"]},{"l":"Wall thickness – maximum (mm)","t":"t","h":""},{"l":"Lymph nodes retrieved (total)","t":"t","h":""}]},{"id":"VNL-H-027","title":"Appendicectomy","blocks":"Standard: transverse section of the base (with inked resection margin), one mid transverse section, and the distal tip sectioned longitudinally. If a tumour, mucinous change, or perforated tip is seen, embed the entire appendix.","clinical":["The clinical presentation and duration of symptoms.","Whether the appendix was removed for suspected appendicitis or incidentally at another operation.","Any imaging finding suggesting a mass or mucinous change.","Patient age; appendiceal neoplasms are more common at the extremes of age."],"handling":["Formalin. Fix before sectioning if the wall is friable.","Do not squeeze the appendix; luminal contents contaminate the serosal surface.","Ink the resection margin at the base before sectioning."],"steps":["Measure the appendix: length and maximum diameter. Record the dimensions of the mesoappendix.","Describe the serosal surface along its whole length: glistening, congested, fibrinopurulent, or perforated.","Identify and record the site of any perforation before further handling.","Ink the resection margin at the base.","Take a transverse section of the base including the inked margin.","Section the appendix transversely at 3–4 mm along its length, examining each cut surface.","Record the wall thickness, the luminal contents and any dilatation.","Section the distal tip longitudinally, since tumours and perforation are commonest here.","Routine: submit the base with margin, one mid transverse section and the longitudinally sectioned tip.","Where a mass, mucin, a thickened tip or an unexplained dilatation is present, embed the entire appendix sequentially and record that it has been."],"pitfalls":["Sectioning the tip transversely rather than longitudinally, so a small tumour is missed.","Discarding the residual appendix before the slides are seen, when a neoplasm turns up.","Failing to ink the base, so margin involvement by a neoplasm cannot be assessed."],"prompts":[{"l":"Specimen length (mm) × maximum diameter (mm)","t":"t","h":""},{"l":"Mesoappendix present – dimensions (mm)","t":"t","h":""},{"l":"Serosal surface","t":"c","o":["Smooth/glistening","Congested","Fibrinopurulent","Perforated"]},{"l":"Perforation site if present","t":"t","h":""},{"l":"Wall thickness (mm)","t":"t","h":""},{"l":"Luminal contents","t":"c","o":["Faeces","Faecolith","Pus","Mucin","Empty"]},{"l":"Lumen dilated?","t":"c","o":["No","Yes – max diameter ____ mm"]},{"l":"Mass / tumour identified?","t":"c","o":["No","Yes – site & size: ______"]},{"l":"Tip appearance","t":"c","o":["Unremarkable","Thickened","Necrotic","Mucinous"]},{"l":"Base / resection margin inked?","t":"c","o":["Yes","No"]},{"l":"Blocks taken","t":"c","o":["Standard – base, mid transverse, tip longitudinal","Entire – lesion present"]},{"l":"Incidental finding needing full embedding?","t":"c","o":["No","Yes – embed entirely"]}]},{"id":"VNL-H-028","title":"Colorectal resection – tumour","blocks":"Ink the CRM/non-peritonealised surface before opening. Open away from the tumour, pin and fix. Blocks: ≥4 through tumour including deepest point and CRM, tumour–normal interface, both margins, each separate polyp, background mucosa, and all mesenteric nodes (apical node identified separately).","clinical":["The procedure and the site of the tumour, with its distance from the anal verge for rectal tumours.","Neoadjuvant chemoradiotherapy, which requires assessment of regression.","The diagnosis on prior biopsy and any polyps or synchronous lesions found at colonoscopy.","Family history and any known Lynch syndrome or polyposis."],"handling":["Assess and photograph the mesorectum before any incision in rectal specimens; completeness cannot be judged once the specimen is opened.","Ink the circumferential resection margin, or the non-peritonealised surface, before opening.","Open along the antimesenteric border away from the tumour, leaving the segment around the tumour intact where possible; pin flat and fix overnight.","Record the time into fixative."],"steps":["Record the procedure, the length of bowel and every attached structure.","For rectal specimens, record the completeness of the mesorectum as complete, near-complete or incomplete, before opening.","Ink the circumferential resection margin over and around the tumour.","Open the bowel along the antimesenteric border, avoiding the tumour, then pin flat and fix overnight.","Record the tumour site, its three dimensions, the proportion of circumference involved and its distance from the anal verge where relevant.","Record any serosal breach or perforation and whether it lies at the tumour or remote from it.","Measure the distance from the tumour to the proximal margin, the distal margin and the circumferential margin.","Describe the background bowel: polyps with their number, size and site, diverticula, and any colitis.","Slice the tumour transversely at 3–4 mm and submit at least four blocks including the deepest invasion with the circumferential margin in continuity.","Submit the tumour-to-normal interface, both longitudinal margins, each separate polyp, background mucosa and the appendix or terminal ileum where present.","Dissect all mesenteric nodes, identifying the apical node separately, and re-examine the fat after fixation."],"pitfalls":["Opening the rectum before the mesorectum has been graded.","Failing to demonstrate the tumour and the circumferential margin in one block, so the distance cannot be measured.","Reporting fewer than twelve nodes because the mesentery was dissected only once."],"prompts":[{"l":"Procedure","t":"c","o":["Right hemicolectomy","Left hemicolectomy","Sigmoid","Anterior resection","APR","Total colectomy"]},{"l":"Neoadjuvant therapy?","t":"c","o":["No","Yes – assess regression"]},{"l":"Bowel length (mm) and attached structures","t":"t","h":""},{"l":"Mesorectal completeness (rectal only)","t":"c","o":["Complete","Near-complete","Incomplete","N/A"]},{"l":"Tumour site and distance from anal verge (mm)","t":"t","h":""},{"l":"Tumour dimensions (mm) and % circumference","t":"t","h":""},{"l":"Tumour appearance","t":"c","o":["Polypoid","Ulcerated","Annular/stenosing","Mucinous"]},{"l":"Serosal breach / perforation?","t":"c","o":["No","Yes – at tumour","/ remote"]},{"l":"Distance to proximal margin (mm)","t":"t","h":""},{"l":"Distance to distal margin (mm)","t":"t","h":""},{"l":"Circumferential resection margin – inked, closest distance (mm)","t":"t","h":""},{"l":"Background bowel","t":"c","o":["Normal","Polyps – no. ____","Diverticula","Colitis"]}]},{"id":"VNL-H-029","title":"Colorectal resection – non-neoplastic","blocks":"Open, pin and fix. Blocks: representative sections from each anatomical segment (labelled), transition zones, deepest ulceration, all strictures, any mass lesion in full, both margins, and appendix/terminal ileum where present.","clinical":["The indication, the duration of disease and the current and previous therapy.","The endoscopic extent and distribution of disease.","Whether dysplasia has been found on surveillance biopsies, and where.","For Hirschsprung disease, the levels of any prior biopsies."],"handling":["Open along the antimesenteric border, rinse gently, pin flat on cork and fix overnight before dissection.","Do not scrub the mucosa; the surface epithelium carries the diagnosis.","Keep the specimen orientated so proximal and distal ends remain identifiable."],"steps":["Record the segments received and the total length, with each end identified.","Describe the serosal surface: fibrin, fat wrapping, adhesions, perforation and any fistula.","Open, pin and fix, then photograph the mucosal surface if possible.","Describe the mucosal disease and its distribution: continuous or segmental, diffuse or focal, and where each pattern lies.","Describe the ulceration: aphthous, linear, serpiginous or broad, and record the deepest point.","Record pseudopolyps, strictures with their number, site and length, and the maximum wall thickness.","Record diverticula with their number, distribution and any complication.","Examine specifically for any mass or plaque-like lesion; sample any such lesion in full.","Submit representative blocks from each anatomical segment, clearly labelled, plus the transition zones between involved and uninvolved bowel.","Submit the deepest ulceration, every stricture, both margins, and the appendix and terminal ileum where present.","Dissect and submit lymph nodes."],"pitfalls":["Sampling only the worst-affected area, so the distribution that distinguishes ulcerative colitis from Crohn disease cannot be assessed.","Missing a dysplasia-associated lesion because the mucosa was not examined systematically after fixation.","Failing to label segment blocks, so the extent of disease cannot be mapped."],"prompts":[{"l":"Indication","t":"c","o":["Ulcerative colitis","Crohn's disease","Diverticular disease","Ischaemia","Volvulus","Hirschsprung"]},{"l":"Segments received and length (mm)","t":"t","h":""},{"l":"Serosal surface","t":"c","o":["Normal","Fibrinous","Fat wrapping","Adhesions","Perforation"]},{"l":"Mucosal appearance and distribution","t":"c","o":["Continuous","Segmental/skip","Diffuse","Focal"]},{"l":"Ulceration – type and extent","t":"c","o":["Aphthous","Linear/serpiginous","Broad","Nil"]},{"l":"Pseudopolyps present?","t":"c","o":["No","Yes"]},{"l":"Strictures – number, site, length (mm)","t":"t","h":""},{"l":"Wall thickness – maximum (mm)","t":"t","h":""},{"l":"Diverticula – number, site, complications","t":"t","h":""},{"l":"Mass lesion or dysplasia-associated lesion?","t":"c","o":["No","Yes – sample fully"]},{"l":"Distance to margins (mm)","t":"t","h":"Proximal ____  Distal ____"},{"l":"Lymph nodes retrieved","t":"t","h":""}]},{"id":"VNL-H-030","title":"Polypectomy, EMR & ESD specimen","blocks":"Embed in entirety. Ink the stalk/deep margin. Pedunculated: bisect through the stalk, then slice parallel to the first cut. Sessile/EMR/ESD: slice at 2–3 mm perpendicular to the closest lateral margin, keeping slices in sequence.","clinical":["The site of the lesion and its endoscopic appearance and size.","Whether removal was en bloc or piecemeal.","Whether the endoscopist has pinned and orientated the specimen.","Any prior biopsy diagnosis."],"handling":["Where the endoscopist has pinned the specimen, fix it pinned and do not unpin it before inking.","Fix before slicing; unfixed mucosal resections curl and cannot be orientated.","Ink the deep margin, and the lateral margins for endoscopic mucosal and submucosal resections."],"steps":["Record the specimen type, the number of pieces and the overall dimensions.","Record the polyp head diameter and, where a stalk is present, its length and diameter.","Describe the surface: smooth, villous, ulcerated or depressed.","Ink the stalk or deep margin. For mucosal and submucosal resections, ink the lateral margins in a second colour.","Pedunculated polyp: bisect through the centre of the stalk, then slice each half parallel to that first cut at 2–3 mm.","Sessile polyp or mucosal resection: slice at 2–3 mm perpendicular to the closest lateral margin, keeping slices in strict sequence.","Embed the specimen in entirety, in order, so the involved margin can be localised.","Piecemeal specimens: embed all pieces and state on the worksheet that margins cannot be assessed."],"pitfalls":["Slicing a pedunculated polyp without first bisecting the stalk, so the stalk margin is never represented.","Failing to ink the deep margin, which determines whether an invasive polyp is completely excised.","Losing the sequence of slices in a large mucosal resection."],"prompts":[{"l":"Site of polyp / lesion","t":"t","h":""},{"l":"Specimen type","t":"c","o":["Snare polypectomy","EMR – en bloc","EMR – piecemeal","ESD"]},{"l":"Number of pieces","t":"t","h":""},{"l":"Pinned by endoscopist?","t":"c","o":["No","Yes"]},{"l":"Overall dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Polyp head diameter (mm)","t":"t","h":""},{"l":"Stalk present?","t":"c","o":["No – sessile","Yes – length ____ mm, diameter ____ mm"]},{"l":"Surface appearance","t":"c","o":["Smooth","Villous","Ulcerated","Depressed"]},{"l":"Deep / stalk margin inked?","t":"c","o":["Yes","No"]},{"l":"Lateral margins inked (EMR/ESD)?","t":"c","o":["Yes","No","N/A"]},{"l":"Slice interval used (mm)","t":"t","h":""},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No"]}]},{"id":"VNL-H-031","title":"Anal & perianal specimen","blocks":"Haemorrhoids and tags: 1–2 representative blocks unless a lesion is present. Excisions for neoplasia: ink margins and embed in entirety, sliced perpendicular to the anal canal axis.","clinical":["The site by clock position and the specimen type.","The clinical diagnosis and whether neoplasia is suspected.","HIV status or immunosuppression where anal intraepithelial neoplasia is a consideration.","Any pigmented lesion, which requires exclusion of melanoma."],"handling":["Fix before slicing. Anal specimens are small and distort.","Preserve any orientation marker until the corresponding margin is inked.","Ink margins on all excisions taken for neoplasia."],"steps":["Record the specimen type, the site by clock position and the dimensions.","Describe the mucosal or skin surface and any lesion, with its size and appearance.","Record ulceration and any pigmentation.","Ink the margins where the specimen is an excision for neoplasia and record the code.","Measure the distance from the lesion to the nearest margin.","Slice perpendicular to the axis of the anal canal at 2–3 mm, keeping the slices in order.","Haemorrhoids and skin tags: submit one to two representative blocks unless a lesion is present.","Excisions for neoplasia: embed in entirety, in sequence."],"pitfalls":["Treating a pigmented anal lesion as a haemorrhoid and sampling it representatively.","Slicing along rather than across the anal canal, so the transition zone is not represented.","Discarding haemorrhoidal tissue without examining it for an incidental neoplasm."],"prompts":[{"l":"Specimen type","t":"c","o":["Haemorrhoid","Fissure","Fistula track","Skin tag","Anal biopsy","Anal excision"]},{"l":"Site (o'clock position) and laterality","t":"t","h":""},{"l":"Clinical diagnosis","t":"t","h":""},{"l":"Number of pieces","t":"t","h":""},{"l":"Dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Mucosal / skin surface appearance","t":"t","h":""},{"l":"Lesion present?","t":"c","o":["No","Yes – size ____ mm"]},{"l":"Ulceration present?","t":"c","o":["No","Yes"]},{"l":"Pigmentation present?","t":"c","o":["No","Yes – exclude melanoma"]},{"l":"Margins inked?","t":"c","o":["N/A","Yes – code: ______"]},{"l":"Distance to nearest margin (mm)","t":"t","h":""},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No"]}]},{"id":"VNL-H-032","title":"Hernia sac, omentum & peritoneal specimen","blocks":"Hernia sac: 1–2 blocks. Staging omentum: slice at 10 mm through the entire specimen; sample every nodule plus a minimum of 4–5 random blocks if no lesion is visible.","clinical":["The specimen site and the operation performed.","Whether the specimen is a staging omentectomy, and the primary tumour if known.","Any clinical suspicion of tuberculosis or carcinomatosis.","For hernia sacs, whether bowel was compromised."],"handling":["Weigh omentectomy specimens.","Slice while fresh so fixative reaches the centre of the fat.","Send fresh tissue for mycobacterial culture where tuberculosis is suspected."],"steps":["Record the specimen type, site and dimensions, and weigh an omentectomy.","Describe the surface: smooth, fibrotic, nodular, granular or haemorrhagic.","Record any nodules with their number and size range, and any fat necrosis.","For a hernia sac, record the contents and any evidence of strangulation or ischaemia.","Slice the entire specimen at 10 mm and inspect every slice on both surfaces.","Hernia sac: submit one to two representative blocks.","Staging omentum with visible nodules: sample every nodule and record the largest deposit size.","Staging omentum with no visible lesion: submit a minimum of four to five random blocks from different areas.","Sample any adherent bowel wall or other structure separately."],"pitfalls":["Submitting a single block from a staging omentum, so microscopic disease is missed.","Failing to record the size of the largest deposit, which is required for staging.","Overlooking a small hernia sac tumour deposit because the specimen was assumed to be routine."],"prompts":[{"l":"Specimen type","t":"c","o":["Hernia sac","Omentum","Peritoneal biopsy","Appendices epiploicae"]},{"l":"Site and laterality","t":"t","h":""},{"l":"Indication","t":"c","o":["Hernia repair","Staging","?Carcinomatosis","?TB","Incidental"]},{"l":"Dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Weight (g) – omentectomy","t":"t","h":""},{"l":"Surface appearance","t":"c","o":["Smooth","Fibrotic","Nodular","Granular","Haemorrhagic"]},{"l":"Nodules present?","t":"c","o":["No","Yes – number ____, size range ____ mm"]},{"l":"Fat necrosis present?","t":"c","o":["No","Yes"]},{"l":"Contents within sac (bowel, fat, fluid)","t":"t","h":""},{"l":"Adhesions present?","t":"c","o":["No","Yes"]},{"l":"Number of slices examined","t":"t","h":""},{"l":"Number of blocks taken","t":"t","h":""}]}]},{"key":"HBP","name":"Liver, Biliary Tract & Pancreas","note":"Margins in hepatopancreatobiliary resections are numerous and easily lost — ink and photograph before slicing.","ink":"#047857","forms":[{"id":"VNL-H-033","title":"Liver needle biopsy","blocks":"Embed all cores in one cassette wherever possible, laid straight and parallel, so that all cores appear on the same level. Handle with a spatula, never forceps. Request the medical liver stain panel up front.","clinical":["The indication: medical liver disease, a focal lesion, staging or transplant assessment.","Liver function tests, viral serology and autoantibody results.","Alcohol history, metabolic risk factors and current medication.","Whether the biopsy is targeted at a lesion or a random parenchymal sample."],"handling":["Formalin. Handle cores with a spatula only; forceps fragment liver tissue.","Where copper or iron quantification is requested, a separate unfixed sample is required.","Send fresh tissue for microbiology where abscess or granulomatous disease is suspected."],"steps":["Record the number of cores and the length of each in millimetres. Total length determines adequacy.","Describe the colour: brown, pale, green in cholestasis, white where tumour is present, or mottled.","Record whether the cores are intact or fragmented, and the number of fragments.","Divert fresh tissue if electron microscopy, microbiology or biochemical quantification is required.","Lay all cores straight and parallel in a single cassette so every core appears at the same level.","Embed in entirety, using lens paper for fragmented tissue.","Request the medical liver panel with the initial H&E: reticulin, trichrome, Perls, PAS-diastase and orcein.","Request serial levels; portal tract number determines adequacy and is improved by levels."],"pitfalls":["Splitting cores between cassettes, so the pathologist counts portal tracts across separate levels.","Crushing the core with forceps, producing artefact that mimics fibrosis.","Ordering special stains only after the H&E, which wastes tissue on recuts."],"prompts":[{"l":"Indication","t":"c","o":["Medical liver disease","?Tumour","Transplant assessment","Staging"]},{"l":"Targeted or non-targeted?","t":"c","o":["Non-targeted","Targeted – lesion"]},{"l":"Number of cores","t":"t","h":""},{"l":"Core length (mm) – each","t":"t","h":""},{"l":"Core diameter / gauge","t":"t","h":""},{"l":"Colour","t":"c","o":["Brown","Pale/yellow","Green (cholestatic)","White (tumour)","Mottled"]},{"l":"Fragmented?","t":"c","o":["No","Yes – number of fragments ____"]},{"l":"Fresh tissue diverted?","t":"c","o":["No","Microbiology","EM","Biochemistry/copper-iron"]},{"l":"Marker dye used","t":"c","o":["Nil","Eosin","Other: ______"]},{"l":"Cassettes used","t":"t","h":""},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No"]},{"l":"Stains requested with H&E","t":"c","o":["Reticulin","Trichrome","Perls","PAS-D","Orcein"]}]},{"id":"VNL-H-034","title":"Liver resection","blocks":"Ink the resection margin, slice at 10 mm. Blocks: ≥4 through tumour including capsule and closest margin, tumour–non-tumour interface, each satellite nodule, hilar vessels/ducts, and ≥2 blocks of background liver away from tumour.","clinical":["The procedure and the segments resected.","The nature of the lesion on imaging and any prior biopsy diagnosis.","Whether there is known cirrhosis, viral hepatitis or a primary tumour elsewhere.","Any neoadjuvant chemotherapy or ablation."],"handling":["Ink the parenchymal resection margin before slicing.","Slice while fresh so fixative penetrates, then fix; liver fixes slowly.","Photograph the cut surface of a tumour before extensive sampling."],"steps":["Record the procedure, the specimen weight and its three dimensions.","Describe the capsular surface: smooth, nodular or cirrhotic, retracted over the tumour, or breached.","Ink the parenchymal resection margin.","Slice the specimen at 10 mm through the longest axis, keeping the slices in order.","Record the number of tumours and the three dimensions of the largest.","Describe each tumour: circumscribed, encapsulated, infiltrative, necrotic or bile-stained.","Record satellite nodules with their number and their distance from the main tumour.","Measure the distance from the tumour to the parenchymal margin.","Examine the hilar vessels and bile ducts for tumour thrombus or invasion.","Describe the background liver: normal, steatotic, fibrotic or cirrhotic.","Submit at least four blocks through the tumour including the capsule and the closest margin, the tumour-to-non-tumour interface, each satellite nodule, the hilar structures, and at least two blocks of background liver away from the tumour."],"pitfalls":["Failing to sample background liver, so underlying cirrhosis is not reported.","Missing vascular invasion by not examining the hilar vessels.","Sampling only the centre of a large tumour, which is necrotic."],"prompts":[{"l":"Procedure","t":"c","o":["Wedge","Segmentectomy – segment ____","Hemihepatectomy – R/L","Extended"]},{"l":"Specimen weight (g) and dimensions (mm)","t":"t","h":""},{"l":"Capsular surface","t":"c","o":["Smooth","Nodular/cirrhotic","Retracted over tumour","Breached"]},{"l":"Resection (parenchymal) margin inked?","t":"c","o":["Yes","No"]},{"l":"Number of tumours","t":"t","h":""},{"l":"Largest tumour dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Tumour appearance","t":"c","o":["Circumscribed","Encapsulated","Infiltrative","Necrotic","Bile-stained"]},{"l":"Satellite nodules present?","t":"c","o":["No","Yes – number ____"]},{"l":"Distance to parenchymal margin (mm)","t":"t","h":""},{"l":"Vascular / biliary involvement seen?","t":"c","o":["No","Yes – vessel: ______"]},{"l":"Background liver","t":"c","o":["Normal","Steatotic","Fibrotic","Cirrhotic"]},{"l":"Photographed?","t":"c","o":["No","Yes – ref: ______"]}]},{"id":"VNL-H-035","title":"Cholecystectomy & extrahepatic bile duct","blocks":"Routine: fundus, body and neck including the cystic duct margin in a single or three cassettes. If a mass, focal thickening, polyp or porcelain change is present, embed the entire gallbladder sequentially and include the cystic duct node.","clinical":["The indication and whether malignancy is suspected clinically or on imaging.","Whether the gallbladder was removed alone or as part of a larger resection.","Any known primary biliary or pancreatic tumour.","Whether the gallbladder was perforated at operation."],"handling":["Open the gallbladder longitudinally from fundus to neck as soon as practicable so fixative reaches the mucosa.","Retain calculi until the case is reported; describe and count them.","Ink the cystic duct margin and the liver bed surface where a tumour is present."],"steps":["Record the length and diameter, and describe the serosal surface including the liver bed.","Ink the cystic duct resection margin.","Open longitudinally from fundus to neck, avoiding any focal lesion.","Record the wall thickness at its maximum and describe the mucosa: velvety, congested, ulcerated, cholesterolotic or porcelain.","Count the calculi, record the size range and describe their type.","Examine the mucosa systematically for any mass, polyp or focal thickening.","Take a transverse section of the neck including the inked cystic duct margin.","Routine: submit fundus, body and neck with the cystic duct margin.","Where a mass, polyp, focal thickening or porcelain change is present, embed the entire gallbladder sequentially and submit the cystic duct node.","Identify and submit the cystic duct lymph node in every case where it can be found."],"pitfalls":["Discarding the gallbladder after three routine blocks when a subtle wall thickening was not palpated.","Failing to ink and section the cystic duct margin, which is the critical margin in incidental carcinoma.","Not looking for the cystic duct node."],"prompts":[{"l":"Specimen","t":"c","o":["Gallbladder","+ cystic duct node","+ bile duct","Liver bed tissue"]},{"l":"Indication","t":"c","o":["Calculous disease","Cholecystitis","Polyp","?Malignancy","Incidental"]},{"l":"Dimensions (mm)","t":"t","h":"____ (length) × ____ (diameter)"},{"l":"Serosal surface","t":"c","o":["Smooth","Fibrinous","Adhesions","Perforated","Liver bed rough"]},{"l":"Wall thickness – maximum (mm)","t":"t","h":""},{"l":"Mucosa","t":"c","o":["Velvety/normal","Congested","Ulcerated","Cholesterolosis","Porcelain"]},{"l":"Calculi present?","t":"c","o":["No","Yes – number ____, size range ____ mm"]},{"l":"Calculus type","t":"c","o":["Cholesterol","Pigment","Mixed","N/A"]},{"l":"Mass / polyp / thickened area?","t":"c","o":["No","Yes – site & size: ______"]},{"l":"Cystic duct margin identified and inked?","t":"c","o":["Yes","No"]},{"l":"Cystic duct node present?","t":"c","o":["No","Yes"]},{"l":"Blocks taken","t":"c","o":["Routine – 3 (fundus, body, neck + duct margin)","Extended – lesion present"]}]},{"id":"VNL-H-036","title":"Pancreatic resection (Whipple / distal / total)","blocks":"Photograph, ink all named margins in separate colours and take the pancreatic neck and bile duct margins as en-face shaves first. Slice the head in the axial plane at 5 mm. Blocks: tumour with each closest margin, ampulla/duct confluence, background pancreas, and all nodes by station.","clinical":["The procedure and every component resected.","The suspected primary site: pancreatic head, ampulla, distal bile duct or duodenum. These have different outcomes.","Neoadjuvant therapy and any prior biopsy or stent.","Whether a vein resection was performed and how it is labelled."],"handling":["Photograph the intact specimen before inking.","Take the pancreatic neck and bile duct transection margins as en-face shaves before any other cut.","Ink each named margin in a separate colour: pancreatic neck, bile duct, posterior, superior mesenteric vein groove and superior mesenteric artery (uncinate).","Fix after axial slicing; the pancreas autolyses rapidly."],"steps":["Record every component received and the dimensions of the pancreas.","Take the pancreatic neck and bile duct margins as en-face shaves and identify them as such.","Ink all named circumferential margins in distinct colours and record the code on the worksheet.","Slice the pancreatic head in the axial plane, perpendicular to the duodenal axis, at 5 mm, keeping the slices in order.","Identify the tumour and record its site, its three dimensions and its appearance.","Record the distance from the tumour to each named margin in millimetres.","Record the diameter of the pancreatic and bile ducts and any obstruction.","Describe the background pancreas: normal, atrophic, fibrotic or chronic pancreatitis.","Submit the tumour with each closest margin in continuity, the ampulla and duct confluence, the duodenal mucosa, and background pancreas.","Dissect all lymph nodes and submit them by station.","Sample any resected vessel segment, recording whether tumour involves the wall."],"pitfalls":["Failing to distinguish the uncinate (superior mesenteric artery) margin, which is the most frequently involved.","Slicing in the wrong plane, so the relationship of tumour to ampulla and ducts cannot be determined.","Delaying fixation, so autolysis obscures the histology."],"prompts":[{"l":"Procedure","t":"c","o":["Pancreaticoduodenectomy","Pylorus-preserving","Distal + spleen","Total"]},{"l":"Components received","t":"c","o":["Pancreas","Duodenum","Stomach","Bile duct","Gallbladder","Spleen"]},{"l":"Specimen dimensions (mm) – pancreas","t":"t","h":""},{"l":"Margins inked (state colour code)","t":"t","h":"Pancreatic neck ____ Bile duct ____ Posterior ____ SMV groove ____ SMA/uncinate ____"},{"l":"Tumour site","t":"c","o":["Head","Uncinate","Neck","Body","Tail","Ampulla","Distal CBD","Duodenum"]},{"l":"Tumour dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Tumour appearance","t":"c","o":["Firm white/scirrhous","Cystic","Fleshy","Ampullary polypoid"]},{"l":"Distance to each named margin (mm)","t":"t","h":""},{"l":"Duct dilatation","t":"c","o":["Nil","Pancreatic duct ____ mm","Bile duct ____ mm"]},{"l":"Vessel resected / involved?","t":"c","o":["No","Yes – vessel: ______"]},{"l":"Background pancreas","t":"c","o":["Normal","Atrophic/fibrotic","Chronic pancreatitis"]},{"l":"Lymph nodes retrieved (by station)","t":"t","h":""}]}]},{"key":"GU","name":"Genitourinary","note":"Weigh, measure and ink before incising. Prostate and kidney specimens depend on accurate margin and capsule assessment.","ink":"#0E7490","forms":[{"id":"VNL-H-037","title":"Genitourinary small biopsies (bladder, prostate needle, renal)","blocks":"Embed all tissue in entirety. Prostate cores: one site per cassette, maximum 2–3 cores laid parallel. Renal medical biopsies: divide under the dissecting microscope for light microscopy, immunofluorescence and EM before fixation.","clinical":["The specimen type and the precise site of each container.","For prostate cores, the site and side of each container as labelled by the urologist.","PSA level and digital rectal examination findings for prostate biopsies.","For renal medical biopsies, the renal function, proteinuria and serological results, and confirmation that immunofluorescence and electron microscopy are required."],"handling":["Renal medical biopsies must be divided fresh under a dissecting microscope before fixation, with tissue allocated to light microscopy, immunofluorescence and electron microscopy.","Prostate and bladder biopsies go into formalin; never combine sites.","Handle cores with a spatula; use a marker dye and lens paper."],"steps":["Record the specimen type, the number of containers and the site of each as labelled.","For each container, record the number of cores or fragments and the length range.","Describe the appearance of the tissue.","Renal biopsy: examine under the dissecting microscope, confirm cortex is present, and divide the core, allocating tissue to immunofluorescence and electron microscopy before the remainder is fixed.","Prostate cores: place one site per cassette, no more than two to three cores laid straight and parallel.","Bladder biopsies and transurethral resections: embed all tissue in entirety, one site per cassette.","Apply a marker dye and embed all fragments.","Request levels routinely, and additional levels for renal biopsies."],"pitfalls":["Fixing a renal medical biopsy whole, which makes immunofluorescence and electron microscopy impossible.","Combining prostate sites, so a positive core cannot be localised for treatment planning.","Overloading a cassette with cores, so the deepest are never sectioned."],"prompts":[{"l":"Specimen type","t":"c","o":["Bladder biopsy/TURBT","Prostate needle core","Renal medical biopsy","Ureter/urethra"]},{"l":"Site(s) as labelled / number of containers","t":"t","h":""},{"l":"Prostate cores: site and side per container","t":"t","h":""},{"l":"Number of fragments / cores per container","t":"t","h":""},{"l":"Core length range (mm)","t":"t","h":""},{"l":"Aggregate dimensions (mm)","t":"t","h":""},{"l":"Appearance","t":"c","o":["Tan/pink","White/firm","Haemorrhagic","Necrotic"]},{"l":"Renal biopsy: cortex identified?","t":"c","o":["Yes","No","N/A"]},{"l":"Renal biopsy: tissue divided for IF/EM?","t":"c","o":["N/A","Yes – IF","EM"]},{"l":"Marker dye used","t":"t","h":""},{"l":"Cassettes used","t":"t","h":""},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No"]}]},{"id":"VNL-H-038","title":"Transurethral resection of prostate (TURP) chips","blocks":"Chips ≤12 g: embed in entirety (approx. 1 g per cassette, 6–8 cassettes). Larger specimens: embed the first 12 g plus one cassette per additional 5 g, and retain the remainder. Embed all chips in entirety in men under 60.","clinical":["The indication and whether carcinoma is suspected or already known.","PSA level and prostate size on imaging.","Patient age; sampling policy is more complete in younger men.","Any prior prostate biopsy or transurethral resection."],"handling":["Weigh the chips as an aggregate before embedding.","Do not wash the chips down the sink; use a fine sieve.","Fix adequately before embedding; cauterised chips are friable."],"steps":["Record the aggregate weight in grams and the number of containers.","Record the size range of the chips and describe their appearance: tan and rubbery, yellow and nodular, or with firm white areas.","Look for and separate any firm, white or gritty chips, which are more likely to contain tumour, and embed these in an identified cassette.","Weigh the tissue embedded and record the number of cassettes.","For 12 g or less: embed all chips in entirety, at approximately 1 g per cassette.","For more than 12 g: embed the first 12 g plus one cassette per additional 5 g, and retain the remainder.","In men under 60, or where carcinoma is suspected, embed all chips regardless of weight.","Record where residual tissue is retained and for how long."],"pitfalls":["Embedding a fixed number of cassettes regardless of the weight received.","Discarding residual chips before the slides have been reported.","Failing to weigh the specimen, so the adequacy of sampling cannot be judged."],"prompts":[{"l":"Indication","t":"c","o":["Obstruction/BPH","Retention","?Carcinoma","Known carcinoma"]},{"l":"Aggregate weight (g)","t":"t","h":""},{"l":"Number of containers","t":"t","h":""},{"l":"Chip size range (mm)","t":"t","h":""},{"l":"Appearance","t":"c","o":["Tan/rubbery","Yellow/nodular","White/firm areas","Haemorrhagic","Cauterised"]},{"l":"Suspicious firm white chips identified?","t":"c","o":["No","Yes – embedded separately"]},{"l":"Weight embedded (g)","t":"t","h":""},{"l":"Number of cassettes used","t":"t","h":""},{"l":"Sampling policy applied","t":"c","o":["All chips embedded","First 8 cassettes + 1 per additional 5 g"]},{"l":"Residual tissue retained?","t":"c","o":["No – all embedded","Yes – location: ______"]},{"l":"Age of patient (guides completeness of sampling)","t":"t","h":""},{"l":"Pathologist consulted on sampling?","t":"c","o":["No","Yes"]}]},{"id":"VNL-H-039","title":"Radical prostatectomy","blocks":"Ink right and left in different colours. Amputate apex and base, section radially. Slice the remaining gland transversely at 3–5 mm from apex to base, keeping slices in order and left/right identified. Embed in entirety where feasible; otherwise submit all posterior slices plus alternate anterior slices.","clinical":["The biopsy Gleason score and the sites involved.","PSA level and clinical stage.","Whether nerve-sparing surgery was performed and whether nodes were taken.","Any neoadjuvant hormonal therapy."],"handling":["Weigh the gland with and without seminal vesicles and record both.","Ink right and left in different colours before any incision so laterality is preserved on every slide.","Fix the inked gland overnight before slicing; unfixed prostate distorts badly."],"steps":["Weigh the specimen and record the three dimensions of the gland.","Describe the capsular surface and note any incision, breach or adherent tissue.","Ink the right and left sides in different colours, and the anterior and posterior aspects if local protocol requires.","Amputate the apex and the base as cones and section them radially, so the true margin is assessed perpendicular to the surface.","Take the bladder neck margin.","Slice the remaining gland transversely at 3–5 mm from apex to base, perpendicular to the urethral axis, keeping slices in order and left and right identifiable.","Record any visible tumour with its site and size, and any transition zone nodularity.","Submit the gland in entirety where feasible; otherwise submit all posterior slices and alternate anterior slices, recording the policy used.","Submit both seminal vesicles at their junction with the prostate.","Submit pelvic nodes by side."],"pitfalls":["Taking the apex as a transverse shave, which produces a false positive margin.","Losing left–right orientation, so a positive margin cannot be localised.","Slicing before fixation, which smears ink into the gland."],"prompts":[{"l":"Procedure","t":"c","o":["Open","Laparoscopic/robotic","+ nerve sparing","+ node dissection"]},{"l":"Weight (g) with / without seminal vesicles","t":"t","h":""},{"l":"Prostate dimensions (mm)","t":"t","h":"____ (SI) × ____ (TV) × ____ (AP)"},{"l":"Capsular surface","t":"c","o":["Smooth","Bulging","Incised/breached","Adherent tissue"]},{"l":"Inking code","t":"t","h":"Right ____  Left ____  Anterior ____  Posterior ____"},{"l":"Apical margin taken (cone or shave)?","t":"c","o":["Cone – radial","Shave","Not taken"]},{"l":"Bladder neck margin taken?","t":"c","o":["Yes","No"]},{"l":"Seminal vesicles present?","t":"c","o":["Both","Right only","Left only","Absent"]},{"l":"Tumour visible on cut surface?","t":"c","o":["No","Yes – site & size: ______"]},{"l":"Nodularity / BPH change","t":"c","o":["Nil","Transition zone nodules"]},{"l":"Slice interval used (mm)","t":"t","h":""},{"l":"Pelvic lymph nodes received?","t":"c","o":["No","Yes – sides: ______"]}]},{"id":"VNL-H-040","title":"Nephrectomy – tumour","blocks":"Ink perinephric fat and the vascular/ureteric margins. Bivalve along the greater curvature through the hilum. Blocks: ≥3 through tumour (one per cm) including capsule, perinephric fat and sinus; tumour–kidney interface; renal vein margin; ureteric margin; background cortex ×2; adrenal; and all hilar nodes.","clinical":["The procedure, the side and the imaging appearance and size of the tumour.","Whether the adrenal, ureter or a bladder cuff is included.","Whether there is a renal vein or caval thrombus on imaging.","Any prior biopsy or ablation, and any known syndrome."],"handling":["Ink the perinephric fat and Gerota's fascia over the tumour before incision.","Take the renal vein, artery and ureteric margins before bivalving.","Bivalve while fresh so fixative reaches the tumour, then fix."],"steps":["Record the procedure, the side, the weight and the dimensions of the kidney and of any attached structures.","Ink the perinephric fat over and around the tumour.","Take en-face margins from the renal artery, renal vein and ureter.","Open the renal vein and record whether tumour thrombus is present and how far it extends.","Bivalve the kidney along its greater curvature through the hilum in a single plane.","Record the tumour site, its three dimensions and its appearance: golden, tan, cystic, necrotic or haemorrhagic.","Record whether the tumour breaches the renal capsule into perinephric fat, and whether it involves the renal sinus fat or the collecting system.","Measure the distance from the tumour to the closest margin and name that margin.","Submit at least three blocks through the tumour, one per centimetre, including the capsule, perinephric fat and sinus.","Submit the tumour-to-kidney interface, the vascular and ureteric margins, at least two blocks of background cortex, the adrenal, and all hilar nodes."],"pitfalls":["Failing to sample the renal sinus fat, which upstages the tumour when involved.","Not opening the renal vein, so a thrombus is missed.","Sampling only tumour, so a background nephropathy relevant to residual renal function is not reported."],"prompts":[{"l":"Procedure","t":"c","o":["Radical","Partial","Simple","+ adrenal","+ ureter/bladder cuff"]},{"l":"Laterality","t":"c","o":["Right","Left"]},{"l":"Weight (g) and kidney dimensions (mm)","t":"t","h":""},{"l":"Perinephric fat / Gerota's fascia inked?","t":"c","o":["Yes","No"]},{"l":"Tumour dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Tumour site","t":"c","o":["Upper pole","Mid","Lower pole","Hilar","Multifocal"]},{"l":"Tumour appearance","t":"c","o":["Golden/yellow","Tan","Cystic","Necrotic","Haemorrhagic"]},{"l":"Capsule breach / perinephric fat invasion?","t":"c","o":["No","Yes"]},{"l":"Renal sinus fat involvement?","t":"c","o":["No","Yes"]},{"l":"Renal vein involvement – thrombus?","t":"c","o":["No","Yes – extent: ______"]},{"l":"Distance to closest margin (mm) / which","t":"t","h":""},{"l":"Adrenal, ureteric margin and background kidney findings","t":"t","h":""}]},{"id":"VNL-H-041","title":"Nephrectomy – non-neoplastic & renal medical specimen","blocks":"Bivalve through the hilum. Blocks: upper pole, mid and lower pole cortex/medulla, pelvis and calyces, any focal lesion in full, renal artery and vein, and ureteric margin. Sample any solid area to exclude neoplasia.","clinical":["The indication and the side.","The duration of obstruction, infection or non-function.","Whether the kidney is a failed transplant, and the transplant history.","Any imaging suspicion of a mass."],"handling":["Weigh the kidney and record whether the capsule strips easily.","Bivalve while fresh so fixative reaches the medulla.","Retain calculi and describe them."],"steps":["Record the side, the weight and the three dimensions.","Attempt to strip the capsule and record whether it strips easily or is adherent.","Describe the external surface: smooth, finely granular, coarsely scarred or cystic.","Bivalve through the hilum and measure the cortical thickness.","Record whether the corticomedullary demarcation is distinct, blurred or lost.","Describe the pelvicalyceal system: dilatation, calyceal blunting, purulent contents or urothelial thickening.","Record calculi with their number, size and site, and cysts with their number and size range.","Examine every cut surface for an unexpected solid lesion, and change to the tumour worksheet if one is found.","Submit upper pole, mid and lower pole blocks each including cortex and medulla, the pelvis and calyces, the renal artery and vein, and the ureteric margin.","Sample any focal lesion in full."],"pitfalls":["Discarding a non-functioning kidney after two blocks and missing an incidental carcinoma.","Failing to sample the pelvis, where urothelial carcinoma arises.","Not recording cortical thickness, which reflects the degree of chronic damage."],"prompts":[{"l":"Indication","t":"c","o":["Non-function","Chronic infection","Obstruction/hydronephrosis","Calculi","Trauma","Transplant failure"]},{"l":"Laterality","t":"c","o":["Right","Left"]},{"l":"Weight (g) and dimensions (mm)","t":"t","h":""},{"l":"Capsule strips easily?","t":"c","o":["Yes","No – adherent"]},{"l":"External surface","t":"c","o":["Smooth","Finely granular","Coarsely scarred","Cystic"]},{"l":"Cortical thickness (mm)","t":"t","h":""},{"l":"Corticomedullary demarcation","t":"c","o":["Distinct","Blurred","Lost"]},{"l":"Pelvicalyceal system","t":"c","o":["Normal","Dilated","Blunted calyces","Purulent"]},{"l":"Calculi present?","t":"c","o":["No","Yes – number/size/site: ______"]},{"l":"Cysts present?","t":"c","o":["No","Yes – number, size range: ______"]},{"l":"Unexpected tumour identified?","t":"c","o":["No","Yes – use VNL-H-040"]},{"l":"Vessels – atheroma / thrombus","t":"t","h":""}]},{"id":"VNL-H-042","title":"Cystectomy / cystoprostatectomy","blocks":"Open anteriorly (or through the urethra), pin and fix. Blocks: ≥4 through tumour to deepest point with perivesical margin, tumour–normal interface, trigone, both ureteric orifices, ureteric and urethral margins, all four quadrants of background mucosa, prostate/uterus where included, and all pelvic nodes by side.","clinical":["The procedure and every component resected.","The tumour site, grade and stage on prior transurethral resection.","Neoadjuvant chemotherapy, which requires assessment of response.","Whether the urethral margin and ureteric margins were sent separately at operation."],"handling":["Ink the perivesical soft tissue before opening.","Open the bladder anteriorly, from the urethra to the dome, avoiding the tumour; pin flat and fix overnight.","Take the ureteric and urethral margins before opening."],"steps":["Record the procedure and every component: bladder, prostate, seminal vesicles, uterus, adnexa, urethra, ureters.","Take en-face margins from both ureters and the urethra before opening.","Ink the perivesical surface, particularly over the tumour.","Open the bladder anteriorly, avoiding the tumour, then pin flat mucosa up and fix overnight.","Record the tumour site, its three dimensions and its appearance: papillary, solid, ulcerated or flat.","Record the macroscopic depth of invasion and the wall thickness.","Measure the distance from the tumour to the perivesical margin.","Describe the background mucosa in all four quadrants: erythema, trabeculation, diverticula or a second lesion.","Submit at least four blocks through the tumour to the deepest point with the perivesical margin in continuity.","Submit the tumour-to-normal interface, the trigone, both ureteric orifices, both ureteric and the urethral margins, and background mucosa from each quadrant.","Submit the prostate or uterus and adnexa where included, and all pelvic nodes by side."],"pitfalls":["Failing to demonstrate the deepest invasion in continuity with the perivesical margin.","Not sampling background mucosa, so carcinoma in situ is missed.","Opening through the tumour."],"prompts":[{"l":"Procedure","t":"c","o":["Partial","Radical cystectomy","Cystoprostatectomy","Anterior exenteration"]},{"l":"Neoadjuvant therapy?","t":"c","o":["No","Yes"]},{"l":"Components received","t":"t","h":""},{"l":"Bladder dimensions (mm) and wall thickness (mm)","t":"t","h":""},{"l":"Serosal / perivesical surface inked?","t":"c","o":["Yes","No"]},{"l":"Tumour site","t":"c","o":["Trigone","Posterior","Lateral R/L","Dome","Anterior","Diffuse"]},{"l":"Tumour dimensions (mm) and appearance","t":"c","o":["Papillary","Solid","Ulcerated","Flat"]},{"l":"Macroscopic depth of invasion","t":"c","o":["Mucosa","Muscularis","Perivesical fat","Adjacent organ"]},{"l":"Distance to perivesical (radial) margin (mm)","t":"t","h":""},{"l":"Ureteric margins taken?","t":"c","o":["Right","Left","N/A"]},{"l":"Urethral margin taken?","t":"c","o":["Yes","No"]},{"l":"Background mucosa","t":"c","o":["Normal","Erythematous","Trabeculated","Diverticula"]}]},{"id":"VNL-H-043","title":"Orchidectomy & testicular specimen","blocks":"Take the cord margin first, then further cord sections at 20 mm intervals. Bivalve the testis sagittally and fix before slicing at 3 mm. Blocks: one per cm of tumour (≥3), tumour with tunica and rete, background testis ×2, epididymis, and cord base.","clinical":["The side, the procedure and the indication.","Serum tumour markers before and after orchidectomy where a germ cell tumour is suspected.","Imaging findings, including any retroperitoneal disease.","Any history of cryptorchidism or prior contralateral tumour."],"handling":["Take the spermatic cord margin before opening the testis, to avoid contamination.","Bivalve the testis and fix before slicing further; unfixed testis smears easily.","Where a germ cell tumour is suspected, consider fresh tissue for the tumour bank after discussion with the pathologist."],"steps":["Record the side, the procedure and the indication.","Measure the testis in three dimensions, weigh it, and record the length of the spermatic cord.","Take an en-face section of the cord margin first, then further cord sections at 20 mm intervals.","Ink the cord margin and the tunica where a tumour approaches it.","Describe the tunica surface: smooth, thickened, adherent, breached or haemorrhagic.","Bivalve the testis sagittally through the rete and fix.","Slice at 3 mm and record the tumour dimensions and appearance: homogeneous tan, variegated, cystic, haemorrhagic or necrotic.","Record involvement of the rete testis, epididymis, cord, tunica albuginea and tunica vaginalis.","Submit at least three blocks of tumour, one per centimetre, sampling every area of differing appearance since germ cell tumours are heterogeneous.","Submit the tumour with the tunica and rete, at least two blocks of background testis, the epididymis and the cord base."],"pitfalls":["Sampling only one area of a variegated germ cell tumour, so a component that changes management is missed.","Taking the cord margin last, after the knife has passed through tumour.","Failing to sample background testis, where intratubular germ cell neoplasia is found."],"prompts":[{"l":"Laterality","t":"c","o":["Right","Left"]},{"l":"Procedure","t":"c","o":["Radical inguinal","Scrotal","Simple/subcapsular","Biopsy","Hydrocele sac"]},{"l":"Indication","t":"c","o":["?Tumour","Torsion","Infection","Infertility","Prostate cancer control"]},{"l":"Testis dimensions (mm) and weight (g)","t":"t","h":""},{"l":"Spermatic cord length (mm) – margin inked?","t":"c","o":["Yes","No"]},{"l":"Tunica surface","t":"c","o":["Smooth","Thickened","Adherent","Breached","Haemorrhagic"]},{"l":"Tumour present?","t":"c","o":["No","Yes"]},{"l":"Tumour dimensions (mm) and appearance","t":"c","o":["Homogeneous tan","Variegated","Cystic","Haemorrhagic/necrotic"]},{"l":"Rete testis / epididymis / cord involvement?","t":"c","o":["No","Yes – which: ______"]},{"l":"Tunica albuginea / vaginalis breach?","t":"c","o":["No","Yes"]},{"l":"Background testis appearance","t":"c","o":["Normal","Atrophic","Scarred","Infarcted"]},{"l":"Fresh tissue for tumour bank / cytogenetics?","t":"c","o":["No","Yes"]}]},{"id":"VNL-H-044","title":"Penis, foreskin & circumcision","blocks":"Routine circumcision: 2–3 representative full-thickness blocks including inner and outer surfaces. Lesional: ink margins and sample the lesion at its deepest point, the lesion–normal interface, all margins including urethral, and any inguinal nodes received.","clinical":["The specimen type, the site of any lesion and the indication.","Whether carcinoma is suspected and any prior biopsy diagnosis.","Whether inguinal nodes were sampled at the same operation.","HPV status or lichen sclerosus history where relevant."],"handling":["Fix before slicing. Preserve orientation in penectomy specimens.","Ink the urethral, shaft skin and deep corporal margins before slicing.","Photograph a penectomy specimen before dissection."],"steps":["Record the specimen type, the indication and the dimensions.","Describe the skin and mucosal surfaces, including the glans, coronal sulcus and both foreskin surfaces.","Record any lesion: site, size, appearance and whether it is exophytic, ulcerated, flat or pigmented.","Estimate the depth of invasion and note whether the corpus spongiosum or cavernosum appears involved.","Take en-face margins from the urethra and the shaft skin and soft tissue in penectomy specimens.","Ink all margins and record the code.","Slice perpendicular to the long axis at 3–5 mm through the lesion.","Routine circumcision: submit two to three full-thickness representative blocks including inner and outer surfaces.","Lesional specimens: submit the lesion at its deepest point, the lesion-to-normal interface, all margins including urethral, background skin, and all inguinal nodes."],"pitfalls":["Treating a circumcision taken for a lesion as a routine specimen.","Omitting the urethral margin in a partial penectomy.","Failing to sample background foreskin for lichen sclerosus or intraepithelial neoplasia."],"prompts":[{"l":"Specimen type","t":"c","o":["Circumcision – routine","Circumcision – lesion","Partial penectomy","Total penectomy","Biopsy"]},{"l":"Indication","t":"c","o":["Phimosis","Religious/elective","Lichen sclerosus","?Carcinoma","Condyloma"]},{"l":"Dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Mucosal / skin surface appearance","t":"t","h":""},{"l":"Lesion present?","t":"c","o":["No","Yes"]},{"l":"Lesion site","t":"c","o":["Glans","Coronal sulcus","Foreskin – inner","Foreskin – outer","Shaft"]},{"l":"Lesion dimensions (mm) and appearance","t":"c","o":["Exophytic","Ulcerated","Flat/white","Pigmented"]},{"l":"Depth of invasion (macroscopic, mm)","t":"t","h":""},{"l":"Corpora involvement suspected?","t":"c","o":["No","Spongiosum","Cavernosum"]},{"l":"Urethral margin taken (penectomy)?","t":"c","o":["Yes","No","N/A"]},{"l":"Shaft / skin margins inked?","t":"c","o":["Yes","No"]},{"l":"Distance to nearest margin (mm)","t":"t","h":""}]},{"id":"VNL-H-045","title":"Ureter, urethra & other genitourinary specimen","blocks":"Take both margins as en-face shaves. Serially section the remaining segment transversely at 3–5 mm; sample all lesions in full plus representative uninvolved segments. Include the bladder cuff in nephroureterectomy specimens.","clinical":["The specimen site, side and the operation.","Whether a urothelial tumour is known elsewhere in the tract.","Imaging findings and the site of any filling defect or stricture.","For nephroureterectomy, whether a bladder cuff was taken."],"handling":["Identify and ink both ends before sectioning; the proximal and distal margins are not interchangeable.","Fix before sectioning; ureter is thin-walled and collapses.","Keep any bladder cuff attached and orientated."],"steps":["Record the specimen type, side, length and diameter.","Identify both ends and ink the margins in different colours.","Take en-face sections of the proximal and distal margins, including the bladder cuff margin where present.","Open the segment longitudinally, or section transversely if a lesion is present.","Describe the mucosa: normal, erythematous, papillary or ulcerated.","Record any lesion with its site, size, appearance and distance from each margin.","Record the wall thickness, any stricture and its length, and any periureteric fat involvement.","Section the remaining segment transversely at 3–5 mm and sample all lesions in full plus representative uninvolved segments.","Embed short segments in entirety."],"pitfalls":["Failing to distinguish the two ends, so an involved margin cannot be localised.","Missing a flat urothelial lesion because the mucosa was not examined after fixation.","Omitting the bladder cuff margin in nephroureterectomy."],"prompts":[{"l":"Specimen type","t":"c","o":["Ureter segment","Nephroureterectomy ureter","Urethral specimen","Bladder diverticulum","Urachal"]},{"l":"Laterality and site","t":"t","h":""},{"l":"Length (mm) × diameter (mm)","t":"t","h":""},{"l":"Both ends identified / margins inked?","t":"c","o":["Yes","No"]},{"l":"Mucosal appearance","t":"c","o":["Normal","Erythematous","Papillary","Ulcerated"]},{"l":"Lesion present?","t":"c","o":["No","Yes – site, size, appearance: ______"]},{"l":"Distance to proximal margin (mm)","t":"t","h":""},{"l":"Distance to distal / bladder cuff margin (mm)","t":"t","h":""},{"l":"Wall thickness (mm)","t":"t","h":""},{"l":"Periureteric fat involvement?","t":"c","o":["No","Yes"]},{"l":"Stricture present?","t":"c","o":["No","Yes – length ____ mm"]},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No"]}]}]},{"key":"GYN","name":"Gynaecology & Perinatal","note":"Orientation of cervical and vulval specimens, and full sampling of ovarian and placental specimens, are the recurrent pitfalls.","ink":"#7C3AED","forms":[{"id":"VNL-H-046","title":"Cervical biopsy, LLETZ & cone biopsy","blocks":"Embed in entirety. Ink ectocervical and endocervical margins in different colours. Open the cone at 12 o'clock and slice radially at 2–3 mm, keeping slices in clock-face sequence and recording which block corresponds to which o'clock position.","clinical":["The referral cytology result and HPV status.","Colposcopic findings and the position of the abnormality by clock face.","Whether the woman is pregnant or wishes to preserve fertility.","Any previous cervical treatment, with the laboratory number."],"handling":["Fix before slicing. Unfixed cone specimens distort and the ectocervical epithelium detaches.","Do not remove an orientation suture until the corresponding point has been recorded.","Ink ectocervical and endocervical margins in different colours before slicing."],"steps":["Record the specimen type, the referral cytology and the dimensions: diameter and length or depth.","Record the orientation suture and the clock position it marks.","Describe the ectocervical surface: acetowhite change, erosion, polyp or tumour, and its clock position.","Identify the transformation zone and record whether it is fully represented.","Ink the ectocervical (radial) margin and the endocervical (deep) margin in different colours and record the code.","Open the cone at the 12 o'clock position, or at the point marked by the surgeon.","Slice radially at 2–3 mm, working around the clock face, keeping the slices in strict order.","Embed the entire specimen in sequence, recording which block corresponds to which clock position.","Punch biopsies and curettings: embed in entirety with levels."],"pitfalls":["Embedding out of sequence, so an involved margin cannot be localised for further treatment.","Failing to ink both margins, so ectocervical and endocervical involvement cannot be distinguished.","Slicing before fixation, so the epithelium is stripped."],"prompts":[{"l":"Specimen type","t":"c","o":["Punch biopsy","LLETZ/LEEP","Cold knife cone","Endocervical curettings"]},{"l":"Referral cytology / HPV result","t":"t","h":""},{"l":"Number of pieces","t":"t","h":""},{"l":"Dimensions (mm)","t":"t","h":"____ (diameter) × ____ (length/depth)"},{"l":"Orientation suture present?","t":"c","o":["No","Yes – at ____ o'clock"]},{"l":"Ectocervical surface appearance","t":"c","o":["Smooth","Acetowhite area","Erosion","Polyp","Tumour"]},{"l":"Lesion visible?","t":"c","o":["No","Yes – size ____ mm, position ____ o'clock"]},{"l":"Transformation zone identifiable?","t":"c","o":["Yes","No"]},{"l":"Ectocervical (radial) margin inked?","t":"c","o":["Yes","No – code: ______"]},{"l":"Endocervical (deep) margin inked?","t":"c","o":["Yes","No"]},{"l":"Slice interval (mm) and orientation of slicing","t":"t","h":""},{"l":"Entire specimen embedded, in sequence?","t":"c","o":["Yes","No"]}]},{"id":"VNL-H-047","title":"Endometrial curettings, pipelle & endometrial biopsy","blocks":"Embed in entirety, using a fine sieve or nylon bag. Wrap scant tissue in lens paper. A discrete polyp is embedded separately and, if small, in entirety. Request 3 levels routinely.","clinical":["The indication, the age of the woman and her menopausal status.","Last menstrual period and any hormonal therapy, including tamoxifen.","Endometrial thickness on ultrasound.","Whether pregnancy is possible."],"handling":["Formalin. Use a fine sieve or nylon bag; endometrial curettings are easily lost.","Separate blood clot from tissue by floating, but retain the clot until the tissue has been identified.","Wrap scant tissue in lens paper."],"steps":["Record the specimen type, the indication and the clinical history.","Record the aggregate dimensions and, where the volume is small, describe it as scant.","Describe the appearance: tan strips, haemorrhagic, mucoid, polypoid, or necrotic and friable.","Separate and embed any discrete polyp in its own cassette, in entirety if small.","Float the tissue and separate blood clot; look specifically for chorionic villi if pregnancy is possible.","Apply a marker dye and embed all tissue in entirety.","Record the number of cassettes used and count fragments where the sample is scant.","Request three levels routinely."],"pitfalls":["Discarding blood clot that contains the only diagnostic tissue.","Missing products of conception in a woman assumed to be postmenopausal.","Reporting 'insufficient' without embedding the entire specimen."],"prompts":[{"l":"Specimen type","t":"c","o":["Pipelle","D&C curettings","Hysteroscopic","Polypectomy"]},{"l":"Clinical indication","t":"c","o":["PMB","AUB/menorrhagia","Infertility","Thickened endometrium","?Malignancy"]},{"l":"LMP / hormone therapy","t":"t","h":""},{"l":"Aggregate dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Aggregate volume / weight (g)","t":"t","h":""},{"l":"Appearance","t":"c","o":["Tan strips","Haemorrhagic","Mucoid","Polypoid","Necrotic/friable"]},{"l":"Discrete polyp identified?","t":"c","o":["No","Yes – size ____ mm, embed separately"]},{"l":"Products of conception suspected?","t":"c","o":["No","Yes – use VNL-H-053"]},{"l":"Blood clot separated out?","t":"c","o":["N/A","Yes"]},{"l":"Marker dye used","t":"t","h":""},{"l":"Cassettes used","t":"t","h":""},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No – justify: ______"]}]},{"id":"VNL-H-048","title":"Hysterectomy – benign indication","blocks":"Open the uterus coronally and fix. Blocks: cervix (anterior and posterior, including transformation zone), lower segment, anterior and posterior endometrium/myometrium (full thickness), one block per fibroid (more if unusual), and each adnexum. Sample any focal lesion in full.","clinical":["The procedure, the indication and whether adnexa were removed.","Age, menopausal status and any hormonal therapy.","Imaging findings, including fibroid number and size.","Any recent endometrial sampling and its result."],"handling":["Weigh the uterus and measure before opening.","Open coronally and fix before further sectioning; endometrium is thin and autolyses quickly.","Keep right and left adnexa separately identified."],"steps":["Record the procedure, the weight and the three dimensions of the uterus, and the dimensions of the cervix.","Describe the serosal surface and the external cervical os.","Open the uterus coronally, from cervix to fundus, into anterior and posterior halves.","Measure the endometrial thickness and describe the endometrium.","Measure the myometrial thickness and record every leiomyoma: number, size range and location as intramural, submucosal, subserosal or cervical.","Section each fibroid and record any soft, necrotic, haemorrhagic or unusually cellular area.","Fix, then submit: anterior and posterior cervix including the transformation zone, the lower segment, and full-thickness anterior and posterior endometrium with myometrium.","Submit one block per fibroid, and extensive sampling of any fibroid with an unusual appearance.","Submit each adnexum separately, including the fimbrial end of each tube.","Sample any focal lesion in full."],"pitfalls":["Passing over an unusual-looking fibroid with a single block, when leiomyosarcoma is the differential.","Failing to sample the transformation zone, where an incidental cervical lesion is found.","Not identifying the adnexa by side."],"prompts":[{"l":"Procedure","t":"c","o":["Total abdominal","Vaginal","Laparoscopic","Subtotal","+ BSO"]},{"l":"Indication","t":"c","o":["Fibroids","AUB","Adenomyosis","Prolapse","Endometriosis"]},{"l":"Uterus weight (g) and dimensions (mm)","t":"t","h":""},{"l":"Serosal surface","t":"c","o":["Smooth","Adhesions","Nodular","Puckered"]},{"l":"Cervix dimensions (mm) and os appearance","t":"t","h":""},{"l":"Endometrial thickness (mm)","t":"t","h":""},{"l":"Endometrial appearance","t":"c","o":["Thin/atrophic","Thickened","Polypoid","Haemorrhagic"]},{"l":"Myometrial thickness (mm)","t":"t","h":""},{"l":"Leiomyomata present?","t":"c","o":["No","Yes – number ____, size range ____ mm"]},{"l":"Fibroid location","t":"c","o":["Intramural","Submucosal","Subserosal","Cervical"]},{"l":"Unusual fibroid appearance (soft, necrotic, haemorrhagic)?","t":"c","o":["No","Yes – sample extensively"]},{"l":"Adnexa received","t":"c","o":["Both","Right","Left","None"]}]},{"id":"VNL-H-049","title":"Hysterectomy – malignancy / staging","blocks":"Ink parametria and vaginal cuff. Blocks: ≥4 through tumour showing deepest myometrial invasion with adjacent serosa, tumour–normal interface, cervix and lower segment, both parametria, vaginal cuff margin, background endometrium, both tubes (SEE-FIM for adnexa), both ovaries, omentum, and all nodes by site.","clinical":["The suspected primary site and the diagnosis on prior sampling.","The procedure, including whether nodes, omentum and washings were taken.","Imaging stage and any neoadjuvant therapy.","Whether the woman has Lynch syndrome or a relevant family history."],"handling":["Weigh and measure before opening. Ink the parametria and the vaginal cuff.","Open coronally and fix before sampling; the depth of myometrial invasion is measured on fixed tissue.","Keep every separately submitted specimen in its own container and its own cassettes."],"steps":["Record the procedure and every component, and weigh and measure the uterus.","Describe the serosal surface and any deposits or breach.","Ink both parametria and the vaginal cuff margin.","Open the uterus coronally, avoiding cutting through the tumour where possible.","Record the tumour site, its three dimensions and its appearance.","Measure the depth of myometrial invasion and the full myometrial thickness at the same point, and record both.","Record whether the cervical stroma or the lower segment is involved, and the distance to the vaginal cuff margin.","Submit at least four blocks through the tumour showing the deepest invasion with the adjacent serosa.","Submit the tumour-to-normal interface, the cervix and lower segment, both parametria, the vaginal cuff margin and background endometrium.","Submit both tubes using the SEE-FIM protocol, both ovaries, the omentum and all nodes by site."],"pitfalls":["Measuring the depth of invasion without recording the total wall thickness at the same point.","Failing to sample the tubes and ovaries adequately in a staging specimen.","Pooling nodes from different sites."],"prompts":[{"l":"Procedure","t":"c","o":["Total","Radical","+ BSO","+ pelvic nodes","+ omentum"]},{"l":"Known / suspected primary site","t":"c","o":["Endometrium","Cervix","Ovary","Unknown"]},{"l":"Uterus weight (g) and dimensions (mm)","t":"t","h":""},{"l":"Serosal surface","t":"c","o":["Smooth","Breached by tumour","Deposits","Adhesions"]},{"l":"Parametrial / vaginal cuff margins inked?","t":"c","o":["Yes","No"]},{"l":"Tumour site and dimensions (mm)","t":"t","h":""},{"l":"Tumour appearance","t":"c","o":["Polypoid/exophytic","Infiltrative","Ulcerated","Barrel cervix"]},{"l":"Myometrial invasion – depth (mm) / total wall thickness (mm)","t":"t","h":"____ / ____"},{"l":"Cervical stromal involvement?","t":"c","o":["No","Yes"]},{"l":"Distance to vaginal cuff margin (mm)","t":"t","h":""},{"l":"Adnexa, omentum, peritoneal deposits","t":"t","h":""},{"l":"Lymph nodes received – sites","t":"t","h":""}]},{"id":"VNL-H-050","title":"Ovary & fallopian tube – benign / risk-reducing","blocks":"Benign cyst: 3–4 blocks including any thickened, solid or papillary area, plus residual ovary. Tube: 3 sections including fimbrial end. Risk-reducing surgery: embed both tubes and ovaries in entirety at 2–3 mm (SEE-FIM), with fimbriae sectioned longitudinally.","clinical":["The specimen and side, the indication and the operation.","Age, menopausal status and any hormonal therapy.","For risk-reducing surgery, the BRCA or other genetic result.","For ectopic pregnancy, the beta-hCG level and the operative findings."],"handling":["Keep right and left separately identified throughout.","Where a cyst is large, open it and record the contents before fixation; contents cannot be assessed after fixative dilution.","Risk-reducing specimens must be embedded in entirety using the SEE-FIM protocol."],"steps":["Record each specimen and its side, with dimensions and weight.","Describe the ovarian external surface: smooth, adherent, ruptured, haemorrhagic, or bearing papillary excrescences.","Open any cyst, record its size, contents and the appearance of the lining.","Examine the lining specifically for papillary or solid areas; if present, change to the ovarian tumour worksheet.","Measure the tube and describe it: normal, hydrosalpinx, haemorrhagic, or with a paratubal cyst, and record whether the fimbriae are present.","For ectopic pregnancy, open the tube and record whether products of conception are identified.","Benign cyst: submit three to four blocks including any thickened, solid or papillary area, plus residual ovary.","Tube: submit three sections including the fimbrial end sectioned longitudinally.","Risk-reducing surgery: section both tubes and ovaries entirely at 2–3 mm, with the fimbrial ends amputated and sectioned longitudinally, and embed all tissue."],"pitfalls":["Sampling a risk-reducing specimen representatively rather than entirely.","Failing to examine the cyst lining, where a borderline focus lies.","Not identifying the fimbrial end, which is where serous carcinoma originates."],"prompts":[{"l":"Specimen","t":"c","o":["Ovary R","Ovary L","Tube R","Tube L","Ovarian cystectomy","Sterilisation"]},{"l":"Indication","t":"c","o":["Cyst","Torsion","Ectopic pregnancy","Risk-reducing (BRCA)","Sterilisation","Incidental"]},{"l":"Ovary dimensions (mm) and weight (g)","t":"t","h":""},{"l":"External surface","t":"c","o":["Smooth","Adhesions","Papillary excrescences","Ruptured","Haemorrhagic"]},{"l":"Cyst present?","t":"c","o":["No","Yes – size ____ mm"]},{"l":"Cyst contents","t":"c","o":["Clear/serous","Mucinous","Chocolate/altered blood","Sebaceous + hair","Blood"]},{"l":"Cyst lining","t":"c","o":["Smooth","Papillary/solid areas","Trabeculated"]},{"l":"Solid areas present?","t":"c","o":["No","Yes – use VNL-H-051"]},{"l":"Tube length (mm) and diameter (mm)","t":"t","h":""},{"l":"Tube appearance","t":"c","o":["Normal","Hydrosalpinx","Haemorrhagic/ectopic","Paratubal cyst","Fimbriae absent"]},{"l":"Ectopic gestation – products identified?","t":"c","o":["N/A","Yes","No"]},{"l":"Risk-reducing specimen – SEE-FIM protocol applied?","t":"c","o":["N/A","Yes"]}]},{"id":"VNL-H-051","title":"Ovarian tumour & gynaecological staging specimen","blocks":"Ink the surface, then slice at 5–10 mm. Minimum 1 block per cm of maximum dimension, targeted at solid, papillary and variegated areas plus the capsule and any surface excrescence. Mucinous and borderline tumours require 2 blocks per cm. Include both tubes (SEE-FIM), omentum, and all peritoneal and nodal specimens by site.","clinical":["The side, the operation and every specimen submitted, including washings.","Tumour markers, particularly CA125, and imaging findings.","Whether the capsule was ruptured before or during surgery. This distinction changes stage.","Any known primary elsewhere, particularly gastrointestinal or breast."],"handling":["Weigh and measure before incision. Ink the external surface.","Open and slice while fresh so fixative penetrates, then fix; large ovarian tumours fix poorly.","Photograph the cut surface before extensive sampling."],"steps":["Record the side, the weight and the three dimensions.","Record whether the capsule is intact, and if ruptured, whether that occurred before or during surgery as stated by the surgeon.","Describe the external surface and record any excrescences and their extent.","Ink the external surface.","Slice at 5–10 mm through the longest axis.","Describe the cut surface: solid, cystic, mixed or multiloculated, and record the dimensions and appearance of the solid component.","Record cyst contents, necrosis and haemorrhage with an estimated percentage.","Record whether the tube is attached and whether it is involved.","Submit a minimum of one block per centimetre of maximum dimension, targeted at solid, papillary and variegated areas, plus the capsule and any surface excrescence.","Mucinous and borderline tumours require two blocks per centimetre.","Submit both tubes using SEE-FIM, the omentum, and every peritoneal and nodal specimen by site."],"pitfalls":["Under-sampling a mucinous tumour, so an invasive focus is missed.","Failing to sample the capsule and surface, which determine stage.","Not recording whether rupture was pre-operative or intra-operative."],"prompts":[{"l":"Laterality","t":"c","o":["Right","Left","Bilateral"]},{"l":"Specimen dimensions (mm) and weight (g)","t":"t","h":""},{"l":"Capsule intact?","t":"c","o":["Yes","No – ruptured pre-op","/ intra-op"]},{"l":"External surface excrescences?","t":"c","o":["No","Yes – extent: ______"]},{"l":"Surface inked?","t":"c","o":["Yes","No"]},{"l":"Cut surface","t":"c","o":["Solid","Cystic","Mixed solid & cystic","Multiloculated"]},{"l":"Solid component dimensions (mm) and appearance","t":"t","h":""},{"l":"Necrosis / haemorrhage present?","t":"c","o":["No","Yes – estimated %: ____"]},{"l":"Cyst contents","t":"c","o":["Serous","Mucinous","Haemorrhagic","Sebaceous","Colloid"]},{"l":"Tube attached and involved?","t":"c","o":["Not attached","Attached – uninvolved","Involved"]},{"l":"Other specimens received (omentum, peritoneum, nodes, washings)","t":"t","h":""},{"l":"Photographed?","t":"c","o":["No","Yes – ref: ______"]}]},{"id":"VNL-H-052","title":"Vulva & vagina","blocks":"Ink all margins. Small biopsies and excisions in entirety. Vulvectomy: slice perpendicular to the closest margin at 3–5 mm; sample tumour at its deepest point, all margins including urethral/vaginal/perineal, background skin (lichen sclerosus/VIN), and all groin nodes separated by side.","clinical":["The specimen type, the site by clock position and the side.","The indication and any prior biopsy diagnosis.","Whether lichen sclerosus or intraepithelial neoplasia is known.","Whether groin nodes were dissected and how they are labelled."],"handling":["Fix pinned and flat on cork so the specimen does not curl.","Preserve orientation markers until the corresponding margin is inked.","Ink all margins, including the deep margin, before slicing."],"steps":["Record the specimen type, the site by clock position, the side and the dimensions.","Record every structure included: labium majus, labium minus, clitoris, perineum, introitus and urethral meatus.","Record the orientation marker and translate it into named margins.","Describe the lesion: dimensions, and whether ulcerated, exophytic, white and plaque-like, pigmented or erythematous.","Estimate the depth of invasion and record the distance to the nearest peripheral margin and to the deep margin.","Ink all margins in distinct colours and record the code.","Slice perpendicular to the closest margin at 3–5 mm, keeping slices in order.","Biopsies and small excisions: embed in entirety.","Vulvectomy: submit the tumour at its deepest point, all margins including urethral, vaginal and perineal, and background skin for lichen sclerosus or intraepithelial neoplasia.","Submit groin nodes separately by side, sliced at 2 mm."],"pitfalls":["Failing to sample background skin, so a field change is not reported.","Losing orientation, so an involved margin cannot be named.","Combining left and right groin nodes."],"prompts":[{"l":"Specimen type","t":"c","o":["Punch/incisional biopsy","Wide local excision","Simple vulvectomy","Radical vulvectomy","Vaginal specimen"]},{"l":"Site and
