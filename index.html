laterality (clock position)","t":"t","h":""},{"l":"Indication","t":"c","o":["Lichen sclerosus","VIN","?Carcinoma","Paget disease","Pigmented lesion"]},{"l":"Orientation marker present?","t":"c","o":["No","Yes – key: ______"]},{"l":"Specimen dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Structures included","t":"c","o":["Labium majus","Labium minus","Clitoris","Perineum","Introitus","Urethral meatus"]},{"l":"Lesion dimensions (mm) and appearance","t":"c","o":["Ulcerated","Exophytic","White/plaque","Pigmented","Erythematous"]},{"l":"Depth of invasion (macroscopic, mm)","t":"t","h":""},{"l":"Distance to nearest peripheral margin (mm)","t":"t","h":""},{"l":"Distance to deep margin (mm)","t":"t","h":""},{"l":"Inking code","t":"t","h":""},{"l":"Groin node dissection received?","t":"c","o":["No","Right","Left"]}]},{"id":"VNL-H-053","title":"Products of conception & retained placental tissue","blocks":"Rinse and float tissue to identify villi. Routine: 2–3 blocks including villi, decidua and implantation site. If villi cannot be identified, or hydropic change is present, embed all tissue – confirming villi excludes ectopic pregnancy, and molar pregnancy must not be under-sampled.","clinical":["The clinical history, gestational age and the beta-hCG level.","Whether ectopic pregnancy is being excluded; identification of villi is the point of the examination.","Any ultrasound finding suggesting molar pregnancy.","Whether cytogenetics has been requested for recurrent loss."],"handling":["Where cytogenetics is required, take fresh villous tissue before fixation.","Rinse and float the tissue in saline or water to identify villi against blood clot.","Follow local policy and any statutory requirement for the handling and disposal of fetal tissue."],"steps":["Record the clinical history and gestational age.","Record the aggregate dimensions and weight of the tissue.","Rinse and float the tissue; villi appear as fine, feathery, translucent fronds.","Record explicitly whether chorionic villi are identified macroscopically.","Record the presence of a gestational sac, embryo or fetal parts, with the crown-rump length if measurable.","Look specifically for vesicular, grape-like villi suggesting molar pregnancy.","Take fresh tissue for cytogenetics where requested, before fixation.","Routine: submit two to three blocks including villi, decidua and implantation site.","Where villi cannot be identified, or hydropic change is present, embed all tissue in entirety.","Record the proportion of blood clot separated out."],"pitfalls":["Reporting no villi without embedding all the tissue, so an ectopic pregnancy is not excluded.","Under-sampling hydropic villi, so a molar pregnancy is missed.","Fixing the tissue before taking a cytogenetics sample."],"prompts":[{"l":"Clinical history","t":"c","o":["Miscarriage","Missed abortion","TOP","Retained products","?Ectopic","?Molar"]},{"l":"Gestational age (weeks)","t":"t","h":""},{"l":"Aggregate dimensions (mm) and weight (g)","t":"t","h":""},{"l":"Chorionic villi identified macroscopically?","t":"c","o":["Yes","No","Uncertain"]},{"l":"Gestational sac identified?","t":"c","o":["No","Yes – diameter ____ mm"]},{"l":"Embryo / fetal parts present?","t":"c","o":["No","Yes – describe: ______"]},{"l":"Crown-rump length (mm), if measurable","t":"t","h":""},{"l":"Villi appearance","t":"c","o":["Normal","Hydropic – exclude mole","Fibrotic","Haemorrhagic"]},{"l":"Vesicular / grape-like tissue present?","t":"c","o":["No","Yes – sample extensively"]},{"l":"Decidua / blood clot proportion","t":"t","h":""},{"l":"Cytogenetics / karyotype requested?","t":"c","o":["No","Yes – fresh sample sent"]},{"l":"Fetal parts – handled per hospital policy?","t":"c","o":["N/A","Yes – policy ref: ______"]}]},{"id":"VNL-H-054","title":"Placenta","blocks":"Trim cord and membranes, weigh, then slice the disc at 10 mm and inspect all slices. Blocks: 2 cord sections (one near the fetal insertion), membrane roll, 2 full-thickness normal parenchyma, and every focal lesion. Monochorionic twins: include the dividing membrane and vascular equator.","clinical":["Gestational age, mode of delivery and the indication for examination.","Whether the pregnancy was singleton or multiple, and the chorionicity.","Maternal conditions: pre-eclampsia, diabetes, infection or substance use.","The outcome for the infant, including birth weight and Apgar scores."],"handling":["Weigh the placenta trimmed of cord and membranes; untrimmed weight is not comparable to reference ranges.","Fix the disc after slicing so fixative reaches the centre.","Where infection is suspected, sample for microbiology before fixation."],"steps":["Record the gestational age, delivery mode and indication.","Examine the membranes: colour, opacity, meconium staining and the distance from the rupture site to the placental margin.","Examine the cord: length, diameter, insertion site, coiling, true knots, thrombosis and haematoma.","Count the cord vessels on a cross-section taken away from the insertion.","Trim the cord and membranes, then weigh the disc and record its dimensions.","Examine the fetal surface for vessel thrombosis and the maternal surface for completeness and retroplacental clot.","Slice the disc at 10 mm and inspect every slice.","Record parenchymal lesions: infarcts with an estimated percentage, calcification, haemorrhage and fibrin deposition.","Submit two cord sections, one near the fetal insertion, a membrane roll, at least two full-thickness blocks of normal parenchyma, and every focal lesion.","For monochorionic twins, submit the dividing membrane and the vascular equator."],"pitfalls":["Weighing the placenta with cord and membranes attached.","Taking a cord section at the insertion, where a single artery may be falsely suggested.","Failing to slice the whole disc, so infarcts are underestimated."],"prompts":[{"l":"Gestational age (weeks) and delivery mode","t":"t","h":""},{"l":"Indication","t":"c","o":["IUGR","Stillbirth","Preterm","?Chorioamnionitis","Pre-eclampsia","Multiple pregnancy"]},{"l":"Singleton or multiple?","t":"c","o":["Singleton","Twin – dichorionic","Twin – monochorionic"]},{"l":"Trimmed weight (g) and dimensions (mm)","t":"t","h":""},{"l":"Cord length (mm), diameter (mm), insertion","t":"c","o":["Central","Eccentric","Marginal","Velamentous"]},{"l":"Cord vessels","t":"c","o":["3 (2A + 1V)","2 (1A + 1V)","Other"]},{"l":"Cord abnormalities","t":"c","o":["Nil","True knot","Excessive coiling","Thrombosis","Haematoma"]},{"l":"Membranes","t":"c","o":["Clear/glistening","Opaque/green","Meconium-stained","Haemorrhagic"]},{"l":"Membrane rupture site distance from margin (mm)","t":"t","h":""},{"l":"Fetal surface / maternal surface completeness","t":"c","o":["Complete","Cotyledons missing","Retroplacental clot"]},{"l":"Parenchymal lesions","t":"c","o":["Nil","Infarcts – % ____","Calcification","Haemorrhage","Fibrin deposition"]},{"l":"Slice interval used (mm)","t":"t","h":""}]},{"id":"VNL-H-055","title":"Perinatal & fetal specimen","blocks":"Follow local perinatal policy and the scope of consent exactly. Photograph and record all measurements before any incision. Take cytogenetics before fixation. Sample per organ system only within the consented extent; retain the placenta in all cases.","clinical":["The written consent and its exact scope. Nothing may be done beyond what is consented.","Gestational age, the obstetric history and the circumstances of death.","All antenatal imaging and any known or suspected malformation.","Whether cytogenetics or metabolic studies are requested."],"handling":["Do not begin until the signed consent form has been seen and its scope confirmed in writing.","Follow the local perinatal policy and any statutory requirement without exception.","Take cytogenetic samples before fixation; fixed tissue cannot be karyotyped.","Treat the body with dignity at every stage and keep the examination area private."],"steps":["Confirm and file the consent, and record the exact extent of examination consented.","Record the gestational age, the date of delivery and the fetal weight.","Take the standard measurements: crown-rump, crown-heel, foot length and head circumference, and compare against gestational reference ranges.","Describe the external appearance, the degree of maceration, and any dysmorphic feature, systematically head to foot.","Photograph and radiograph where consented and where facilities allow, before any incision.","Take a cytogenetic sample from the consented site before fixation.","Proceed to internal examination only if it is consented, following the local protocol for each organ system.","Examine the placenta in every case using the placental worksheet.","Reconstitute the body carefully and record the disposal arrangements agreed with the parents."],"pitfalls":["Exceeding the scope of consent, which is both a clinical and a legal failure.","Omitting measurements and photographs, which cannot be obtained later.","Failing to examine the placenta, which frequently gives the cause of death."],"prompts":[{"l":"Consent for examination confirmed and filed?","t":"c","o":["Yes","No – do not proceed"]},{"l":"Extent of examination consented","t":"c","o":["Full autopsy","Limited/external","Placenta only"]},{"l":"Gestational age (weeks) and date of delivery","t":"t","h":""},{"l":"Fetal weight (g)","t":"t","h":""},{"l":"Crown-rump (mm) / crown-heel (mm) / foot length (mm)","t":"t","h":""},{"l":"Head circumference (mm)","t":"t","h":""},{"l":"External appearance","t":"c","o":["Intact","Macerated – grade ____","Malformation seen"]},{"l":"Dysmorphic features noted","t":"t","h":""},{"l":"Photographs taken?","t":"c","o":["No","Yes – ref: ______"]},{"l":"Radiographs taken?","t":"c","o":["No","Yes"]},{"l":"Cytogenetics sample taken?","t":"c","o":["No","Yes – tissue: ______"]},{"l":"Placenta received and examined (VNL-H-054)?","t":"c","o":["Yes","No"]}]}]},{"key":"HN","name":"Head & Neck","note":"Complex three-dimensional margins. Orientate with the surgeon and photograph before dissection whenever the specimen is a resection.","ink":"#1D4ED8","forms":[{"id":"VNL-H-056","title":"Oral, oropharyngeal & mucosal biopsy","blocks":"Embed in entirety, on edge to show full mucosal thickness. Excisional biopsies: ink margins and section perpendicular to the closest margin at 2–3 mm.","clinical":["The precise subsite and side; 'mouth' is not an adequate site.","The clinical appearance and duration of the lesion.","Tobacco, betel nut and alcohol use.","Any prior biopsy at the same site, with the laboratory number."],"handling":["Formalin. Oral mucosal biopsies are small and dry rapidly.","Where a vesiculobullous or lichenoid disorder is queried, a separate sample for immunofluorescence is required.","Handle with a spatula; forceps crush the epithelium."],"steps":["Record the specimen type, the exact subsite and the side.","Count the fragments and measure the specimen in three dimensions, including its depth.","Describe the mucosal surface, any ulceration and its size, and whether muscle is included.","Ink the margins if the specimen is an excision, and record the code.","Embed in entirety, on edge, so full mucosal thickness is represented.","Excisions: section perpendicular to the closest margin at 2–3 mm and keep slices in order.","Apply a marker dye to small fragments.","Request levels routinely."],"pitfalls":["Embedding flat, so the epithelial–stromal junction cannot be assessed for invasion.","Failing to record the subsite, which determines staging and management.","Under-sampling a large white patch, so a focus of invasion is missed."],"prompts":[{"l":"Site (be specific: tongue, floor of mouth, buccal, palate, gingiva)","t":"t","h":""},{"l":"Laterality","t":"c","o":["Right","Left","Midline"]},{"l":"Clinical diagnosis","t":"c","o":["Leukoplakia","Erythroplakia","Ulcer","?SCC","Lichenoid","Cyst"]},{"l":"Specimen type","t":"c","o":["Incisional","Excisional","Punch","Brush/other"]},{"l":"Number of fragments","t":"t","h":""},{"l":"Dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Mucosal surface appearance","t":"t","h":""},{"l":"Ulceration present?","t":"c","o":["No","Yes – size ____ mm"]},{"l":"Depth of tissue (mm) – muscle included?","t":"c","o":["No","Yes"]},{"l":"Margins inked (excisional only)?","t":"c","o":["N/A","Yes – code: ______"]},{"l":"Marker dye used","t":"t","h":""},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No"]}]},{"id":"VNL-H-057","title":"Oral / oropharyngeal resection with neck dissection","blocks":"Photograph and ink all named margins in distinct colours. Take mucosal margins as en-face or perpendicular sections per local protocol. Blocks: tumour with deepest invasion (≥4), deep margin, bone (decalcified) where included, background mucosa, and all nodes separated strictly by level.","clinical":["The exact procedure and every structure resected.","The tumour subsite, the biopsy diagnosis and the laboratory number.","Which margin the surgeon regards as closest, and the orientation key in the surgeon's words.","The neck dissection levels and how the surgeon has labelled them.","Any prior radiotherapy."],"handling":["Orientate the specimen with the surgeon, ideally at the bench, before any cut.","Photograph the specimen with the orientation marked.","Fix before slicing where bone is included, then decalcify only the bone blocks.","Keep every neck level in a separate container from the outset."],"steps":["Record the procedure and every component received.","Confirm the orientation with the surgeon and record the key before any incision.","Measure the specimen in three dimensions and photograph it.","Ink each named margin in a distinct colour and record the full code on the worksheet.","Record the tumour subsite, its three dimensions and its appearance.","Measure the depth of invasion from the adjacent normal mucosal surface, not from the ulcer base.","Record the distance to each mucosal margin and to the deep soft tissue margin.","Where bone is included, section it and record whether the cortex is breached and whether marrow is involved.","Take mucosal margins as en-face or perpendicular sections according to local protocol, and state which was used.","Submit at least four blocks through the tumour including the deepest point, the deep margin, bone where included, and background mucosa.","Dissect all nodes and submit them strictly by level, never pooled."],"pitfalls":["Measuring depth of invasion from the ulcer base, which underestimates it.","Pooling neck levels, so the level of nodal involvement cannot be reported.","Beginning dissection without confirming orientation, which cannot be recovered."],"prompts":[{"l":"Procedure and site","t":"t","h":""},{"l":"Orientation agreed with surgeon?","t":"c","o":["Yes","No – seek clarification"]},{"l":"Components","t":"c","o":["Soft tissue","Mandible/maxilla","Tongue","Floor of mouth","Skin","Neck dissection"]},{"l":"Specimen dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Inking code (name each margin and colour)","t":"t","h":""},{"l":"Tumour dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Tumour appearance","t":"c","o":["Exophytic","Ulcerated","Endophytic","Submucosal"]},{"l":"Depth of invasion (macroscopic, mm)","t":"t","h":""},{"l":"Bone involvement suspected?","t":"c","o":["No","Yes – decalcify"]},{"l":"Distance to each mucosal margin (mm)","t":"t","h":""},{"l":"Distance to deep soft tissue margin (mm)","t":"t","h":""},{"l":"Neck dissection levels received","t":"t","h":""}]},{"id":"VNL-H-058","title":"Larynx, hypopharynx & laryngectomy","blocks":"Open posteriorly, pin and fix, then decalcify the cartilaginous framework. Blocks: coronal or transverse sections through the tumour at 4–5 mm including deepest point and cartilage, both cords, anterior commissure, all margins (tracheal, pharyngeal, soft tissue), thyroid gland, and all nodes by level.","clinical":["The procedure and whether the thyroid or pharynx is included.","The tumour subsite and the biopsy diagnosis.","Vocal cord mobility before surgery.","Prior radiotherapy, which is common and changes the assessment."],"handling":["Open the larynx posteriorly in the midline, pin flat and fix before dissection.","Decalcify the cartilaginous framework after fixation, in blocks rather than whole.","Photograph the opened, pinned specimen."],"steps":["Record the procedure, the specimen dimensions and every attached structure.","Open the larynx posteriorly in the midline, avoiding the tumour, then pin flat and fix.","Record the tumour subsite: supraglottic, glottic, subglottic, transglottic or pyriform fossa.","Measure the tumour in three dimensions and describe its appearance.","Record involvement of each vocal cord and of the anterior commissure.","Record whether the thyroid, cricoid or arytenoid cartilage appears invaded, and whether tumour extends outside the larynx.","Measure the distance to the superior, inferior (tracheal) and circumferential soft tissue margins.","Take the tracheal and pharyngeal margins as en-face sections.","Section coronally or transversely at 4–5 mm through the tumour and decalcify the cartilage-containing blocks.","Submit the tumour with its deepest point and adjacent cartilage, both cords, the anterior commissure, all margins, the thyroid gland, and all nodes by level."],"pitfalls":["Opening anteriorly through the tumour and the anterior commissure.","Failing to demonstrate cartilage in the tumour blocks, so invasion cannot be assessed.","Over-decalcifying, which destroys the tumour morphology alongside the cartilage."],"prompts":[{"l":"Procedure","t":"c","o":["Cordectomy","Partial laryngectomy","Total laryngectomy","+ pharynx","+ thyroid"]},{"l":"Prior radiotherapy?","t":"c","o":["No","Yes"]},{"l":"Specimen dimensions (mm)","t":"t","h":""},{"l":"Opened posteriorly in the midline?","t":"c","o":["Yes","No – method: ______"]},{"l":"Tumour site","t":"c","o":["Supraglottic","Glottic","Subglottic","Transglottic","Pyriform fossa"]},{"l":"Tumour dimensions (mm) and appearance","t":"t","h":""},{"l":"Vocal cord mobility / involvement","t":"c","o":["Right","Left","Both","Neither"]},{"l":"Anterior commissure involved?","t":"c","o":["No","Yes"]},{"l":"Cartilage invasion suspected?","t":"c","o":["No","Thyroid","Cricoid","Arytenoid"]},{"l":"Extralaryngeal spread?","t":"c","o":["No","Yes"]},{"l":"Margins – distance to superior, inferior (tracheal), circumferential (mm)","t":"t","h":""},{"l":"Thyroid gland / nodes included?","t":"c","o":["No","Yes – describe: ______"]}]},{"id":"VNL-H-059","title":"Salivary gland","blocks":"Ink the external surface, slice at 3–5 mm. Blocks: ≥1 per cm of tumour including capsule and closest margin, tumour–gland interface, uninvolved gland ×2, duct system, and any intraparotid or regional nodes.","clinical":["The gland, the side and the extent of the resection.","The result of any fine needle aspiration, with its laboratory number.","Duration and growth rate of the lesion, and any facial nerve weakness.","Whether the facial nerve was dissected off the specimen."],"handling":["Ink the external surface before slicing; the margin is often only a thin cuff of gland.","Fix before slicing where the tumour is soft or myxoid, since these fragment easily.","Do not shell out a tumour from the specimen."],"steps":["Record the gland, the side, the procedure, the weight and the three dimensions.","Ink the entire external surface and record the code.","Slice the specimen at 3–5 mm through the longest axis, keeping slices in order.","Record the tumour dimensions and describe it: circumscribed, encapsulated, lobulated, myxoid, cystic, infiltrative or necrotic.","Record whether the capsule is intact or breached, and whether the tumour extends beyond the gland.","Measure the distance from the tumour to the nearest inked margin.","Note the position of the facial nerve if identified, and any adjacent structures.","Record any calculi and duct dilatation in specimens taken for sialadenitis.","Submit at least one block per centimetre of tumour, each including the capsule and the closest margin.","Submit the tumour-to-gland interface, at least two blocks of uninvolved gland, the duct system, and any intraparotid or regional nodes."],"pitfalls":["Failing to ink, so the frequently close margin of a pleomorphic adenoma cannot be measured.","Sampling only the tumour centre in a mixed tumour, so a carcinomatous focus is missed.","Damaging the capsule during dissection, which mimics tumour rupture."],"prompts":[{"l":"Gland","t":"c","o":["Parotid – superficial","Parotid – total","Submandibular","Sublingual","Minor – site: ______"]},{"l":"Laterality","t":"c","o":["Right","Left"]},{"l":"Indication","t":"c","o":["Tumour","Sialadenitis","Calculi","Cyst","Sjögren's"]},{"l":"Specimen dimensions (mm) and weight (g)","t":"t","h":""},{"l":"External surface inked?","t":"c","o":["Yes","No"]},{"l":"Tumour present?","t":"c","o":["No","Yes"]},{"l":"Tumour dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Tumour appearance","t":"c","o":["Circumscribed/encapsulated","Lobulated/myxoid","Cystic","Infiltrative","Necrotic"]},{"l":"Capsule intact?","t":"c","o":["Yes","No – breached"]},{"l":"Distance to nearest margin (mm)","t":"t","h":""},{"l":"Facial nerve / adjacent structures identified?","t":"c","o":["No","Yes"]},{"l":"Calculi / duct dilatation present?","t":"c","o":["No","Yes – describe: ______"]}]},{"id":"VNL-H-060","title":"Sinonasal, nasopharyngeal & skull base specimen","blocks":"Polyps/FESS tissue: embed representative fragments (all if scant), separating bone for decalcification. Resections: photograph, ink and name all margins, sample tumour at its deepest point with adjacent bone, all margins, and background mucosa.","clinical":["The exact site and side, and the extent of disease on imaging.","Whether the specimen is polypoid inflammatory tissue or a targeted tumour biopsy.","Immunosuppression or diabetes, which raise the possibility of invasive fungal disease.","Any orbital, dural or skull base involvement on imaging."],"handling":["Separate bone and cartilage fragments for decalcification and embed soft tissue directly.","Where invasive fungal disease is suspected, send fresh tissue for mycology and request fungal stains.","Fragmented sinonasal tissue is easily lost; use a sieve and a marker dye."],"steps":["Record the site, side and specimen type, and the number of fragments with their aggregate dimensions.","Describe the tissue: polypoid and oedematous, mucoid, fleshy, haemorrhagic, or containing bone.","Separate calcified fragments and record that they have been decalcified.","Look for and record any discrete tumour and its size.","For resections, record the orientation, ink and name every margin, and record the distance from the tumour to each.","Record whether the orbit, skull base or dura is included and whether tumour approaches them.","Polyps and functional endoscopic sinus tissue: embed representative fragments, or all if scant.","Resections: photograph, then sample the tumour at its deepest point with adjacent bone, all margins, and background mucosa.","Request fungal stains where a fungal aetiology is possible."],"pitfalls":["Decalcifying the whole specimen, so soft tissue morphology is degraded unnecessarily.","Missing invasive fungal disease by not requesting stains on apparently inflammatory tissue.","Discarding bone fragments that carry the invasive front."],"prompts":[{"l":"Site","t":"c","o":["Nasal cavity","Maxillary sinus","Ethmoid","Frontal/sphenoid","Nasopharynx"]},{"l":"Laterality","t":"c","o":["Right","Left","Bilateral"]},{"l":"Specimen type","t":"c","o":["Biopsy","Polypectomy","FESS tissue","Resection/maxillectomy"]},{"l":"Number of fragments and aggregate dimensions (mm)","t":"t","h":""},{"l":"Appearance","t":"c","o":["Polypoid/oedematous","Mucoid","Fleshy","Haemorrhagic","Bony fragments"]},{"l":"Bone / cartilage present?","t":"c","o":["No","Yes – decalcify"]},{"l":"Fungal material suspected?","t":"c","o":["No","Yes – request fungal stains"]},{"l":"Discrete tumour present?","t":"c","o":["No","Yes – size ____ mm"]},{"l":"Resection specimen: margins inked and named","t":"t","h":""},{"l":"Distance to nearest margin (mm)","t":"t","h":""},{"l":"Orbital / skull base / dural involvement?","t":"c","o":["No","Yes"]},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No"]}]},{"id":"VNL-H-061","title":"Tonsil, adenoid & Waldeyer's ring","blocks":"Routine inflammatory: 1 block per tonsil (keep sides identified). Asymmetry, mass, suspected lymphoma or unknown-primary search: bisect, divert fresh tissue for flow cytometry, and embed the tonsil in entirety at 3 mm.","clinical":["The indication and whether the tonsils are clinically asymmetrical.","Any B symptoms, lymphadenopathy or known lymphoma.","Whether this is a search for an unknown primary in a patient with neck nodes.","HPV status where oropharyngeal carcinoma is a consideration."],"handling":["Where lymphoma is suspected, receive fresh and notify the pathologist before fixation.","Keep right and left in separate containers and never combine them.","For an unknown-primary search, the specimen must be embedded in entirety."],"steps":["Record the specimen and measure each tonsil separately in three dimensions.","Record explicitly whether there is marked asymmetry between the two sides.","Describe the surface: crypts patent, debris or tonsilloliths, ulceration, or an exophytic mass.","Bisect each tonsil and describe the cut surface: tan lymphoid, fleshy and homogeneous, necrotic or fibrotic.","Record any discrete mass with its dimensions.","Where lymphoma is suspected, divert fresh tissue for flow cytometry and make touch imprints before fixation.","Routine inflammatory tonsils: submit one block per tonsil, keeping the sides identified.","Asymmetry, a mass, suspected lymphoma or an unknown-primary search: slice at 3 mm and embed the tonsil in entirety.","Record the blocks taken from each side separately."],"pitfalls":["Combining right and left, so a unilateral lymphoma cannot be localised.","Fixing a suspected lymphoma before flow cytometry can be taken.","Sampling representatively in an unknown-primary search, where the focus may be a few millimetres in a crypt."],"prompts":[{"l":"Specimen","t":"c","o":["Tonsils – bilateral","Tonsil – R","Tonsil – L","Adenoid","Tonsil biopsy"]},{"l":"Indication","t":"c","o":["Recurrent tonsillitis","Obstructive sleep apnoea","Asymmetry","?Lymphoma","?SCC","Unknown primary"]},{"l":"Right tonsil dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Left tonsil dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Marked asymmetry?","t":"c","o":["No","Yes – sample extensively"]},{"l":"Surface appearance","t":"c","o":["Crypts patent","Debris/tonsilloliths","Ulcerated","Exophytic mass"]},{"l":"Cut surface","t":"c","o":["Tan/lymphoid","Fleshy homogeneous","Necrotic","Fibrotic"]},{"l":"Discrete mass identified?","t":"c","o":["No","Yes – size ____ mm"]},{"l":"Fresh tissue for lymphoma protocol?","t":"c","o":["No","Yes – flow cytometry sent"]},{"l":"Unknown primary search – entire tonsil embedded?","t":"c","o":["N/A","Yes"]},{"l":"Blocks taken – right","t":"t","h":""},{"l":"Blocks taken – left","t":"t","h":""}]},{"id":"VNL-H-062","title":"Ear, temporal bone & external auditory canal","blocks":"Small biopsies, polyps and cholesteatoma: embed in entirety. Pinna skin excisions: handle as a skin ellipse (VNL-H-006), including cartilage in the deep margin. Decalcify bone and ossicles before embedding.","clinical":["The site and side, and the clinical and otoscopic findings.","Whether cholesteatoma is the clinical diagnosis.","Duration of discharge or hearing loss.","For pinna lesions, the clinical diagnosis and whether margins are required."],"handling":["Small aural polyps and cholesteatoma fragments are easily lost; use a sieve and marker dye.","Separate bone, cartilage and ossicles for decalcification.","Ink margins on any pinna skin excision."],"steps":["Record the site, side and specimen type, and the number of fragments with dimensions.","Describe the appearance: keratinous and pearly, polypoid, granulation tissue, or skin with cartilage.","Record whether keratin debris is present, which supports cholesteatoma.","Separate and decalcify bone, cartilage and ossicles, recording the agent and times.","For pinna excisions, ink the margins and handle as a skin ellipse, including cartilage in the deep margin.","Measure the distance from any lesion to the nearest margin.","Embed biopsies, polyps and cholesteatoma in entirety.","Request levels, since diagnostic epithelium in cholesteatoma may be focal."],"pitfalls":["Losing keratinous debris in processing, so cholesteatoma cannot be confirmed.","Failing to include cartilage in the deep margin of a pinna excision.","Decalcifying soft tissue unnecessarily along with the ossicles."],"prompts":[{"l":"Site","t":"c","o":["Pinna/auricle","External canal","Middle ear","Mastoid","Temporal bone"]},{"l":"Laterality","t":"c","o":["Right","Left"]},{"l":"Specimen type","t":"c","o":["Biopsy","Polyp","Cholesteatoma","Excision","Ossicles"]},{"l":"Clinical diagnosis","t":"t","h":""},{"l":"Number of fragments and dimensions (mm)","t":"t","h":""},{"l":"Appearance","t":"c","o":["Keratinous/pearly","Polypoid","Granulation","Skin ellipse","Bone fragments"]},{"l":"Keratin debris present?","t":"c","o":["No","Yes – suggests cholesteatoma"]},{"l":"Cartilage / bone present?","t":"c","o":["No","Yes – decalcify"]},{"l":"Lesion present?","t":"c","o":["No","Yes – size ____ mm"]},{"l":"Margins inked (skin excision)?","t":"c","o":["N/A","Yes – code: ______"]},{"l":"Distance to nearest margin (mm)","t":"t","h":""},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No"]}]}]},{"key":"END","name":"Endocrine","note":"Capsular and margin assessment determine thyroid diagnosis; weigh and ink before slicing.","ink":"#A16207","forms":[{"id":"VNL-H-063","title":"Thyroid – lobectomy, hemithyroidectomy & total thyroidectomy","blocks":"Ink the surface, weigh, then slice transversely at 3–5 mm. Encapsulated nodules ≤30 mm: embed the entire nodule with its full capsule. Larger or multiple nodules: ≥1 block per cm plus the entire capsule of the dominant nodule. Always include background thyroid, isthmus, and any perithyroidal tissue.","clinical":["The procedure, the side and the indication.","The fine needle aspiration or core result and its reporting category, with the laboratory number.","Thyroid function, autoantibody status and any history of neck irradiation.","Ultrasound findings including nodule number, size and features."],"handling":["Weigh the specimen and ink the external surface before slicing.","Fix before slicing where the gland is soft, but slice thick specimens to allow penetration.","Keep lobes and isthmus identified; laterality determines completion surgery."],"steps":["Record the procedure, the weight, and the dimensions of each lobe and the isthmus.","Ink the external surface and record the code.","Describe the capsule: smooth, bosselated, breached, or with adherent tissue.","Slice the gland transversely at 3–5 mm from superior to inferior, keeping slices in order.","Describe the cut surface: homogeneous colloid, multinodular, a solitary nodule, fibrotic or haemorrhagic.","Measure the dominant nodule in three dimensions and describe it: encapsulated, infiltrative, cystic, calcified or firm and white.","Record the number and size range of additional nodules.","Measure the distance from the dominant nodule to the inked surface.","Search the perithyroidal tissue for parathyroid glands, lymph nodes and thymic tissue and record what is found.","Encapsulated nodules of 30 mm or less: embed the entire nodule with its full capsule, since the diagnosis depends on capsular and vascular invasion.","Larger or multiple nodules: submit at least one block per centimetre plus the entire capsule of the dominant nodule.","Always submit background thyroid, the isthmus and any perithyroidal tissue."],"pitfalls":["Sampling an encapsulated nodule representatively, so capsular invasion is missed and the diagnosis cannot be made.","Failing to submit the whole capsule of a follicular lesion.","Not searching for incidental parathyroid tissue and nodes."],"prompts":[{"l":"Procedure","t":"c","o":["Lobectomy R","Lobectomy L","Hemithyroidectomy + isthmus","Total","Completion"]},{"l":"Prior FNA / core result","t":"t","h":""},{"l":"Weight (g)","t":"t","h":""},{"l":"Dimensions (mm) – each lobe and isthmus","t":"t","h":""},{"l":"External surface inked?","t":"c","o":["Yes","No – code: ______"]},{"l":"Capsule","t":"c","o":["Smooth/intact","Bosselated","Breached","Adherent tissue"]},{"l":"Cut surface","t":"c","o":["Homogeneous colloid","Multinodular","Solitary nodule","Fibrotic","Haemorrhagic"]},{"l":"Dominant nodule dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Nodule appearance","t":"c","o":["Encapsulated","Infiltrative","Cystic","Calcified","White/firm"]},{"l":"Number of additional nodules and size range","t":"t","h":""},{"l":"Distance to inked margin (mm)","t":"t","h":""},{"l":"Parathyroid / node / thymic tissue identified?","t":"c","o":["No","Yes – describe: ______"]}]},{"id":"VNL-H-064","title":"Parathyroid","blocks":"Weigh each gland accurately in milligrams before sampling – weight is diagnostically critical. Embed each gland in entirety, in its own identified cassette, with the site as labelled recorded on the worksheet.","clinical":["Serum calcium, phosphate and parathyroid hormone levels.","Whether the disease is primary, secondary or tertiary hyperparathyroidism.","The site of each gland as identified by the surgeon.","Localisation imaging findings and any frozen section already performed."],"handling":["Weigh each gland separately in milligrams. Weight is the single most useful macroscopic measurement.","Keep each gland in its own container and its own cassette.","Fix promptly; parathyroid tissue is small and dries quickly."],"steps":["Record the site of each gland exactly as labelled by the surgeon.","Weigh each gland separately in milligrams and record each weight against its site.","Measure each gland in three dimensions.","Describe the colour: tan-brown, yellow-brown, red-brown or pale.","Record whether the capsule is intact and whether the gland is adherent to or infiltrating adjacent tissue.","Bisect and describe the cut surface: homogeneous, nodular, cystic, haemorrhagic or with fibrous bands.","Record whether a rim of normal gland is visible at the periphery.","Embed each gland in entirety in its own identified cassette.","Record the result of any frozen section against the corresponding gland."],"pitfalls":["Failing to weigh the glands, which removes the most discriminating measurement.","Combining glands in one cassette, so the abnormal gland cannot be identified.","Sampling representatively rather than embedding the whole gland."],"prompts":[{"l":"Specimen","t":"c","o":["Single gland","Multiple glands","Exploration biopsy","With thyroid"]},{"l":"Site as labelled (superior/inferior, R/L)","t":"t","h":""},{"l":"Indication","t":"c","o":["Primary HPT","Secondary HPT","Tertiary HPT","?Carcinoma","Incidental"]},{"l":"Weight (mg) – each gland","t":"t","h":""},{"l":"Dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Colour","t":"c","o":["Tan/brown","Yellow-brown","Red-brown","Pale"]},{"l":"Capsule intact?","t":"c","o":["Yes","No"]},{"l":"Cut surface","t":"c","o":["Homogeneous","Nodular","Cystic","Haemorrhagic","Fibrous bands"]},{"l":"Rim of normal gland visible?","t":"c","o":["No","Yes"]},{"l":"Adherent to / infiltrating adjacent tissue?","t":"c","o":["No","Yes – consider carcinoma"]},{"l":"Frozen section performed?","t":"c","o":["No","Yes – result: ______"]},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No"]}]},{"id":"VNL-H-065","title":"Adrenal","blocks":"Weigh the gland and any tumour separately. Ink the surface and slice at 5 mm. Blocks: ≥1 per cm of tumour including capsule and closest margin, tumour–gland interface, uninvolved cortex and medulla, and periadrenal fat.","clinical":["The side and the clinical syndrome, with the relevant biochemistry.","Imaging size and characteristics of the lesion.","Any known primary elsewhere, since the adrenal is a common metastatic site.","Any family history or syndromic association."],"handling":["Weigh the gland and any tumour separately.","Ink the external surface before slicing.","Where phaeochromocytoma is suspected, discuss fresh tissue requirements with the pathologist before fixation."],"steps":["Record the side, the procedure, the weight and the three dimensions of the gland.","Record the dimensions of the attached periadrenal fat.","Ink the external surface and record the code.","Slice the gland at 5 mm through its longest axis, keeping slices in order.","Record the tumour dimensions and weight separately from the gland.","Describe the tumour: golden-yellow, tan-brown, grey-white, haemorrhagic or necrotic.","Record whether the capsule is invaded and whether the tumour extends into periadrenal fat.","Measure the cortical thickness in the uninvolved gland and record any diffuse or nodular hyperplasia.","Measure the distance from the tumour to the nearest inked margin.","Submit at least one block per centimetre of tumour including the capsule and the closest margin, the tumour-to-gland interface, uninvolved cortex and medulla, and periadrenal fat."],"pitfalls":["Weighing the gland and tumour together, so neither weight is usable.","Under-sampling the capsule, which is central to assessing malignancy in adrenocortical tumours.","Failing to sample uninvolved gland for hyperplasia."],"prompts":[{"l":"Laterality","t":"c","o":["Right","Left"]},{"l":"Procedure","t":"c","o":["Adrenalectomy","With nephrectomy","Biopsy"]},{"l":"Clinical syndrome","t":"c","o":["Non-functioning","Cushing","Conn","Phaeochromocytoma","Virilising","Metastasis"]},{"l":"Weight (g) and dimensions (mm)","t":"t","h":""},{"l":"External surface inked?","t":"c","o":["Yes","No"]},{"l":"Periadrenal fat included – dimensions (mm)","t":"t","h":""},{"l":"Tumour present?","t":"c","o":["No – hyperplasia","Yes"]},{"l":"Tumour dimensions (mm) and weight (g)","t":"t","h":""},{"l":"Tumour appearance","t":"c","o":["Golden-yellow","Tan-brown","Grey-white","Haemorrhagic","Necrotic"]},{"l":"Capsular invasion / extra-adrenal extension?","t":"c","o":["No","Yes"]},{"l":"Cortical thickness (mm) in uninvolved gland","t":"t","h":""},{"l":"Distance to nearest margin (mm)","t":"t","h":""}]},{"id":"VNL-H-066","title":"Neuroendocrine tumour & other endocrine specimen","blocks":"Sample ≥1 block per cm of tumour with the deepest point of invasion, all margins, tumour–normal interface, background organ, and all regional nodes. Small tumours embed in entirety to allow accurate size and invasion assessment.","clinical":["The site and organ, and the operation performed.","The clinical syndrome and the relevant hormone levels.","Imaging findings including the number of lesions and any metastatic disease.","Any prior biopsy diagnosis and grading information."],"handling":["Ink the margins appropriate to the organ of origin.","Fix promptly; small neuroendocrine tumours are easily lost in fat.","Discuss fresh tissue requirements where molecular or research studies are planned."],"steps":["Record the site, the specimen type and the clinical syndrome.","Measure the specimen and weigh it where relevant.","Slice at 3–5 mm and record the number of tumour foci; multifocality is common.","Measure each tumour in three dimensions and describe it: yellow-tan, circumscribed, infiltrative, necrotic or haemorrhagic.","For gastrointestinal sites, record the depth of invasion relative to the muscularis propria.","Ink and name the margins and record the distance from tumour to the nearest margin.","Record any macroscopic mesenteric or nodal involvement.","Submit at least one block per centimetre of tumour including the deepest point of invasion.","Submit all margins, the tumour-to-normal interface, background organ and all regional nodes.","Embed small tumours in entirety so size and depth can be measured accurately."],"pitfalls":["Recording only the largest tumour when multiple foci are present.","Failing to sample the deepest point, so the depth of invasion is understated.","Missing small mesenteric deposits."],"prompts":[{"l":"Site / organ","t":"t","h":""},{"l":"Specimen type","t":"c","o":["Biopsy","Local excision","Resection"]},{"l":"Clinical syndrome / hormone excess","t":"t","h":""},{"l":"Specimen dimensions (mm) and weight (g)","t":"t","h":""},{"l":"Tumour dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Number of tumour foci","t":"t","h":""},{"l":"Tumour appearance","t":"c","o":["Yellow-tan","Circumscribed","Infiltrative","Necrotic","Haemorrhagic"]},{"l":"Depth of invasion / relation to muscularis (GI sites)","t":"t","h":""},{"l":"Margins inked?","t":"c","o":["Yes – code: ______","N/A"]},{"l":"Distance to nearest margin (mm)","t":"t","h":""},{"l":"Lymph nodes / mesentery involved macroscopically?","t":"c","o":["No","Yes"]},{"l":"Fresh tissue diverted for special studies?","t":"c","o":["No","Yes – to: ______"]}]}]},{"key":"HL","name":"Haematolymphoid","note":"Fresh triage decides whether lymphoma can be fully classified. Contact the pathologist before fixing a suspected lymphoma specimen.","ink":"#DC2626","forms":[{"id":"VNL-H-067","title":"Lymph node biopsy – suspected lymphoma","blocks":"Slice at 2–3 mm perpendicular to the long axis while fresh. Triage in this order: imprints → flow cytometry → microbiology → cytogenetics/frozen → formalin. Embed the entire remaining node, keeping the capsule in every block.","clinical":["The site and side, and the duration and rate of growth of the node.","B symptoms, blood count and film findings.","Any known lymphoma, carcinoma or infection, particularly tuberculosis and HIV.","Whether the node is the only accessible site of disease."],"handling":["Receive fresh and unfixed. Notify the pathologist before any tissue is triaged.","Never place the whole node in formalin before triage; that decision cannot be reversed.","Keep the node moist on saline gauze while triage is arranged.","Send a portion for mycobacterial culture whenever the node is necrotic or caseous."],"steps":["Record the site, side, dimensions and weight of the node.","Describe the capsule: intact and smooth, nodular, breached, or matted to adjacent nodes.","Slice the fresh node at 2–3 mm perpendicular to its long axis and describe the cut surface: fleshy, nodular, necrotic, caseous or haemorrhagic.","Make touch imprints from a freshly cut surface first; these are often the most informative preparation.","Send a fresh portion for flow cytometry and record the time and the recipient laboratory.","Send a fresh portion for microbiology, including mycobacterial culture, where infection is possible.","Retain a portion for cytogenetics or molecular studies, or freeze it, as agreed with the pathologist.","Place the remaining tissue in formalin and record the time.","Embed the entire remaining node, ensuring the capsule is present in every block, since capsular and perinodal architecture is diagnostic."],"pitfalls":["Fixing the node whole, so flow cytometry and culture become impossible.","Crushing the node with forceps, which produces artefact that cannot be interpreted.","Sampling only the centre, missing the capsular relationship that distinguishes reactive from neoplastic patterns."],"prompts":[{"l":"Site and laterality","t":"t","h":""},{"l":"Received","t":"c","o":["Fresh – time ____","In fixative","In saline/RPMI"]},{"l":"Pathologist notified before triage?","t":"c","o":["Yes","No"]},{"l":"Specimen dimensions (mm) and weight (g)","t":"t","h":""},{"l":"Capsule","t":"c","o":["Intact/smooth","Nodular","Breached","Matted to others"]},{"l":"Cut surface","t":"c","o":["Fleshy/homogeneous","Nodular","Necrotic","Caseous","Haemorrhagic"]},{"l":"Touch imprints made?","t":"c","o":["No","Yes – number ____"]},{"l":"Flow cytometry sample sent?","t":"c","o":["No","Yes – to: ______ at ____"]},{"l":"Microbiology sample sent?","t":"c","o":["No","Yes – including TB culture"]},{"l":"Cytogenetics / molecular sample retained?","t":"c","o":["No","Yes"]},{"l":"Fresh/frozen tissue banked?","t":"c","o":["No","Yes – location: ______"]},{"l":"Remainder into fixative at (time)","t":"t","h":""}]},{"id":"VNL-H-068","title":"Regional lymph node dissection","blocks":"Dissect all nodes; re-examine the residual fat after fixation to improve yield. Submit every node identified: ≤5 mm whole, larger nodes bisected or serially sliced at 2 mm with all slices embedded. Keep levels/stations in separate, clearly identified cassettes.","clinical":["The site, side and the primary tumour type.","Which levels or stations the surgeon has identified and how each is labelled.","Any neoadjuvant therapy.","The number of nodes the surgeon expects."],"handling":["Keep every surgeon-identified level in its own container throughout.","Dissect fresh or after fixation; fixation firms the fat and often improves yield.","Always re-examine the residual fat after fixation."],"steps":["Record the site, side and the levels identified, and measure the specimen.","Dissect systematically through the fat, working in slices rather than randomly.","Record the total number of nodes and the number in each level separately.","Measure the largest node and record any that appear macroscopically involved.","Record matting between nodes and any extranodal extension.","Nodes of 5 mm or less: embed whole.","Larger nodes: bisect or slice at 2 mm and embed every slice.","Place each level in separate, clearly identified cassettes; never pool levels.","Return to the residual fat after fixation and dissect it a second time, adding any further nodes to the count."],"pitfalls":["A low node count from a single dissection pass, which understages the patient.","Pooling levels, so the anatomical extent of disease cannot be reported.","Embedding only part of a large node."],"prompts":[{"l":"Site and laterality","t":"t","h":""},{"l":"Levels / stations identified by surgeon?","t":"c","o":["No","Yes – list: ______"]},{"l":"Specimen dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Fat clearance method used","t":"c","o":["Manual dissection","Fixation then dissection","Clearing agent"]},{"l":"Total nodes retrieved","t":"t","h":""},{"l":"Nodes per level (record each)","t":"t","h":""},{"l":"Largest node dimensions (mm)","t":"t","h":""},{"l":"Macroscopically involved nodes – number","t":"t","h":""},{"l":"Matting / extranodal extension seen?","t":"c","o":["No","Yes"]},{"l":"Nodes ≤5 mm embedded whole?","t":"c","o":["Yes","N/A"]},{"l":"Larger nodes sliced at 2 mm and all slices embedded?","t":"c","o":["Yes","No"]},{"l":"Cassettes used (total)","t":"t","h":""}]},{"id":"VNL-H-069","title":"Sentinel lymph node – non-breast (melanoma & other)","blocks":"Bisect each node through the hilar plane along its long axis, then slice at 2 mm and embed all tissue with one node per cassette. Request the local melanoma/IHC level protocol at cut-up so the blocks are cut correctly first time.","clinical":["The primary tumour type, site and thickness or stage.","The nodal basin and side, and how each node was identified.","The radioactive counts or dye status for each packet as recorded by the surgeon.","The local protocol for levels and immunohistochemistry."],"handling":["Keep every packet separate; the surgeon's labelling is the only record.","One node per cassette without exception.","Follow the local sentinel node protocol exactly; ad hoc sampling defeats the purpose of the procedure."],"steps":["Record the number of containers and the identification of each node as labelled.","Dissect each node free of fat and measure it in three dimensions.","Record whether blue dye or pigment is visible.","Record any macroscopic deposit and any extranodal extension.","Bisect each node through the hilar plane along its long axis.","Slice each half at 2 mm and embed every slice.","Nodes of 5 mm or less: embed whole.","Place each node with all its slices in its own identified cassette.","Request the local level and immunohistochemistry protocol at the time of cut-up."],"pitfalls":["Slicing across rather than through the hilar plane, which reduces the subcapsular sinus represented.","Intervals wider than 2 mm, which allow micrometastases to be missed.","Combining nodes, so a positive sentinel node cannot be identified."],"prompts":[{"l":"Primary tumour type and site","t":"t","h":""},{"l":"Node basin and laterality","t":"t","h":""},{"l":"Number of containers / packets","t":"t","h":""},{"l":"Node identification as labelled (hot counts, blue, palpable)","t":"t","h":""},{"l":"Total nodes identified","t":"t","h":""},{"l":"Dimensions of each node (mm)","t":"t","h":""},{"l":"Blue dye / pigment visible?","t":"c","o":["No","Yes"]},{"l":"Macroscopic deposit suspected?","t":"c","o":["No","Yes – node: ____"]},{"l":"Extranodal extension?","t":"c","o":["No","Yes"]},{"l":"Bisected / sliced through hilum at 2 mm?","t":"c","o":["Yes","N/A – ≤5 mm"]},{"l":"All slices embedded, one node per cassette?","t":"c","o":["Yes","No"]},{"l":"IHC protocol requested","t":"t","h":""}]},{"id":"VNL-H-070","title":"Spleen","blocks":"Weigh, then slice the fresh spleen at 10 mm and inspect every slice. Trauma: 2 blocks including the capsular tear. Haematological indication: ≥4 blocks of representative parenchyma including capsule, every focal lesion in full, and all hilar nodes.","clinical":["The indication and the operative findings.","For trauma, the mechanism and the time since injury.","For haematological indications, the blood count, film and any known lymphoma.","Whether the spleen was removed incidentally with another organ."],"handling":["Weigh the spleen fresh; weight is a key measurement.","Slice fresh at 10 mm so fixative penetrates, then fix.","Where lymphoma is suspected, triage fresh tissue as for a lymph node before fixation."],"steps":["Record the indication, the weight and the three dimensions.","Describe the capsule: intact, wrinkled, lacerated, fibrinous, and record any accessory spleen.","Record the site and length of any laceration or rupture.","Slice at 10 mm through the longest axis and inspect every slice.","Describe the cut surface: uniform red pulp, prominent white pulp, nodular, infarcted or fibrotic.","Record any focal lesion with its number, size range and appearance.","Examine the hilar vessels for thrombus and identify any hilar nodes.","Where lymphoma is suspected, take imprints and divert fresh tissue for flow cytometry before fixation.","Trauma: submit two blocks including the capsular tear.","Haematological indication: submit at least four blocks of representative parenchyma including capsule, every focal lesion in full, and all hilar nodes."],"pitfalls":["Failing to weigh the spleen before fixation.","Submitting a single block from a spleen removed for a haematological indication.","Missing an accessory spleen, which explains persistent disease after splenectomy."],"prompts":[{"l":"Indication","t":"c","o":["Trauma","Hypersplenism","?Lymphoma","Staging","Incidental with other resection"]},{"l":"Weight (g) and dimensions (mm)","t":"t","h":""},{"l":"Capsule","t":"c","o":["Intact/smooth","Wrinkled","Lacerated","Fibrinous","Accessory spleen present"]},{"l":"Laceration/rupture site and length (mm)","t":"t","h":""},{"l":"Cut surface","t":"c","o":["Uniform red pulp","Prominent white pulp","Nodular","Infarcts","Fibrotic"]},{"l":"Lesion(s) present?","t":"c","o":["No","Yes – number ____, size range ____ mm"]},{"l":"Lesion appearance","t":"c","o":["Pale/infarct","Fleshy nodules","Cystic","Necrotic"]},{"l":"Hilar vessels – thrombus present?","t":"c","o":["No","Yes"]},{"l":"Hilar nodes present?","t":"c","o":["No","Yes – number ____"]},{"l":"Fresh triage performed (suspected lymphoma)?","t":"c","o":["N/A","Yes – as VNL-H-067"]},{"l":"Slice interval used (mm)","t":"t","h":""},{"l":"Number of blocks taken","t":"t","h":""}]},{"id":"VNL-H-071","title":"Bone marrow trephine & aspirate clot","blocks":"Measure before decalcification – an adequate staging trephine is at least 15 mm of assessable marrow. Fix fully, then decalcify with a gentle agent for the minimum time (over-decalcification destroys antigenicity). Embed the core in entirety, straight, with the aspirate clot in a separate cassette.","clinical":["The indication and the site of the trephine.","The full blood count, film report and any known haematological diagnosis.","Whether the trephine is for staging a lymphoma, and the primary diagnosis.","Whether aspirate films and flow cytometry have been taken separately."],"handling":["Measure the trephine before decalcification; an adequate staging trephine is at least 15 mm of assessable marrow.","Fix fully before decalcifying.","Use the gentlest decalcifying agent for the shortest effective time; over-decalcification destroys antigenicity and makes immunohistochemistry unreliable.","Record the agent with start and end times."],"steps":["Record the site, the indication and whether a trephine core, an aspirate clot, or both are received.","Measure the trephine length and diameter before any processing.","Record whether the core is intact or fragmented and note whether cortical bone is present at one end.","Record the size of any aspirate clot and its colour.","Record the fixative and the fixation duration.","Decalcify, recording the agent and the start and end times, and check the endpoint before processing.","Embed the trephine in entirety, laid straight, in a single cassette.","Embed the aspirate clot in a separate cassette.","Request levels and the local stain panel with the initial H&E."],"pitfalls":["Measuring after decalcification, so adequacy cannot be assessed against the standard.","Over-decalcification, which makes immunohistochemical staging of lymphoma impossible.","Embedding the core bent, so only part appears on the section."],"prompts":[{"l":"Site","t":"c","o":["Posterior iliac crest R","Posterior iliac crest L","Anterior iliac crest","Sternum"]},{"l":"Indication","t":"c","o":["Staging","Cytopenia","?Myeloma","?Lymphoma","Response assessment"]},{"l":"Trephine core received?","t":"c","o":["Yes","No"]},{"l":"Trephine length (mm) and diameter (mm)","t":"t","h":""},{"l":"Core intact or fragmented?","t":"c","o":["Intact","Fragmented – number ____"]},{"l":"Cortical bone at one end?","t":"c","o":["Yes","No"]},{"l":"Aspirate clot received?","t":"c","o":["No","Yes – size ____ mm"]},{"l":"Colour","t":"c","o":["Red-brown","Pale","Fatty/yellow","Firm white"]},{"l":"Fixative used and duration","t":"t","h":""},{"l":"Decalcifying agent, start and end time","t":"t","h":""},{"l":"Aspirate films / flow cytometry sent separately?","t":"c","o":["No","Yes"]},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No"]}]},{"id":"VNL-H-072","title":"Thymus & mediastinal lymphoid specimen","blocks":"Ink the capsule and slice at 5 mm. Blocks: ≥1 per cm of tumour showing the capsule and the closest margin (capsular invasion determines staging), tumour–thymus interface, uninvolved thymus, any attached structure, and all mediastinal nodes by station.","clinical":["The procedure and the indication.","For myasthenia gravis, the antibody status and the duration of disease.","Imaging findings including size, invasion and any adjacent structure involved.","Serum tumour markers where a germ cell tumour is a possibility."],"handling":["Ink the capsule before slicing; capsular invasion determines the stage of a thymoma.","Weigh the specimen.","Where lymphoma or germ cell tumour is possible, triage fresh tissue before fixation."],"steps":["Record the procedure, the indication, the weight and the three dimensions.","Ink the capsule and external surface and record the code.","Describe the capsule and record whether it is intact or breached.","Slice at 5 mm through the longest axis and describe the cut surface: fatty and involuted, lobulated and tan, with fibrous septa, cystic or necrotic.","Measure any tumour in three dimensions and record whether it is encapsulated or infiltrative.","Record every adjacent structure attached: pericardium, lung, vessel or nerve.","Measure the distance from the tumour to the nearest inked margin.","Where lymphoma or germ cell tumour is in the differential, take imprints and divert fresh tissue.","Submit at least one block per centimetre of tumour, each showing the capsule and the closest margin.","Submit the tumour-to-thymus interface, uninvolved thymus, every attached structure and all mediastinal nodes by station."],"pitfalls":["Failing to demonstrate the capsule in the tumour blocks, so invasion cannot be staged.","Sampling one area of a heterogeneous mediastinal mass.","Fixing before considering flow cytometry."],"prompts":[{"l":"Procedure","t":"c","o":["Thymectomy","Thymic tumour resection","Biopsy"]},{"l":"Indication","t":"c","o":["Myasthenia gravis","?Thymoma","?Lymphoma","Cyst","Incidental"]},{"l":"Weight (g) and dimensions (mm)","t":"t","h":""},{"l":"Capsule / external surface inked?","t":"c","o":["Yes","No"]},{"l":"Capsule intact?","t":"c","o":["Yes","No – breached"]},{"l":"Cut surface","t":"c","o":["Fatty/involuted","Lobulated tan","Fibrous septa","Cystic","Necrotic"]},{"l":"Tumour present?","t":"c","o":["No","Yes – dimensions ____ × ____ × ____ mm"]},{"l":"Encapsulated or infiltrative?","t":"c","o":["Encapsulated","Infiltrative"]},{"l":"Adjacent structures attached (pericardium, lung, vessel)","t":"t","h":""},{"l":"Distance to nearest margin (mm)","t":"t","h":""},{"l":"Fresh triage for lymphoma performed?","t":"c","o":["No","Yes – as VNL-H-067"]},{"l":"Photographed?","t":"c","o":["No","Yes – ref: ______"]}]}]},{"key":"RC","name":"Respiratory & Cardiovascular","note":"Inflate and fix lung resections where possible; margins in thoracic specimens include bronchial, vascular and pleural surfaces.","ink":"#0891B2","forms":[{"id":"VNL-H-073","title":"Lung, bronchial & pleural biopsy (including EBUS)","blocks":"Embed all fragments in entirety, one site per cassette, wrapped in lens paper or in a nylon bag. Request 3 levels routinely, and reserve unstained sections for predictive marker testing where malignancy is suspected.","clinical":["The procedure, the lobe and side, and the site of each container.","The radiological findings and the clinical diagnosis.","Whether infection, particularly tuberculosis, is suspected.","Whether predictive marker testing is anticipated on a malignant sample."],"handling":["Formalin. Fragments are tiny and float: use a nylon bag, mesh cassette or lens paper.","One site per cassette.","Where infection is suspected, ensure a separate fresh sample has gone to microbiology, including mycobacterial culture."],"steps":["Record the specimen type, the site of each container and the number of fragments in each.","Record the size range and describe the fragments: tan and spongy, white and firm, anthracotic, haemorrhagic or caseous.","Note whether fragments float, which indicates aerated lung.","Apply a marker dye and wrap scant tissue in lens paper.","Embed each site separately, in entirety.","Request three levels routinely.","Where malignancy is likely, reserve intervening unstained sections at cut-up so tissue is not exhausted by recuts before predictive testing.","Record where any cell block or rapid on-site preparation has been sent."],"pitfalls":["Exhausting a small malignant biopsy on diagnostic immunohistochemistry, leaving none for predictive markers.","Combining sites, so the distribution of disease cannot be reported.","Losing fragments in processing with no record of the number received."],"prompts":[{"l":"Specimen type","t":"c","o":["Bronchial biopsy","Transbronchial","EBUS-TBNA","CT-guided core","Pleural biopsy"]},{"l":"Site, lobe and laterality","t":"t","h":""},{"l":"Clinical / radiological diagnosis","t":"t","h":""},{"l":"Number of containers and sites","t":"t","h":""},{"l":"Number of fragments / cores","t":"t","h":""},{"l":"Size range (mm)","t":"t","h":""},{"l":"Appearance","t":"c","o":["Tan/spongy","White/firm","Anthracotic","Haemorrhagic","Necrotic/caseous"]},{"l":"Fragments float in formalin?","t":"c","o":["Yes – aerated lung","No"]},{"l":"Microbiology sample sent?","t":"c","o":["No","Yes – including AFB"]},{"l":"Cell block / rapid on-site evaluation?","t":"c","o":["No","Yes"]},{"l":"Marker dye used","t":"t","h":""},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No"]}]},{"id":"VNL-H-074","title":"Lung resection (wedge / lobectomy / pneumonectomy)","blocks":"Take bronchial and vascular margins first as en-face shaves. Ink the pleura. Inflate with formalin where feasible, then slice sagittally at 5–10 mm. Blocks: ≥3 through tumour including pleura and the closest margin, tumour–lung interface, background lung ×2, and all hilar and intrapulmonary nodes plus separately submitted nodal stations.","clinical":["The procedure, the lobe and the side.","The diagnosis on prior biopsy or cytology.","Neoadjuvant therapy, which requires assessment of regression.","Which nodal stations the surgeon has submitted separately."],"handling":["Take the bronchial and vascular margins as en-face shaves before any other cut.","Ink the pleural surface over the tumour.","Inflate the lung with formalin through the bronchus where feasible, then fix before slicing.","Keep separately submitted nodal stations in their own containers."],"steps":["Record the procedure, the side, the lobe, the weight and the dimensions.","Take en-face margins from the bronchus and the pulmonary vessels before opening.","Describe the pleural surface: smooth, puckered over the tumour, fibrinous, adherent or nodular.","Ink the pleura over and around the tumour.","Inflate with formalin through the bronchial stump where possible and fix.","Slice sagittally at 5–10 mm, keeping the slices in order.","Record the tumour site, its three dimensions and its distance from the pleura and from the bronchial margin.","Describe the tumour: firm and white, anthracotic, cavitating, mucoid or necrotic, and estimate necrosis after neoadjuvant therapy.","Describe the background lung: emphysematous, fibrotic, consolidated or bullous.","Submit at least three blocks through the tumour including the pleura and the closest margin, the tumour-to-lung interface, and at least two blocks of background lung.","Dissect all hilar and intrapulmonary nodes and submit them with the separately labelled stations."],"pitfalls":["Slicing before inflation, so the architecture collapses and the tumour's relation to the pleura is lost.","Taking the bronchial margin after cutting through the tumour.","Failing to sample background lung, so coexisting interstitial disease is not reported."],"prompts":[{"l":"Procedure","t":"c","o":["Wedge","Segmentectomy","Lobectomy – lobe: ______","Bilobectomy","Pneumonectomy"]},{"l":"Laterality","t":"c","o":["Right","Left"]},{"l":"Neoadjuvant therapy?","t":"c","o":["No","Yes – assess regression"]},{"l":"Weight (g) and dimensions (mm)","t":"t","h":""},{"l":"Pleural surface inked?","t":"c","o":["Yes","No"]},{"l":"Pleural surface","t":"c","o":["Smooth","Puckered over tumour","Fibrinous","Adhesions","Nodules"]},{"l":"Tumour dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Tumour site and distance from pleura (mm)","t":"t","h":""},{"l":"Tumour appearance","t":"c","o":["Firm white","Anthracotic","Cavitating","Mucoid","Necrotic"]},{"l":"Distance to bronchial margin (mm)","t":"t","h":""},{"l":"Distance to vascular / staple margin (mm)","t":"t","h":""},{"l":"Background lung","t":"c","o":["Normal","Emphysematous","Fibrotic","Consolidated","Bullae"]}]},{"id":"VNL-H-075","title":"Pleura, decortication & pleurectomy","blocks":"Biopsies: embed in entirety. Decortication/pleurectomy: slice the entire specimen and sample all nodular and maximally thickened areas (≥6 blocks), the deep margin, and any attached lung or chest wall. Deep, full-thickness sampling is required to assess invasion in suspected mesothelioma.","clinical":["The specimen type, site and side, and the indication.","Occupational history, particularly asbestos exposure, where mesothelioma is queried.","Imaging findings including pleural thickening and effusion.","Any prior cytology on pleural fluid, with the laboratory number."],"handling":["Where mesothelioma is suspected, deep full-thickness tissue is essential; do not discard the fibrous deep aspect.","Send fresh tissue for microbiology, including mycobacterial culture, in empyema.","Where rib or chest wall is included, separate it for decalcification."],"steps":["Record the specimen type, the site, the side and the aggregate dimensions and weight.","Count the pieces and describe the surface: smooth, fibrinous, granular, nodular, or plaque-like.","Measure the maximum thickness of the pleural peel.","Record nodules with their number and size range.","Ink the deep margin where the specimen is a formal resection.","Slice the entire specimen and inspect all surfaces.","Biopsies: embed in entirety.","Decortication and pleurectomy: sample all nodular and maximally thickened areas, submitting at least six blocks, plus the deep margin.","Sample any attached lung or chest wall separately, decalcifying rib where included."],"pitfalls":["Sampling only the surface, so invasion into fat or muscle cannot be demonstrated.","Submitting too few blocks from a decortication, where diagnostic tissue is focal.","Failing to send tissue for culture in a suspected empyema."],"prompts":[{"l":"Specimen type","t":"c","o":["Pleural biopsy","Decortication/peel","Pleurectomy","Chest wall resection"]},{"l":"Site and laterality","t":"t","h":""},{"l":"Indication","t":"c","o":["Effusion","?Mesothelioma","?Metastasis","Empyema","Pneumothorax/bullae"]},{"l":"Aggregate dimensions (mm) and weight (g)","t":"t","h":""},{"l":"Number of pieces","t":"t","h":""},{"l":"Surface appearance","t":"c","o":["Smooth","Fibrinous","Granular","Nodular","Thickened plaque"]},{"l":"Maximum thickness (mm)","t":"t","h":""},{"l":"Nodules present?","t":"c","o":["No","Yes – number ____, size range ____ mm"]},{"l":"Chest wall / rib included?","t":"c","o":["No","Yes – decalcify"]},{"l":"Margins inked (resection)?","t":"c","o":["N/A","Yes – code: ______"]},{"l":"Fresh tissue for microbiology?","t":"c","o":["No","Yes – including AFB"]},{"l":"Number of blocks taken","t":"t","h":""}]},{"id":"VNL-H-076","title":"Mediastinal specimen","blocks":"Ink the surface and slice at 5 mm. Sample ≥1 block per cm of lesion including the capsule and closest margin, all areas of differing appearance (germ cell tumours are heterogeneous), attached structures, and all nodes by station.","clinical":["The compartment and the specimen type.","The patient's age and serum tumour markers where a germ cell tumour is possible.","Imaging characteristics: cystic, solid, fatty or calcified.","Any known lymphoma or systemic disease."],"handling":["Ink the capsule or external surface before slicing.","Where lymphoma or germ cell tumour is possible, triage fresh tissue before fixation.","Record and preserve any attached structure in its anatomical relationship."],"steps":["Record the compartment, the specimen type, the weight and the dimensions.","Ink the capsule or external surface.","Slice at 5 mm and describe the cut surface: solid and fleshy, cystic, fatty, calcified, necrotic or haemorrhagic.","Record cyst contents where present.","Measure the lesion in three dimensions and record every area of differing appearance; germ cell tumours are heterogeneous.","Record every attached structure and whether the lesion appears to invade it.","Measure the distance from the lesion to the nearest inked margin.","Divert fresh tissue for flow cytometry where lymphoma is possible, and make imprints.","Submit at least one block per centimetre of lesion, including the capsule and the closest margin, and sample every distinct area.","Submit all attached structures and all nodes by station."],"pitfalls":["Sampling a single area of a heterogeneous germ cell tumour, so a component that changes treatment is missed.","Fixing before flow cytometry in a suspected lymphoma.","Failing to ink, so invasion of the capsule cannot be assessed."],"prompts":[{"l":"Compartment","t":"c","o":["Anterior","Middle","Posterior"]},{"l":"Specimen type","t":"c","o":["Biopsy","Cyst excision","Mass resection","Node dissection"]},{"l":"Clinical / radiological diagnosis","t":"t","h":""},{"l":"Specimen dimensions (mm) and weight (g)","t":"t","h":""},{"l":"Capsule / surface inked?","t":"c","o":["Yes","No"]},{"l":"Cut surface","t":"c","o":["Solid fleshy","Cystic","Fatty","Calcified","Necrotic","Haemorrhagic"]},{"l":"Cyst contents if present","t":"t","h":""},{"l":"Lesion dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Attached structures (thymus, pericardium, lung, nerve)","t":"t","h":""},{"l":"Distance to nearest margin (mm)","t":"t","h":""},{"l":"Fresh triage performed (?lymphoma, ?germ cell)?","t":"c","o":["No","Yes – as VNL-H-067"]},{"l":"Nodes identified – stations and numbers","t":"t","h":""}]},{"id":"VNL-H-077","title":"Cardiovascular specimen (valve, vessel, myocardium)","blocks":"Valves and small vessel segments: photograph, then embed representative sections in entirety after decalcification if needed. Send vegetations for microbiology before fixation. Endomyocardial biopsies: embed all fragments in one cassette and request multiple levels plus a connective tissue stain.","clinical":["The specimen type, the valve or vessel involved, and the indication.","Echocardiographic or angiographic findings.","Whether endocarditis is suspected and whether blood cultures have been taken.","For endomyocardial biopsy, the transplant history or the suspected cardiomyopathy."],"handling":["Send vegetations for microbiology before fixation.","Photograph valves before sectioning; their configuration cannot be reconstructed.","Decalcify calcified valves and vessels after fixation, recording agent and times.","Endomyocardial biopsy fragments are minute: use lens paper and embed all in one cassette."],"steps":["Record the specimen type, the site, the number of fragments and the aggregate dimensions, and weigh where relevant.","For valves, describe each leaflet: thickening, calcification, commissural fusion, vegetations, perforation or myxoid change.","Where vegetations are present, take a fresh sample for microbiology and record its size before fixation.","For vessels, record the wall thickness and describe atheroma, calcification, a dissection plane or aneurysmal thinning.","Record any thrombus and whether it appears fresh or organised.","Photograph the specimen.","Decalcify where necessary and record the agent with start and end times.","Submit representative sections in entirety for valves and small vessel segments.","Endomyocardial biopsies: embed all fragments in one cassette and request multiple levels plus a connective tissue stain."],"pitfalls":["Fixing a vegetation before microbiology, so the organism is never identified.","Over-decalcifying a valve, so the remaining tissue is uninterpretable.","Losing endomyocardial fragments, which are frequently smaller than 1 mm."],"prompts":[{"l":"Specimen type","t":"c","o":["Heart valve","Vessel/aneurysm wall","Endarterectomy","Myectomy","Endomyocardial biopsy","Atrial appendage"]},{"l":"Site and valve name if applicable","t":"t","h":""},{"l":"Indication","t":"c","o":["Stenosis","Regurgitation","?Endocarditis","Aneurysm/dissection","Cardiomyopathy","Explanted prosthesis"]},{"l":"Number of fragments and aggregate dimensions (mm)","t":"t","h":""},{"l":"Weight (g)","t":"t","h":""},{"l":"Valve leaflets","t":"c","o":["Thickened","Calcified","Fused commissures","Vegetations","Perforated","Myxoid/floppy"]},{"l":"Vegetations present?","t":"c","o":["No","Yes – size ____ mm, send for microbiology"]},{"l":"Vessel wall thickness (mm) and appearance","t":"c","o":["Atheroma","Calcified","Dissection plane","Aneurysmal thinning"]},{"l":"Thrombus present?","t":"c","o":["No","Yes – fresh","/ organised"]},{"l":"Decalcification required?","t":"c","o":["No","Yes – agent/time: ______"]},{"l":"Endomyocardial biopsy – number of pieces","t":"t","h":""},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No"]}]}]},{"key":"NEU","name":"Neuropathology & Ophthalmic","note":"Small, fragile and often unrepeatable specimens. Confirm the fresh-tissue requirement with the pathologist before fixing.","ink":"#4338CA","forms":[{"id":"VNL-H-078","title":"Brain & central nervous system biopsy","blocks":"Handle with a spatula only. Make smear preparations first – they are often the most informative material. Embed all remaining tissue in entirety in a single identified cassette, using lens paper for tiny fragments, and reserve tissue for molecular testing where a glioma is suspected.","clinical":["The site, side and the surgical approach.","The radiological diagnosis and the appearance of the lesion on imaging.","Immune status and any clinical suspicion of infection.","Whether molecular testing is anticipated, which requires tissue to be reserved."],"handling":["Receive fresh where possible and confirm the pathologist's requirements before fixation.","Handle with a spatula only. Central nervous system tissue is extremely fragile.","Make smear or squash preparations before anything else; these frequently provide the diagnosis.","Send fresh tissue for microbiology, including fungal and mycobacterial culture, where infection is possible."],"steps":["Record the site, side, approach and the number of fragments with their size range.","Describe the tissue: grey and soft, white and firm, gelatinous, necrotic, haemorrhagic or gritty.","Make smear preparations from a representative fragment before any tissue is fixed or diverted.","Divert fresh tissue for microbiology where infection is suspected.","Reserve tissue for molecular testing where a glioma is possible, as agreed with the pathologist.","Apply a marker dye and wrap tiny fragments in lens paper.","Embed all remaining tissue in entirety in a single identified cassette.","Request levels routinely."],"pitfalls":["Fixing everything before smears are made, losing the most informative preparation.","Crushing the tissue with forceps, producing artefact indistinguishable from pathology.","Exhausting a stereotactic biopsy so no tissue remains for molecular classification."],"prompts":[{"l":"Site, side and approach","t":"t","h":""},{"l":"Biopsy type","t":"c","o":["Stereotactic","Open/incisional","Dura","Meningeal"]},{"l":"Clinical / radiological diagnosis","t":"t","h":""},{"l":"Received","t":"c","o":["Fresh – time ____","In fixative"]},{"l":"Number of fragments","t":"t","h":""},{"l":"Size range (mm) and aggregate dimensions (mm)","t":"t","h":""},{"l":"Appearance","t":"c","o":["Grey/soft","White/firm","Gelatinous","Necrotic","Haemorrhagic","Gritty"]},{"l":"Smear / squash preparations made?","t":"c","o":["No","Yes – number ____"]},{"l":"Fresh tissue for microbiology?","t":"c","o":["No","Yes – including fungal/AFB"]},{"l":"Tissue retained for molecular / tumour bank?","t":"c","o":["No","Yes"]},{"l":"Marker dye used","t":"t","h":""},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No"]}]},{"id":"VNL-H-079","title":"CNS tumour resection & debulking","blocks":"Sample every macroscopically distinct area – grading depends on identifying the most cellular and necrotic regions. Minimum 4 blocks or entire specimen if small. Include any attached dura, bone and adjacent brain, and retain unfixed tissue for molecular classification.","clinical":["The site, side and compartment, and the extent of resection intended.","The radiological diagnosis and whether the lesion enhances.","Any prior surgery, radiotherapy or chemotherapy.","Which molecular tests the local pathway requires."],"handling":["Receive fresh, and reserve unfixed tissue for molecular classification before fixing the remainder.","Ultrasonic aspirate material is fragmented; concentrate it and embed in entirety.","Handle with a spatula; do not use forceps on soft tumour tissue."],"steps":["Record the site, side, procedure and the aggregate dimensions and weight.","Record the number of pieces and whether the specimen is piecemeal or en bloc.","Describe the tissue and record every macroscopically distinct area: homogeneous grey, firm and white, gelatinous, cystic, necrotic, haemorrhagic or unusually vascular.","Make smears or imprints from a representative fragment.","Reserve fresh or frozen tissue for molecular testing.","Record any attached dura, bone or adjacent brain.","Where the specimen is en bloc and margins are identifiable, ink and record them.","Sample every macroscopically distinct area separately; grading depends on identifying the most cellular and the necrotic regions.","Submit a minimum of four blocks, or the entire specimen if small.","Submit any attached dura, bone and adjacent brain."],"pitfalls":["Sampling one area of a heterogeneous glioma, so the highest grade component is missed.","Fixing all tissue, leaving none for molecular classification.","Discarding apparently necrotic material, which is required for grading."],"prompts":[{"l":"Site, side and lobe / compartment","t":"t","h":""},{"l":"Procedure","t":"c","o":["Debulking/piecemeal","En bloc resection","Ultrasonic aspirate"]},{"l":"Received","t":"c","o":["Fresh","In fixative"]},{"l":"Aggregate dimensions (mm) and weight (g)","t":"t","h":""},{"l":"Number of pieces","t":"t","h":""},{"l":"Appearance","t":"c","o":["Homogeneous grey","Firm white","Gelatinous/myxoid","Cystic","Necrotic","Haemorrhagic","Vascular"]},{"l":"Areas of differing appearance present?","t":"c","o":["No","Yes – sample each separately"]},{"l":"Dura / bone / brain attached?","t":"c","o":["No","Yes – describe: ______"]},{"l":"Margins identifiable / inked?","t":"c","o":["No – piecemeal","Yes – code: ______"]},{"l":"Smears / imprints made?","t":"c","o":["No","Yes"]},{"l":"Frozen tissue / molecular sample retained?","t":"c","o":["No","Yes – location: ______"]},{"l":"Photographed?","t":"c","o":["No","Yes – ref: ______"]}]},{"id":"VNL-H-080","title":"Nerve & skeletal muscle biopsy","blocks":"Divide immediately on receipt without stretching: transverse and longitudinal segments for paraffin, a transversely orientated portion snap-frozen, and 1 mm cubes into glutaraldehyde for EM. Never clamp or stretch nerve or muscle – artefact is irreversible.","clinical":["The nerve or muscle sampled and the side.","The clinical syndrome, distribution of weakness and the neurophysiology findings.","Creatine kinase level and any family history.","Confirmation that frozen, resin and electron microscopy samples are required."],"handling":["Receive fresh, immediately, and process without delay. Delay makes the specimen uninterpretable.","Never clamp, stretch or pin under tension; the artefact produced is irreversible.","Snap-freeze a transversely orientated portion in isopentane cooled in liquid nitrogen.","Place 1 mm cubes into glutaraldehyde for electron microscopy."],"steps":["Record the specimen, the muscle or nerve named, the side and the time from excision to receipt.","Measure the nerve length and diameter, or the muscle dimensions and weight.","Describe the appearance: normal, pale, fatty, fibrotic or atrophic.","Divide the specimen immediately, without stretching, into portions for paraffin, frozen section, resin and electron microscopy.","Orientate one portion transversely and snap-freeze it, recording the time.","Place 1 mm cubes into glutaraldehyde for electron microscopy.","Place a portion into the resin fixative for semithin sections where nerve is being examined.","Fix the remaining portions for paraffin, keeping transverse and longitudinal orientations identified.","Record which portion has gone where, so the pathologist can match the preparations."],"pitfalls":["Stretching or clamping the s
