<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VNHL Histology Cutup worksheets</title>
<style>
:root{
  --bench:#E9EDF0; --sheet:#FFFFFF; --ink:#16202B; --slate:#5B6B78;
  --rule:#CBD5DC; --rule-soft:#E3E9ED; --accent:#0B6E99; --accent-soft:#E2F0F6;
  --warn:#9C2A0E; --warn-soft:#FBEDE8; --warn-ink:#7A2008;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  --ui: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--ui); color:var(--ink); background:var(--bench); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased}
button{font-family:inherit}
.code{font-family:var(--mono); letter-spacing:.04em; font-size:.85em}

.app{display:grid; grid-template-columns:290px minmax(0,1fr); min-height:100vh}
.topbar{grid-column:1/-1; display:flex; gap:18px; align-items:center; flex-wrap:wrap; padding:13px 22px;
  background:var(--sheet); border-bottom:1px solid var(--rule); position:sticky; top:0; z-index:20}
.brandwrap{display:flex; align-items:center; gap:10px; margin-right:6px}
.brandwrap img{width:32px; height:auto}
.brand{display:flex; flex-direction:column; line-height:1.2}
.brand b{font-size:15px; letter-spacing:-.01em}
.brand span{font-size:11px; color:var(--slate); letter-spacing:.03em; text-transform:uppercase}

.search{position:relative; flex:1 1 300px; min-width:220px}
.search input{width:100%; padding:10px 40px 10px 38px; font-size:14.5px; font-family:inherit;
  border:1px solid var(--rule); border-radius:7px; background:#FBFDFE; color:var(--ink)}
.search input:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}
.search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.5}
.search kbd{position:absolute; right:10px; top:50%; transform:translateY(-50%); font-family:var(--mono);
  font-size:11px; color:var(--slate); border:1px solid var(--rule); border-radius:4px; padding:1px 5px; background:#fff}
.acts{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.btn{border:1px solid var(--rule); background:#fff; color:var(--ink); padding:9px 13px; border-radius:7px;
  font-size:13.5px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; white-space:nowrap}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:#08587A; color:#fff}
.btn[disabled]{opacity:.4; cursor:not-allowed; border-color:var(--rule); color:var(--slate)}
.btn .n{font-family:var(--mono); font-size:11.5px; background:rgba(255,255,255,.25); padding:1px 6px; border-radius:20px}
.btn:not(.primary) .n{background:var(--accent-soft); color:var(--accent)}

.side{background:var(--sheet); border-right:1px solid var(--rule); padding:16px 0 40px;
  position:sticky; top:62px; align-self:start; max-height:calc(100vh - 62px); overflow-y:auto}
.side h2{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--slate); margin:0 0 8px; padding:0 18px; font-weight:600}
.side .sep{height:1px; background:var(--rule-soft); margin:16px 0}
.gitem{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:8px 18px 8px 0;
  border:0; background:none; cursor:pointer; font-size:13.5px; color:var(--ink)}
.gitem:hover{background:#F4F8FA}
.gitem .bar{width:5px; height:26px; border-radius:0 3px 3px 0; flex:none}
.gitem .lbl{flex:1; min-width:0; line-height:1.25}
.gitem .lbl small{display:block; color:var(--slate); font-size:10.5px; font-family:var(--mono)}
.gitem .ct{font-family:var(--mono); font-size:11.5px; color:var(--slate)}
.gitem[aria-pressed="true"]{background:var(--accent-soft); font-weight:600}
.gitem[aria-pressed="true"] .ct{color:var(--accent)}

.main{padding:20px 22px 60px; min-width:0}
.meta{display:flex; justify-content:space-between; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:14px}
.meta p{margin:0; font-size:13px; color:var(--slate)}
.linkish{background:none; border:0; color:var(--accent); cursor:pointer; font-size:13px; padding:0; text-decoration:underline}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:11px}
.card{display:grid; grid-template-columns:5px 22px minmax(0,1fr); align-items:start; background:var(--sheet);
  border:1px solid var(--rule); border-radius:8px; overflow:hidden; cursor:pointer; transition:border-color .12s, box-shadow .12s}
.card:hover{border-color:var(--accent); box-shadow:0 1px 8px rgba(11,110,153,.10)}
.card.on{border-color:var(--accent); background:#F7FCFD}
.card .spine{align-self:stretch}
.card .tick{margin:13px 0 0 9px; width:15px; height:15px; accent-color:var(--accent); cursor:pointer}
.card .body{padding:11px 13px 12px 8px; min-width:0}
.card .c{color:var(--slate); display:block; margin-bottom:3px; font-weight:600}
.card.on .c{color:var(--accent)}
.card h3{margin:0; font-size:14px; font-weight:600; line-height:1.3}
.card .g{margin:5px 0 0; font-size:11.5px; color:var(--slate)}
.card mark{background:#FDF0BF; color:inherit; padding:0 1px; border-radius:2px}
.empty{padding:60px 20px; text-align:center; color:var(--slate)}
.empty b{display:block; color:var(--ink); font-size:16px; margin-bottom:6px}

.drawer{position:fixed; inset:0; background:rgba(22,32,43,.45); display:none; z-index:40; padding:26px; overflow:auto}
.drawer.open{display:block}
.drawer .inner{max-width:880px; margin:0 auto; background:#fff; border-radius:10px; overflow:hidden}
.drawer .dh{display:flex; align-items:center; gap:10px; padding:12px 18px; border-bottom:1px solid var(--rule);
  position:sticky; top:0; background:#fff; z-index:3; flex-wrap:wrap}
.drawer .dh h3{margin:0; font-size:15px; flex:1; min-width:180px}
.tabs{display:flex; gap:0; border-bottom:1px solid var(--rule); background:#F7FAFC; position:sticky; top:53px; z-index:2}
.tabs button{border:0; background:none; padding:10px 18px; font-size:13.5px; cursor:pointer; color:var(--slate); border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent); font-weight:600; background:#fff}
.drawer .dbody{padding:20px}

/* ---------- protocol sheet ---------- */
.proto{background:#fff; color:#000; font-size:12px; line-height:1.4}
.lh{display:flex; align-items:center; gap:11px; border-bottom:2px solid var(--band,#1F3864); padding-bottom:6px; margin-bottom:3px}
.lh img{width:34px; height:auto; flex:none}
.lh .org{margin:0 0 2px; font-size:11px; font-weight:700; color:var(--band,#1F3864); line-height:1.25}
.lh .sh{display:flex; align-items:baseline; gap:9px}
.lh .sh .code{font-size:13px; font-weight:700; color:var(--band,#1F3864)}
.lh .sh h4{margin:0; font-size:13.5px; font-weight:700}
.sub{font-size:9.5px; color:#666; font-style:italic; margin:0 0 9px}
.band{background:var(--band,#1F3864); color:#fff; font-size:9.5px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; padding:4px 8px; margin-top:9px}
.band.red{background:var(--warn)}
.plist{width:100%; border-collapse:collapse; table-layout:fixed}
.plist td{border:1px solid #A8B6C2; padding:4px 7px; vertical-align:top; font-size:10.5px}
.plist td.i{width:34px; text-align:center; background:#F2F5FA; color:#1F3864; font-weight:700}
.plist td.b{width:34px; text-align:center; background:#F2F5FA; color:#8496B0}
.samp{border:1px solid #A8B6C2; border-top:0; background:#DEE6F0; padding:5px 8px; font-size:10.5px}
.errs{border:1px solid #A8B6C2; border-top:0}
.errs div{padding:4px 8px; font-size:10.5px; background:var(--warn-soft); color:var(--warn-ink); border-bottom:1px solid #E8D3CB}
.errs div:last-child{border-bottom:0}

/* ---------- worksheet ---------- */
.sheet{background:#fff; color:#000; font-size:12px; line-height:1.35}
.sheet table{width:100%; border-collapse:collapse; table-layout:fixed}
.sheet td{border:1px solid #A8B6C2; padding:4px 6px; vertical-align:middle; font-size:10.5px}
.sheet td.k{background:#F2F5FA; font-weight:600; color:#1F3864; width:24%}
.sheet td.k2{background:#F2F5FA; font-weight:600; color:#1F3864; width:33%}
.sheet .hint{font-size:9.5px; font-style:italic; background:#DEE6F0; padding:4px 7px; border:1px solid #A8B6C2; border-top:0}
.sheet input[type=text]{width:100%; border:0; background:transparent; font:inherit; font-size:10.5px; color:#000; padding:1px 0}
.sheet input[type=text]:focus{outline:0; background:#FFF9DB}
.sheet input[type=text]::placeholder{color:#9AA7B2}
.sheet .opts{display:flex; flex-wrap:wrap; gap:3px 14px}
.sheet .opts label{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; cursor:pointer}
.sheet .opts input{width:11px; height:11px; margin:0; accent-color:#1F3864}
.sheet .free td{height:52px; vertical-align:top}
.sheet .bk td{height:20px}
.sheet .bk td.n{width:8%; text-align:center; color:#555}
.sheet .bk td.d{width:72%}
.foot{font-size:9px; color:#777; margin-top:6px; display:flex; justify-content:space-between}

#printroot{display:none}
@page{size:A4 portrait; margin:10mm}
@media print{
  .topbar,.side,.main,.drawer,.toast{display:none !important}
  body{background:#fff}
  .app{display:block}
  #printroot{display:block}
  .sheet,.proto{page-break-after:always; break-after:page; font-size:11px}
  #printroot > *:last-child{page-break-after:auto; break-after:auto}
  .sheet input[type=text]{background:transparent !important}
  .lh img{width:32px !important}
  *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
}

.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:var(--ink); color:#fff;
  padding:12px 18px; border-radius:8px; font-size:13.5px; opacity:0; pointer-events:none; transition:.22s; z-index:60; max-width:min(520px,92vw)}
.toast.show{opacity:1; transform:translate(-50%,0)}
.toast b{color:#9FD8EE}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static; max-height:none; border-right:0; border-bottom:1px solid var(--rule)}
  .topbar{position:static}
  .tabs{top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

const DATA = [{"key":"GEN","name":"General Information & Universal Forms","note":"Use these before and alongside the system-specific worksheets. GEN-01 covers any specimen without a dedicated form.","ink":"#4A5560","forms":[{"id":"VNL-H-001","title":"Universal specimen worksheet (any specimen without a dedicated form)","blocks":"Small specimens: embed in entirety. Larger specimens: representative sections of lesion, lesion–normal interface, all inked margins, and any distinct area.","clinical":["Specimen site, side and the procedure performed.","Provisional clinical diagnosis and the question the clinician needs answered.","Any previous histology on the same site, with the earlier laboratory number.","Relevant treatment: recent surgery, radiotherapy, chemotherapy or immunosuppression."],"handling":["10% neutral buffered formalin at a minimum of 10 volumes of fixative to 1 volume of tissue.","Fix small specimens for at least 6 hours before cut-up; slice solid specimens over 15 mm thick to allow the fixative to reach the centre.","Record the time the specimen entered fixative; cold ischaemic and fixation times affect immunohistochemistry and molecular testing.","Do not use this worksheet where a dedicated form exists for the specimen type."],"steps":["Read the container label against the request form and confirm they name the same patient and the same site. Stop and use the discrepancy form if they do not.","Record the specimen exactly as labelled on the container, then exactly as stated on the request form, using the words supplied rather than an interpretation of them.","Count the pieces and measure the specimen in three dimensions, or record the aggregate dimensions of multiple fragments.","Describe the external surfaces: colour, consistency, capsule, serosa, skin, and any orientation suture or marker.","Identify any lesion. Record its site within the specimen, its three dimensions, its appearance and its relationship to each surface.","Ink the margins if the specimen is an excision, and record the colour code used.","Slice the specimen at 3–5 mm and inspect every slice before selecting blocks.","Sample the lesion, the lesion-to-normal interface, the closest margin and any area of differing appearance. Embed small specimens in entirety.","Complete the block key as each cassette is filled, then sign the cut-up record."],"pitfalls":["Describing what the specimen was expected to be rather than what is in the container.","Slicing before inking, after which margins cannot be reconstructed.","Leaving a lesion partly sampled because the specimen looked routine."],"prompts":[{"l":"Specimen as labelled on container","t":"t","h":""},{"l":"Specimen as stated on request form","t":"t","h":""},{"l":"Labels agree?","t":"c","o":["Yes","No – complete VNL-H-002"]},{"l":"Number of pieces / fragments","t":"t","h":""},{"l":"Aggregate dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Colour / consistency","t":"t","h":""},{"l":"Surfaces, capsule, orientation markers","t":"t","h":""},{"l":"Lesion present?","t":"c","o":["No","Yes – describe below"]},{"l":"Lesion site, size (mm) and appearance","t":"t","h":""},{"l":"Nearest margin and distance (mm)","t":"t","h":""},{"l":"Inking code applied","t":"t","h":""},{"l":"Photographed?","t":"c","o":["No","Yes – image ref: ______"]},{"l":"Special handling","t":"c","o":["Fresh","Microbiology","Cytogenetics","Decalcification","Nil"]},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No – residual retained"]}]},{"id":"VNL-H-002","title":"Specimen reception discrepancy & non-conformance record","blocks":"Do not proceed to cut-up until identity is resolved and the resolution is documented above.","clinical":["Identity of the person who collected the specimen and the person who delivered it.","Whether the specimen is replaceable, and the clinical consequence of rejecting it.","The correct patient identifiers, obtained from the requester rather than assumed."],"handling":["Quarantine the specimen in its original container. Do not decant, relabel or open it.","Do not correct a label yourself. Only the requester may amend patient identification, and the amendment must be documented.","Preserve the original container and label as part of the record until the discrepancy is closed."],"steps":["Stop all processing of the specimen as soon as the discrepancy is recognised.","Record what is on the container, what is on the request form, and exactly how the two disagree.","Notify the requesting clinician or ward and record the name of the person spoken to with the date and time.","Establish whether the specimen is irreplaceable. An irreplaceable specimen may be processed with a documented disclaimer; a replaceable one should be rejected and recollected.","Record the resolution agreed, who authorised it, and the action taken.","Enter the event in the laboratory non-conformance log and record the log number here.","Where the specimen is processed under disclaimer, ensure the disclaimer text is carried onto the final report.","Have the record reviewed and signed by the pathologist or laboratory manager."],"pitfalls":["Proceeding to cut-up while intending to sort the paperwork out afterwards.","Accepting a verbal correction without recording who gave it and when.","Omitting the disclaimer from the report after processing a mislabelled specimen."],"prompts":[{"l":"Discrepancy type","t":"c","o":["Unlabelled","Mislabelled","Wrong patient ID","No request form"]},{"l":"Further discrepancy type","t":"c","o":["Leaked / dry","Wrong fixative","Insufficient fixative","Damaged container"]},{"l":"Detected by / date & time","t":"t","h":""},{"l":"Description of discrepancy","t":"t","h":""},{"l":"Clinician / ward contacted (name)","t":"t","h":""},{"l":"Date & time of contact","t":"t","h":""},{"l":"Resolution agreed","t":"t","h":""},{"l":"Specimen irreplaceable?","t":"c","o":["Yes – process with disclaimer","No – reject"]},{"l":"Action taken","t":"c","o":["Processed with comment","Rejected","Corrected by requester"]},{"l":"Disclaimer added to report?","t":"c","o":["Yes","No"]},{"l":"Non-conformance log number","t":"t","h":""},{"l":"Reviewed by pathologist / manager","t":"t","h":""}]},{"id":"VNL-H-003","title":"Urgent / fresh tissue & intraoperative specimen record","blocks":"Retain frozen section remnant and all residual tissue; submit the frozen remnant as a separately identified block.","clinical":["The intraoperative question and what decision the surgeon will make on the answer.","Site and side of the lesion, and the operation in progress.","Whether tissue is required fresh for microbiology, lymphoma protocol, cytogenetics or a tissue bank."],"handling":["Receive the specimen fresh and unfixed, in a dry sealed container or on saline-moistened gauze. Never in formalin.","Record the time of collection and the time of receipt; the ischaemic interval is part of the record.","Notify the pathologist immediately on receipt and do not begin dissection alone.","Place all residual tissue in formalin as soon as fresh requirements are satisfied, and record that time."],"steps":["Confirm the identity of the specimen with the theatre staff before the courier leaves.","Describe the fresh specimen: dimensions, orientation, surfaces and the lesion, before any tissue is removed.","Divert fresh tissue in the order agreed with the pathologist: microbiology first if infection is queried, then cytogenetics or tissue bank.","Make touch imprints from the cut surface of the lesion where lymphoma or a small round cell tumour is possible.","Assist the pathologist with the frozen section, keeping the orientation of the frozen face recorded.","Record the intraoperative opinion, the name of the person it was conveyed to and the time it was given.","Place the frozen section remnant in formalin and submit it as a separately identified block so it can be matched to the frozen slide.","Fix and process the remainder of the specimen using the appropriate specimen-specific worksheet."],"pitfalls":["Fixing the specimen before the pathologist has decided what fresh tissue is needed.","Losing the orientation of the frozen face, so the margin cannot be interpreted.","Failing to record who received the intraoperative opinion, and when."],"prompts":[{"l":"Indication","t":"c","o":["Frozen section","Fresh for microbiology","Lymphoma protocol","Research/consent"]},{"l":"Theatre / clinician notified pathologist at","t":"t","h":""},{"l":"Specimen received (date & time)","t":"t","h":""},{"l":"Received","t":"c","o":["Fresh","In saline","In fixative"]},{"l":"Ischaemic time (collection → receipt), min","t":"t","h":""},{"l":"Macroscopic description of fresh specimen","t":"t","h":""},{"l":"Tissue diverted (state to whom / for what)","t":"t","h":""},{"l":"Imprint / touch preparations made?","t":"c","o":["Yes – no. ____","No"]},{"l":"Intraoperative opinion given","t":"t","h":""},{"l":"Opinion conveyed to (name) at (time)","t":"t","h":""},{"l":"Remaining tissue placed in fixative at","t":"t","h":""},{"l":"Correlation with final report required?","t":"c","o":["Yes","No"]}]},{"id":"VNL-H-004","title":"Additional blocks, deeper levels & specimen review request","blocks":"Continue the original block sequence – never reuse a block number. Record new numbers in the block key of the original worksheet.","clinical":["The original laboratory number and the reported diagnosis.","The specific question the additional material is expected to answer.","Whether the request arises from a clinical discrepancy, a multidisciplinary meeting or a second opinion."],"handling":["Retrieve the residual wet tissue and confirm the patient identity on the retained container before opening it.","Handle the residual specimen as a fresh cut-up: same bench discipline, same records.","Return the residual tissue to fixative and extend the retention period where further work is foreseeable."],"steps":["Retrieve the original worksheet and block key and read the original macroscopic description before touching the specimen.","Confirm that residual tissue remains and that it has not been exhausted at the first cut-up.","Re-examine the specimen with the original description in hand, looking specifically for the feature now in question.","Sample the required area, continuing the original block number sequence. Never reuse a block number.","Record the new block numbers in the block key of the original worksheet as well as on this form.","Where deeper levels rather than new blocks are needed, specify the block number and the number of levels required.","Note whether the existing slides were reviewed against the specimen, and file this form with the original case."],"pitfalls":["Starting a new block sequence at 1, so two different blocks share a number.","Sampling a different area from the one the pathologist described, because the original worksheet was not read first.","Discarding residual tissue before the case is finalised and the clinicians have seen the report."],"prompts":[{"l":"Original laboratory number","t":"t","h":""},{"l":"Request type","t":"c","o":["Further blocks","Deeper levels","Special stains","Re-examine specimen"]},{"l":"Requested by","t":"t","h":""},{"l":"Date requested","t":"t","h":""},{"l":"Reason / clinical question","t":"t","h":""},{"l":"Residual tissue available?","t":"c","o":["Yes","No – exhausted"]},{"l":"Area(s) to be sampled","t":"t","h":""},{"l":"Number of additional blocks taken","t":"t","h":""},{"l":"New block numbers allocated","t":"t","h":""},{"l":"Performed by / date","t":"t","h":""},{"l":"Original blocks reviewed against specimen?","t":"c","o":["Yes","No"]},{"l":"Pathologist notified","t":"t","h":""}]}]},{"key":"SST","name":"Skin, Soft Tissue & Bone","note":"The highest-volume group in most general laboratories. Orientation and margin inking decide the value of the report.","ink":"#C2410C","forms":[{"id":"VNL-H-005","title":"Skin punch, shave & incisional biopsy","blocks":"Embed in entirety. Punches ≤3 mm whole; ≥4 mm bisected longitudinally, cut surfaces down. Request three levels routinely.","clinical":["Precise anatomical site and side; 'arm' or 'leg' alone is not adequate.","Clinical diagnosis or differential, and the duration of the lesion.","Whether an inflammatory dermatosis, a bullous disorder or a neoplasm is suspected.","Whether direct immunofluorescence has been requested and a Michel's medium sample sent."],"handling":["Formalin for routine histology. A separate biopsy in Michel's medium or saline is required for immunofluorescence and must not be placed in formalin.","Small punches dry out quickly: keep the container closed and process promptly.","Handle with a fine spatula, never with toothed forceps, which crush the epidermis."],"steps":["Record the biopsy type, the site as stated and the number of fragments received.","Measure the diameter and the depth of the specimen in millimetres.","Identify the epidermal surface. Note the surface appearance, any scale, crust, ulceration or pigment.","Punches of 3 mm or less: embed whole, on edge, without cutting.","Punches of 4 mm or more: bisect longitudinally through the centre of the lesion and embed both halves cut-surface down.","Shave biopsies: embed whole; if longer than 5 mm, section transversely at 2–3 mm and keep the pieces in order.","Apply a marker dye so the embedder can see the fragment and orientate it correctly.","Request three levels routinely; inflammatory dermatoses often need more."],"pitfalls":["Embedding a punch flat, so the section never shows full-thickness epidermis to subcutis.","Bisecting a small punch and losing one half in processing.","Sending the immunofluorescence biopsy into formalin, which makes the test impossible."],"prompts":[{"l":"Biopsy type","t":"c","o":["Punch","Shave","Curette","Incisional"]},{"l":"Anatomical site (as stated)","t":"t","h":""},{"l":"Clinical diagnosis / differential","t":"t","h":""},{"l":"Number of fragments","t":"t","h":""},{"l":"Dimensions (mm)","t":"t","h":"____ × ____ × ____ (depth)"},{"l":"Epidermal surface identifiable?","t":"c","o":["Yes","No"]},{"l":"Surface appearance (colour, scale, ulceration)","t":"t","h":""},{"l":"Pigmentation present?","t":"c","o":["No","Yes"]},{"l":"Punch ≥ 4 mm: bisected?","t":"c","o":["Yes","No – embedded whole","N/A"]},{"l":"Orientation of embedding","t":"c","o":["On edge","Face down","As bisected"]},{"l":"Marker dye used","t":"c","o":["Nil","Eosin","Other: ______"]},{"l":"Direct immunofluorescence required?","t":"c","o":["No","Yes – Michel's medium sent"]}]},{"id":"VNL-H-006","title":"Skin ellipse / excision – benign & non-melanocytic malignancy","blocks":"Ink margins before cutting. Transversely slice at 2–3 mm through the lesion; submit both tips longitudinally. Small ellipses (≤15 mm) in entirety.","clinical":["Site, side and the clinical diagnosis.","Whether the lesion has been biopsied or treated previously at that site.","The orientation key if the surgeon has placed a suture, in the surgeon's own words."],"handling":["Fix for at least 6 hours before slicing; unfixed skin distorts and the ink runs.","Do not remove an orientation suture until the corresponding margin has been inked and recorded.","Dry the surface before inking and use a mordant so the ink stays on the surface."],"steps":["Record the ellipse in three dimensions: length, width and depth.","Record the orientation marker exactly as supplied and translate it into your inking key before cutting.","Ink the margins. Use different colours for the two lateral margins so left and right can be told apart on the slide, and a separate colour for the deep margin.","Measure the lesion in two dimensions and record its distance to each peripheral margin and to the deep margin.","Amputate both tips and section them longitudinally, parallel to the long axis, so the tip margin is represented.","Slice the remainder transversely at 2–3 mm, perpendicular to the long axis and through the centre of the lesion.","Keep the slices in sequence from one tip to the other and embed them in order.","Ellipses of 15 mm or less: embed in entirety. Larger ellipses: submit the lesion in full, both tips and the closest margin."],"pitfalls":["Inking after the first cut, which contaminates the cut surface and destroys margin interpretation.","Using one ink colour for the whole periphery, so an involved margin cannot be localised for re-excision.","Failing to submit the tips, where recurrence at the ends of an ellipse is commonly missed."],"prompts":[{"l":"Anatomical site and laterality","t":"t","h":""},{"l":"Clinical diagnosis","t":"c","o":["BCC","SCC","Naevus","Cyst","Other: ______"]},{"l":"Orientation suture / marker present?","t":"c","o":["No","Yes – describe: ______"]},{"l":"Ellipse dimensions (mm)","t":"t","h":"____ (length) × ____ (width) × ____ (depth)"},{"l":"Lesion present?","t":"c","o":["Yes","No visible lesion – embed all"]},{"l":"Lesion dimensions (mm)","t":"t","h":"____ × ____"},{"l":"Lesion appearance","t":"c","o":["Nodular","Ulcerated","Scaly","Cystic","Scar"]},{"l":"Distance to nearest peripheral margin (mm)","t":"t","h":""},{"l":"Distance to deep margin (mm)","t":"t","h":""},{"l":"Inking code","t":"t","h":"Tips ____  Lateral A ____  Lateral B ____  Deep ____"},{"l":"Blocking method","t":"c","o":["Transverse (bread-loaf)","Cruciate/tip","Entire, serial"]},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No – residual retained"]}]},{"id":"VNL-H-007","title":"Melanoma excision & wide local excision","blocks":"Ink all margins. Slice at 3–4 mm perpendicular to the long axis through the deepest/thickest point. Submit the lesion in full, both tips, and the closest margin. Photograph before slicing where possible.","clinical":["Site and side, and whether this is a primary excision or a wide local excision after a prior diagnosis.","Breslow thickness and margin status of any previous biopsy, with its laboratory number.","The clinical margin the surgeon intended to take.","Whether a sentinel node procedure was performed at the same operation."],"handling":["Fix fully before slicing. Melanoma specimens are commonly thick and the deep aspect fixes slowly.","Photograph the specimen before slicing wherever a camera is available; the intact lesion cannot be reconstructed afterwards.","Keep the specimen flat on a cork board during fixation to prevent curling."],"steps":["Record the specimen in three dimensions and record the orientation marker as supplied.","Describe the lesion: dimensions, colour variation, border, nodularity, ulceration and any satellite lesions.","Measure the distance from the lesion to each peripheral margin and to the deep margin.","Ink all margins in a coded set of colours and record the code on the worksheet.","Identify the thickest or most nodular part of the lesion by palpation and inspection; this determines where the critical slice will fall.","Slice at 3–4 mm perpendicular to the long axis, taking the first cut through the thickest point so Breslow thickness is measured on a true vertical section.","Submit the entire lesion, both tips longitudinally, and the closest margin.","Sample any satellite nodule and the intervening skin separately, recording its distance from the main lesion."],"pitfalls":["Cutting tangentially through the lesion, which falsely increases the measured thickness.","Missing the thickest point because the first slice was taken at the geometric centre rather than the palpable nodule.","Discarding scar tissue in a re-excision, where residual melanoma most often lies."],"prompts":[{"l":"Anatomical site and laterality","t":"t","h":""},{"l":"Prior procedure at this site?","t":"c","o":["No","Yes – previous lab no.: ______"]},{"l":"Orientation marker","t":"t","h":""},{"l":"Specimen dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Lesion / scar present?","t":"c","o":["Pigmented lesion","Scar only","Both","Nil visible"]},{"l":"Lesion dimensions (mm)","t":"t","h":"____ × ____"},{"l":"Lesion appearance","t":"c","o":["Macular","Nodular","Ulcerated","Variegated","Satellite(s)"]},{"l":"Maximum apparent depth of invasion (mm)","t":"t","h":""},{"l":"Distance to nearest peripheral margin (mm)","t":"t","h":""},{"l":"Distance to deep margin (mm)","t":"t","h":""},{"l":"Inking code (state colour per margin)","t":"t","h":""},{"l":"Satellite lesions / separate nodules present?","t":"c","o":["No","Yes – number: ____"]}]},{"id":"VNL-H-008","title":"Skin re-excision / residual tumour specimen","blocks":"Embed the entire scar/tumour bed with all margins. Small re-excisions in entirety, sequentially numbered so the closest margin can be identified.","clinical":["The original laboratory number, the diagnosis and which margin was involved.","Site and side, confirmed against the original specimen.","The interval since the first procedure and any intervening treatment."],"handling":["Retrieve the original report before cut-up; the margin now at risk determines how this specimen is orientated.","Fix fully. Scar tissue is dense and fixes more slowly than surrounding skin.","Preserve the orientation marker until the corresponding margin has been inked."],"steps":["Record the specimen dimensions and the orientation key.","Identify the scar or previous biopsy site and measure it. If no scar is visible, say so and embed the whole specimen.","Ink all margins in a coded set of colours.","Record any residual visible lesion, its dimensions and its distance from each margin.","Slice at 2–3 mm perpendicular to the long axis, through the scar.","Embed the entire scar and biopsy bed. Residual disease is usually microscopic and lies within the scar.","Submit both tips longitudinally and the closest margin.","Small re-excisions: embed in entirety, numbering blocks sequentially so an involved margin can be localised."],"pitfalls":["Sampling the scar representatively rather than embedding it entirely.","Failing to relate the new specimen to the previously involved margin.","Reporting the specimen without checking the original diagnosis, so a residual tumour type is not looked for."],"prompts":[{"l":"Original laboratory number","t":"t","h":""},{"l":"Original diagnosis","t":"t","h":""},{"l":"Anatomical site and laterality","t":"t","h":""},{"l":"Orientation marker","t":"t","h":""},{"l":"Specimen dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Scar / previous biopsy site identifiable?","t":"c","o":["Yes","No"]},{"l":"Scar dimensions (mm)","t":"t","h":"____ × ____"},{"l":"Residual lesion visible?","t":"c","o":["No","Yes – size ____ mm"]},{"l":"Distance to nearest peripheral margin (mm)","t":"t","h":""},{"l":"Distance to deep margin (mm)","t":"t","h":""},{"l":"Inking code","t":"t","h":""},{"l":"Entire scar embedded?","t":"c","o":["Yes","No"]}]},{"id":"VNL-H-009","title":"Nail unit, mucosal skin & other specialised skin specimen","blocks":"Embed in entirety, maintaining orientation. Nail plate requires softening before embedding; request PAS with the initial H&E when onychomycosis is queried.","clinical":["The exact site, including the digit and side for nail specimens.","The clinical diagnosis and duration; longitudinal melanonychia requires exclusion of melanoma.","Whether onychomycosis is queried and fungal stains are needed."],"handling":["Formalin as usual, but nail plate requires softening before embedding; record the agent and duration.","Keep nail plate, matrix and bed identified separately if the surgeon has submitted them separately.","Mucosal specimens dry rapidly: keep covered and process promptly."],"steps":["Record the specimen type, site and, for nail, the digit and side.","Measure the specimen and, where a pigment band is present, record its width and its position across the nail.","Note the orientation: for nail matrix, the proximal and distal aspects must be maintained.","Soften nail plate before embedding using the laboratory's agent; do not attempt to section unsoftened plate.","Embed the whole specimen, orientated so that sections run perpendicular to the nail surface or the mucosal surface.","Apply a marker dye to small fragments.","Request PAS with the initial H&E when fungal infection is queried, and levels where pigment is being assessed."],"pitfalls":["Sectioning unsoftened nail plate, which shatters the block and the knife edge.","Losing the proximal–distal orientation of nail matrix, so the origin of a pigment band cannot be located.","Treating longitudinal melanonychia as a benign specimen and under-sampling it."],"prompts":[{"l":"Specimen type","t":"c","o":["Nail plate","Nail matrix/bed","Lip/oral mucosa","Genital skin","Other: ______"]},{"l":"Anatomical site and laterality (digit if applicable)","t":"t","h":""},{"l":"Clinical diagnosis","t":"t","h":""},{"l":"Number of fragments","t":"t","h":""},{"l":"Dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Colour / pigment band width (mm)","t":"t","h":""},{"l":"Nail plate: softening required?","t":"c","o":["N/A","Yes – agent: ______"]},{"l":"Orientation of embedding","t":"t","h":""},{"l":"Fungal stain required?","t":"c","o":["No","Yes – PAS"]},{"l":"Marker dye used","t":"t","h":""},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No"]},{"l":"Photographed?","t":"c","o":["No","Yes – ref: ______"]}]},{"id":"VNL-H-010","title":"Soft tissue core & incisional biopsy","blocks":"Embed all cores in entirety, no more than 3 cores per cassette, laid parallel. Divert fresh tissue for cytogenetics before fixation when sarcoma is suspected.","clinical":["Site, depth relative to the deep fascia, and side.","Size and radiological characteristics of the lesion on imaging.","Whether sarcoma is suspected and whether cytogenetic or molecular testing is anticipated.","Patient age, which materially changes the differential diagnosis."],"handling":["Where sarcoma is suspected, receive the specimen fresh and notify the pathologist before fixation.","Divert fresh tissue for cytogenetics and tissue banking before any tissue enters formalin.","If bone or calcified tissue is present, separate it for decalcification and embed the soft tissue directly."],"steps":["Record the number of cores or fragments and the length of each core.","Describe the colour and consistency: firm white, fleshy, myxoid, fatty, necrotic or haemorrhagic. Consistency is diagnostically useful in soft tissue.","Make touch imprints from a fresh core if a small round cell tumour is possible.","Divert a fresh fragment for cytogenetics where a translocation-associated sarcoma is in the differential.","Lay the cores straight and parallel, no more than three per cassette, so all appear at the same level.","Embed all cores and fragments in entirety.","Request levels and reserve unstained sections for immunohistochemistry at the time of cut-up."],"pitfalls":["Fixing the entire specimen before the pathologist has considered cytogenetics.","Overfilling cassettes so the deepest core is never reached on the section.","Discarding a small fragment as 'fat' when it is the diagnostic lipomatous tumour."],"prompts":[{"l":"Anatomical site, depth and laterality","t":"t","h":""},{"l":"Clinical / imaging diagnosis","t":"t","h":""},{"l":"Biopsy type","t":"c","o":["Core","Incisional","Excisional"]},{"l":"Number of cores / fragments","t":"t","h":""},{"l":"Core length range (mm)","t":"t","h":""},{"l":"Aggregate dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Colour / consistency","t":"c","o":["Firm white","Fleshy","Myxoid","Fatty","Necrotic","Haemorrhagic"]},{"l":"Fresh tissue triaged?","t":"c","o":["No","Cytogenetics","Microbiology","Frozen/tissue bank"]},{"l":"Imprint preparations made?","t":"c","o":["No","Yes – no. ____"]},{"l":"Calcified / bony component?","t":"c","o":["No","Yes – decalcification required"]},{"l":"Number of cassettes used","t":"t","h":""},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No"]}]},{"id":"VNL-H-011","title":"Soft tissue tumour resection","blocks":"Ink all margins, then serially slice. Minimum one block per centimetre of maximum tumour dimension, plus all closest margins, tumour–normal interface, capsule, and any attached structure.","clinical":["Site, depth and compartment, and the side.","The result and laboratory number of any previous biopsy.","Neoadjuvant chemotherapy or radiotherapy, which requires an estimate of treatment response.","Which margin the surgeon regards as the closest, and any structure deliberately left behind."],"handling":["Photograph the intact specimen before inking and slicing.","Ink all margins before any incision; soft tissue margins are irregular and cannot be reconstructed.","Fix after the first slicing so fixative reaches the centre of a large tumour."],"steps":["Record the specimen type, its three dimensions and every attached structure: skin, muscle, fascia, bone, vessel and nerve.","Ink the margins in a coded set of colours, naming each one, and record the code.","Slice the specimen at 10 mm through its longest axis, keeping the slices in order.","Measure the tumour in three dimensions and describe its circumscription, colour, consistency and any myxoid or necrotic change.","Estimate the percentage of necrosis, which is required for grading and for assessing treatment response.","Record the relationship of the tumour to the deep fascia and to each named margin, in millimetres.","Submit a minimum of one block per centimetre of maximum tumour dimension, targeted at areas of differing appearance.","Submit all closest margins, the tumour-to-normal interface, the capsule or pseudocapsule, and each attached structure.","Sample any separate nodule and record its distance from the main mass."],"pitfalls":["Sampling only the centre of the tumour, which is often necrotic and non-diagnostic.","Under-sampling a well-differentiated area, where dedifferentiation determines the grade.","Failing to name the involved margin, so the surgeon cannot plan a re-excision."],"prompts":[{"l":"Anatomical site, compartment and laterality","t":"t","h":""},{"l":"Prior biopsy / neoadjuvant therapy?","t":"c","o":["No","Biopsy","Chemotherapy","Radiotherapy"]},{"l":"Specimen type","t":"c","o":["Marginal excision","Wide excision","Compartmental","Amputation"]},{"l":"Specimen dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Structures attached (skin, muscle, fascia, bone, vessel, nerve)","t":"t","h":""},{"l":"Tumour dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Tumour appearance","t":"c","o":["Circumscribed","Infiltrative","Encapsulated","Myxoid","Necrotic"]},{"l":"Estimated % necrosis","t":"t","h":""},{"l":"Relation to fascia","t":"c","o":["Superficial","Deep","Both"]},{"l":"Distance to nearest margin (mm) and which margin","t":"t","h":""},{"l":"Inking code","t":"t","h":""},{"l":"Photographed?","t":"c","o":["No","Yes – ref: ______"]}]},{"id":"VNL-H-012","title":"Bone biopsy, curettings & marrow-free bone fragments","blocks":"Separate and embed soft/non-calcified tissue directly – do not decalcify it. Decalcify bony fragments only; record start and end times, and check endpoint before processing.","clinical":["Site and side, and the radiological diagnosis and appearance of the lesion.","Whether infection is suspected and microbiology has been taken.","Whether the lesion is lytic, sclerotic or mixed on imaging.","Patient age, which is central to the differential diagnosis of bone lesions."],"handling":["Send fresh tissue for microbiology before fixation whenever osteomyelitis is possible.","Separate soft, non-calcified tissue and embed it directly. Never decalcify tissue that does not need it.","Fix completely before decalcification. Decalcifying unfixed tissue destroys morphology.","Record the decalcifying agent with the start and end times, and test the endpoint rather than working to a fixed period."],"steps":["Record the specimen type, the number of fragments and the aggregate dimensions.","Describe the colour and consistency, and note whether the fragments are gritty, firm or soft.","Separate the fragments into calcified and non-calcified groups on the bench.","Embed the non-calcified tissue directly and identify those cassettes as undecalcified.","Decalcify the bony fragments in the gentlest agent available for the shortest effective time.","Check the decalcification endpoint by needle or chemical test before processing.","Embed all decalcified fragments; small biopsies are embedded in entirety.","Request levels, since a diagnostic focus in a bone core is often small."],"pitfalls":["Decalcifying the whole specimen including the soft tissue, which destroys antigenicity unnecessarily.","Over-decalcifying, which removes nuclear detail and makes immunohistochemistry unreliable.","Failing to take microbiology, so a treatable infection is diagnosed too late."],"prompts":[{"l":"Anatomical site and laterality","t":"t","h":""},{"l":"Clinical / radiological diagnosis","t":"t","h":""},{"l":"Specimen type","t":"c","o":["Needle core","Open biopsy","Curettings","Sequestrum"]},{"l":"Number of fragments","t":"t","h":""},{"l":"Aggregate dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Colour / consistency","t":"t","h":""},{"l":"Soft tissue component present?","t":"c","o":["No","Yes – separate for direct embedding"]},{"l":"Microbiology sample taken?","t":"c","o":["No","Yes – sent to: ______"]},{"l":"Decalcification required?","t":"c","o":["No","Yes"]},{"l":"Decalcifying agent & start date/time","t":"t","h":""},{"l":"Decalcification end date/time","t":"t","h":""},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No"]}]},{"id":"VNL-H-013","title":"Bone resection & amputation","blocks":"Photograph and, where available, slab-radiograph before sampling. Take proximal bone marrow margin, all soft tissue margins, tumour with adjacent normal, joint/growth plate, and any skin lesion. Sample vessels and nerve in ischaemic amputations.","clinical":["The level of the resection or amputation and the indication.","The diagnosis and laboratory number of any previous biopsy.","Neoadjuvant therapy, which requires an estimate of percentage necrosis.","For ischaemic amputation, the vascular history and level of arterial disease."],"handling":["Photograph the specimen and, if a facility exists, radiograph the slab before sampling.","Large specimens require sectioning with a band saw; plan the plane of section before cutting.","Fix the slabs after cutting, then decalcify only the blocks that need it."],"steps":["Record the specimen, its length and every component: skin, soft tissue, bone, joint and nail.","Describe the skin: ulceration, gangrene, sinus tracks and their position relative to the resection margin.","Take the proximal soft tissue and bone marrow margins first, before the specimen is disturbed.","Section the bone longitudinally through the lesion in a single plane, producing a central slab.","Measure the lesion in three dimensions and record its position within the bone: epiphysis, metaphysis or diaphysis.","Record whether the cortex is breached and whether tumour extends into soft tissue, the joint or the growth plate.","Estimate the percentage of necrosis where neoadjuvant therapy has been given.","Sample the tumour with adjacent normal bone and marrow, the cortical breach, the joint, all soft tissue margins and the bone marrow margin.","In ischaemic amputation, sample the major artery and nerve, the ulcer base and the margin of viable tissue."],"pitfalls":["Cutting the bone in a plane that misses the tumour's relationship to the growth plate or joint.","Decalcifying the marrow margin so heavily that residual tumour cannot be identified.","Failing to sample the ulcer base in a diabetic amputation, where osteomyelitis is diagnosed."],"prompts":[{"l":"Procedure","t":"c","o":["Segmental resection","Amputation – level: ______"]},{"l":"Anatomical site and laterality","t":"t","h":""},{"l":"Indication","t":"c","o":["Tumour","Infection","Ischaemia/diabetes","Trauma"]},{"l":"Specimen length (mm) and components","t":"t","h":""},{"l":"Skin / soft tissue findings (ulcer, gangrene, sinus)","t":"t","h":""},{"l":"Lesion present?","t":"c","o":["No","Yes"]},{"l":"Lesion dimensions (mm) and location within bone","t":"t","h":""},{"l":"Cortical breach / soft tissue extension?","t":"c","o":["No","Yes"]},{"l":"Joint / growth plate involvement?","t":"c","o":["No","Yes"]},{"l":"Estimated % necrosis (post-therapy)","t":"t","h":""},{"l":"Distance to proximal bone margin (mm)","t":"t","h":""},{"l":"Distance to soft tissue margin (mm)","t":"t","h":""}]},{"id":"VNL-H-014","title":"Joint, synovium & femoral head","blocks":"Routine femoral head for fracture/OA: one representative slab including articular surface and marrow. Sample any unexpected lesion fully. Synovium: 2–3 representative blocks.","clinical":["Site, side and the indication for surgery.","Whether infection or an inflammatory arthritis is suspected.","Any history of malignancy, which changes the sampling of an unexpected lesion."],"handling":["Send fresh material for microbiology before fixation if infection is queried.","Fix before decalcification; record the agent and the start and end times.","Synovium and meniscus do not require decalcification and should be separated out."],"steps":["Record the specimen type, side and dimensions.","Describe the articular cartilage: thinning, fibrillation, full-thickness loss and eburnation, and where these changes lie.","Note subchondral cysts, osteophytes and any fracture line, with its position and orientation.","Look specifically for a wedge of pale subchondral bone indicating avascular necrosis.","Describe the synovium: thin, villous, hyperplastic, pigmented or fibrinous.","Section the femoral head coronally through the weight-bearing surface and the fovea.","Fracture or osteoarthritis: submit one representative slab including articular surface, subchondral bone and marrow.","Sample any unexpected lesion in full and consult the pathologist before completing the cut-up."],"pitfalls":["Treating a femoral head as a routine discard and missing an unsuspected marrow tumour.","Sectioning away from the weight-bearing surface, so the relevant cartilage is not represented.","Failing to sample synovium when an inflammatory arthritis is the clinical question."],"prompts":[{"l":"Specimen type","t":"c","o":["Femoral head","Synovium","Meniscus","Loose bodies","Bursa"]},{"l":"Anatomical site and laterality","t":"t","h":""},{"l":"Indication","t":"c","o":["Osteoarthritis","Fracture","Inflammatory arthritis","?Infection","?Tumour"]},{"l":"Dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Articular cartilage – loss / eburnation","t":"t","h":""},{"l":"Subchondral cysts / osteophytes present?","t":"c","o":["No","Yes"]},{"l":"Fracture line present?","t":"c","o":["No","Yes – describe: ______"]},{"l":"Avascular necrosis suspected?","t":"c","o":["No","Yes"]},{"l":"Synovium appearance","t":"c","o":["Thin/normal","Villous/hyperplastic","Pigmented","Fibrinous"]},{"l":"Unexpected lesion identified?","t":"c","o":["No","Yes – sample fully"]},{"l":"Decalcification required?","t":"c","o":["No","Yes – agent/time: ______"]},{"l":"Microbiology sample taken?","t":"c","o":["No","Yes"]}]}]},{"key":"BR","name":"Breast","note":"Margin status and tumour size drive management. Ink and orientate before any incision is made.","ink":"#BE185D","forms":[{"id":"VNL-H-015","title":"Breast core biopsy","blocks":"Embed all cores in entirety, up to 3 per cassette, laid straight and parallel. Where a radiograph identifies calcification, cassette those cores separately and flag for the pathologist.","clinical":["Side and the clock position or quadrant of the lesion.","The imaging abnormality: mass, calcification, distortion or asymmetry, and its size.","The imaging category and whether the biopsy is diagnostic or from a screening recall.","Whether a marker clip has been deployed."],"handling":["Formalin immediately; record the time into fixative, since fixation duration governs receptor testing.","Fix for a minimum of 6 hours and no longer than 72 hours before processing.","Where calcification was targeted, a specimen radiograph should accompany the cores. Keep radiograph-positive cores identified separately."],"steps":["Record the number of cores and the length range in millimetres.","Describe the cores: white and firm, fatty, haemorrhagic or gritty. Gritty cores suggest calcification.","Review the specimen radiograph if provided and identify which cores contain calcification.","Place radiograph-positive cores in a separately identified cassette and flag them on the worksheet for the pathologist.","Lay cores straight and parallel, no more than three per cassette, so all appear on the same level.","Embed all cores in entirety; a diagnosis cannot be excluded on unembedded tissue.","Request three levels routinely and reserve intervening unstained sections for immunohistochemistry."],"pitfalls":["Failing to identify the radiograph-positive cores, so the pathologist cannot confirm the targeted lesion was sampled.","Coiling cores in the cassette, so only part of each is represented on the section.","Prolonged or delayed fixation, which invalidates oestrogen, progesterone and HER2 testing."],"prompts":[{"l":"Laterality and clock position / quadrant","t":"t","h":""},{"l":"Imaging lesion type","t":"c","o":["Mass","Calcification","Distortion","Other: ______"]},{"l":"Number of cores","t":"t","h":""},{"l":"Core length range (mm)","t":"t","h":""},{"l":"Core appearance","t":"c","o":["White/firm","Fatty","Haemorrhagic","Gritty"]},{"l":"Calcification visible macroscopically?","t":"c","o":["No","Yes"]},{"l":"Specimen radiograph provided?","t":"c","o":["No","Yes – calcification confirmed:","Y","N"]},{"l":"Cores containing calcification identified separately?","t":"c","o":["N/A","Yes – cassette: ____"]},{"l":"Marker clip in specimen?","t":"c","o":["No","Yes"]},{"l":"Cassettes used (max 3 cores each)","t":"t","h":""},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No"]},{"l":"Levels requested","t":"c","o":["3 levels","Other: ______"]}]},{"id":"VNL-H-016","title":"Breast diagnostic / lump excision (no localisation)","blocks":"Ink margins, serially slice at 5 mm perpendicular to the long axis. Sample the lesion (minimum one block per cm), lesion–normal interface, closest margin and representative background breast.","clinical":["Side and the clock position or quadrant.","Clinical and imaging diagnosis and the size of the lesion on imaging.","Whether the excision is diagnostic or therapeutic, and whether margins are expected to be assessed.","Any prior core biopsy, with its laboratory number and diagnosis."],"handling":["Weigh and measure fresh before fixation.","Ink before slicing, and slice before fixation so the fixative reaches the centre.","Record the time into fixative."],"steps":["Record the specimen in three dimensions and weigh it.","Record any orientation suture exactly as supplied and translate it into your inking key.","Ink the margins, using distinct colours so an involved margin can be named.","Slice serially at 5 mm perpendicular to the long axis, keeping the slices in order.","Identify the lesion, measure it in three dimensions and describe it: circumscribed, stellate, cystic, fibrous or fleshy.","Record the distance from the lesion to each inked margin.","Submit a minimum of one block per centimetre of lesion, plus the lesion-to-normal interface.","Submit the closest margin and representative background breast.","Where no discrete lesion is found, embed the specimen extensively and record that no lesion was identified."],"pitfalls":["Recording a single lesion dimension, so tumour size cannot be staged.","Losing slice order, so an involved margin cannot be localised.","Reporting 'no lesion seen' without extensive sampling of a specimen taken for an imaging abnormality."],"prompts":[{"l":"Laterality and clock position / quadrant","t":"t","h":""},{"l":"Clinical diagnosis","t":"t","h":""},{"l":"Orientation sutures present?","t":"c","o":["No","Yes – key: ______"]},{"l":"Specimen dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Specimen weight (g)","t":"t","h":""},{"l":"Inking code (state colour per margin)","t":"t","h":""},{"l":"Lesion present?","t":"c","o":["Yes","No discrete lesion"]},{"l":"Lesion dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Lesion appearance","t":"c","o":["Circumscribed","Stellate","Cystic","Fibrous","Fleshy"]},{"l":"Distance to nearest margin (mm) / which margin","t":"t","h":""},{"l":"Number of slices taken","t":"t","h":""},{"l":"Photographed?","t":"c","o":["No","Yes – ref: ______"]}]},{"id":"VNL-H-017","title":"Wide local excision / localisation specimen with margins","blocks":"Ink all six margins in distinct colours, serially slice at 5 mm and keep slices in order. Sample tumour with the closest margins, one block per cm of tumour, the biopsy site/clip, and each quadrant of background breast.","clinical":["Side, clock position and the localisation method used.","The imaging target: mass, calcification or clip, and its size.","The surgeon's orientation key, in the surgeon's own words.","Whether separate cavity shave margins were taken and how they are labelled."],"handling":["Do not slice before the specimen radiograph has been reviewed and the target confirmed within the specimen.","Ink all six margins in six distinct colours before any incision.","Slice, then fix; record the time into fixative for receptor testing."],"steps":["Weigh and measure the specimen in three dimensions.","Review the specimen radiograph and confirm the lesion, clip or wire is present. Record this on the worksheet.","Translate the orientation key into the six named margins: superior, inferior, medial, lateral, anterior and posterior.","Ink each margin in a different colour and record the code.","Slice serially at 5 mm in a single consistent direction, medial to lateral or superior to inferior, and keep the slices in strict order.","Identify the tumour, measure it in three dimensions and record whether it is solitary or multifocal.","Measure the distance from the tumour to each of the six margins.","Submit the tumour with the closest margins in continuity, one block per centimetre of tumour.","Submit the biopsy site or clip, each additional focus, and one block from each quadrant of background breast.","Submit any separate cavity shave margins as labelled, inking the true margin surface."],"pitfalls":["Slicing before confirming on the radiograph that the target is in the specimen.","Using fewer than six ink colours, so an involved margin cannot be named for re-excision.","Taking the tumour and the margin as separate blocks, so the distance cannot be measured microscopically."],"prompts":[{"l":"Laterality and clock position / quadrant","t":"t","h":""},{"l":"Localisation method","t":"c","o":["Hookwire","Marker clip","Radioactive seed","Nil"]},{"l":"Orientation sutures – key as supplied","t":"t","h":""},{"l":"Specimen dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Specimen weight (g)","t":"t","h":""},{"l":"Specimen radiograph reviewed?","t":"c","o":["No","Yes – lesion/clip present:","Y","N"]},{"l":"Inking code","t":"t","h":"Sup ____  Inf ____  Med ____  Lat ____  Ant ____  Post ____"},{"l":"Tumour dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Tumour appearance and multifocality","t":"c","o":["Solitary","Multifocal – no. ____"]},{"l":"Distance to each margin (mm)","t":"t","h":"Sup ____ Inf ____ Med ____ Lat ____ Ant ____ Post ____"},{"l":"Separate cavity shave margins received?","t":"c","o":["No","Yes – number: ____"]},{"l":"Slices taken, numbered sequentially from","t":"c","o":["Medial → lateral","Superior → inferior"]}]},{"id":"VNL-H-018","title":"Mastectomy (simple / total, no axillary contents)","blocks":"Ink the deep margin, slice sagittally at 10 mm from posterior. Sample tumour (one block per cm), deep margin, nipple (including duct profile), skin over tumour, previous biopsy site and one block from each of the four quadrants.","clinical":["Side and the indication: therapeutic, prophylactic or completion.","The diagnosis, size and site of any tumour on prior biopsy, with the laboratory number.","Whether the nipple is preserved and whether skin is involved clinically.","Any neoadjuvant therapy."],"handling":["Weigh and measure before fixation. Ink the deep margin before slicing.","Slice the specimen from the posterior aspect while fresh so fixative penetrates, then fix overnight.","Record time into fixative."],"steps":["Orientate the specimen using the axillary tail and the nipple; record the side.","Weigh the specimen and record its three dimensions and the dimensions of the skin ellipse.","Describe the skin and nipple: retraction, ulceration, eczematous change or peau d'orange.","Ink the deep (posterior) margin.","Slice sagittally at 10 mm from the posterior surface towards the skin, keeping the slices in order.","Identify the tumour, measure it in three dimensions and record its quadrant and depth from the skin.","Measure the distance from the tumour to the deep margin.","Record any additional lesions with their sizes and distance from the main tumour.","Submit the tumour at one block per centimetre, the deep margin, the skin overlying the tumour, the previous biopsy site, the nipple with a duct profile, and one block from each of the four quadrants."],"pitfalls":["Failing to sample the nipple in a plane that shows the lactiferous ducts, so Paget disease is missed.","Omitting background quadrant blocks, where a second focus or in-situ disease is found.","Slicing towards the posterior surface, which drags the tumour across the deep margin."],"prompts":[{"l":"Laterality","t":"c","o":["Right","Left"]},{"l":"Procedure","t":"c","o":["Simple","Skin-sparing","Nipple-sparing","Prophylactic"]},{"l":"Specimen weight (g)","t":"t","h":""},{"l":"Specimen dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Skin ellipse dimensions (mm)","t":"t","h":"____ × ____"},{"l":"Nipple / areola present?","t":"c","o":["Yes","No"]},{"l":"Skin or nipple changes","t":"c","o":["Nil","Retraction","Ulceration","Peau d'orange","Eczema"]},{"l":"Posterior (deep) margin inked?","t":"c","o":["Yes","No"]},{"l":"Tumour present?","t":"c","o":["Yes","No – previous excision site only"]},{"l":"Tumour size (mm), quadrant and depth from skin","t":"t","h":""},{"l":"Distance to deep margin (mm)","t":"t","h":""},{"l":"Additional lesions / multifocality","t":"c","o":["No","Yes – number and sizes: ______"]}]},{"id":"VNL-H-019","title":"Mastectomy with axillary dissection","blocks":"As for VNL-H-018, plus all axillary nodes. Submit every node found: nodes ≤5 mm whole, larger nodes bisected or serially sliced at 2 mm, each node identified separately. Keep levels separate where marked.","clinical":["Side, the indication and whether the axillary dissection is primary or a completion after a positive sentinel node.","The diagnosis on prior biopsy and receptor status if known.","Neoadjuvant therapy, which requires assessment of response in both breast and nodes.","Whether the surgeon has separated axillary levels."],"handling":["Separate the axillary tail from the breast before slicing and process it as a distinct part.","Keep surgeon-marked levels in separate containers and never combine them.","Fix the breast overnight after slicing; nodes may be dissected fresh or after fixation."],"steps":["Complete the breast dissection as for a simple mastectomy, recording tumour size, quadrant, depth and deep margin distance.","Where neoadjuvant therapy has been given, record the tumour bed dimensions even if no viable tumour is visible.","Separate the axillary contents and dissect all lymph nodes from the fat.","Re-examine the residual fat after fixation; yield improves substantially on a second pass.","Record the total number of nodes and, where levels are marked, the number in each level.","Record any grossly involved or matted nodes and any extranodal extension.","Submit every node found. Nodes of 5 mm or less are embedded whole; larger nodes are sliced at 2 mm and all slices embedded.","Identify each node or group of nodes in its own cassette, keeping levels separate.","Complete the breast blocks as for a simple mastectomy."],"pitfalls":["Reporting a low node count because the fat was dissected only once.","Pooling nodes from different levels, so the level of involvement cannot be reported.","Bisecting a large node and embedding only one half, so a small deposit is missed."],"prompts":[{"l":"Laterality","t":"c","o":["Right","Left"]},{"l":"Neoadjuvant therapy given?","t":"c","o":["No","Yes – assess response"]},{"l":"Specimen weight (g) and dimensions (mm)","t":"t","h":""},{"l":"Axillary tail identified and separated?","t":"c","o":["Yes","No"]},{"l":"Tumour size (mm), quadrant, depth","t":"t","h":""},{"l":"Tumour appearance / treatment effect","t":"t","h":""},{"l":"Skin, nipple and pectoral fascia involvement","t":"t","h":""},{"l":"Distance to deep margin (mm)","t":"t","h":""},{"l":"Multifocal / multicentric disease?","t":"c","o":["No","Yes – no. and sizes: ______"]},{"l":"Axillary levels identified by surgeon?","t":"c","o":["No","Yes – I / II / III marked"]},{"l":"Total lymph nodes retrieved","t":"t","h":""},{"l":"Grossly involved nodes / matting","t":"c","o":["None seen","Number: ____","Matted"]}]},{"id":"VNL-H-020","title":"Sentinel lymph node – breast","blocks":"Each sentinel node in its own identified cassette. Serially slice at 2 mm along the long axis and embed every slice. Nodes ≤5 mm embedded whole.","clinical":["Side and the primary tumour details.","How each node was identified: radioactive counts, blue dye or palpation.","The number of nodes the surgeon believes were removed, and how the containers are labelled.","The local protocol for levels and immunohistochemistry."],"handling":["Keep each container separate; the surgeon's labelling is the only record of which node is which.","Nodes may be examined fresh or after fixation according to local protocol; do not mix approaches within a case.","One node per cassette, always."],"steps":["Record the number of containers and the identification of each as labelled.","Dissect each node free of fat and measure it.","Note whether blue dye is visible and whether any node appears macroscopically involved.","Record any perinodal fat involvement or capsular breach.","Nodes of 5 mm or less: embed whole.","Larger nodes: slice at 2 mm perpendicular to the long axis, through the hilum, and embed every slice.","Place each node, with all its slices, in its own identified cassette.","Request the local level and immunohistochemistry protocol at cut-up so the block is cut correctly the first time."],"pitfalls":["Slicing at intervals greater than 2 mm, which allows a micrometastasis to fall between sections.","Combining two nodes in one cassette, so a positive node cannot be counted.","Discarding perinodal fat, which may contain a separate deposit."],"prompts":[{"l":"Laterality","t":"c","o":["Right","Left"]},{"l":"Number of containers / node packets","t":"t","h":""},{"l":"Node identification as labelled (hot, blue, palpable)","t":"t","h":""},{"l":"Total nodes identified","t":"t","h":""},{"l":"Node dimensions (mm) – each","t":"t","h":""},{"l":"Blue dye visible?","t":"c","o":["No","Yes"]},{"l":"Macroscopic involvement suspected?","t":"c","o":["No","Yes – node: ____"]},{"l":"Perinodal fat / capsular breach?","t":"c","o":["No","Yes"]},{"l":"Sliced at 2 mm perpendicular to long axis?","t":"c","o":["Yes","N/A – node ≤5 mm"]},{"l":"All slices embedded?","t":"c","o":["Yes","No"]},{"l":"Cassettes used","t":"t","h":""},{"l":"Levels / IHC protocol requested","t":"t","h":""}]},{"id":"VNL-H-021","title":"Reduction mammoplasty & gynaecomastia","blocks":"Slice the whole specimen at 10 mm and inspect every slice. Routine: 4 representative blocks per side. Any discrete lesion sampled fully and separately. Increase sampling if there is a cancer history or risk-reducing indication.","clinical":["The indication and the side of the specimen in this container.","Age of the patient and, for gynaecomastia, any relevant drug history.","Personal or family history of breast cancer, which increases the sampling required.","Whether the surgery is risk-reducing."],"handling":["Weigh each side separately and keep the sides in separate containers throughout.","Slice while fresh so fixative penetrates the fatty tissue.","Fix adequately; fatty breast tissue fixes slowly."],"steps":["Record the side, the weight and the aggregate dimensions of the tissue in this container.","Note whether skin or nipple is included.","Slice the entire specimen at 10 mm and inspect every slice on both cut surfaces.","Describe the cut surface: fatty, fibrofatty, dense fibrous or nodular.","Record any discrete lesion with its dimensions and appearance, and any cysts with their size range.","Routine reduction: submit four representative blocks per side, taken from fibrous rather than purely fatty areas.","Sample every discrete lesion in full and separately.","Increase sampling substantially where there is a cancer history or the procedure is risk-reducing.","Gynaecomastia: submit representative blocks of the subareolar fibrous tissue."],"pitfalls":["Blocking only fat, so the fibroglandular tissue where lesions arise is never examined.","Losing the side identification when both breasts are received.","Sampling a risk-reducing specimen as though it were a routine reduction."],"prompts":[{"l":"Procedure","t":"c","o":["Reduction – bilateral","Reduction – unilateral","Gynaecomastia","Risk-reducing"]},{"l":"Laterality of this container","t":"c","o":["Right","Left"]},{"l":"Weight (g)","t":"t","h":""},{"l":"Dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Number of pieces","t":"t","h":""},{"l":"Skin / nipple included?","t":"c","o":["No","Yes"]},{"l":"Cut surface appearance","t":"c","o":["Fatty","Fibrofatty","Dense fibrous","Nodular"]},{"l":"Discrete lesion identified?","t":"c","o":["No","Yes – size ____ mm"]},{"l":"Lesion appearance and location","t":"t","h":""},{"l":"Personal / family history of breast cancer?","t":"c","o":["No","Yes – sample more extensively"]},{"l":"Cysts present?","t":"c","o":["No","Yes – size range: ______"]},{"l":"Number of blocks taken","t":"t","h":""}]},{"id":"VNL-H-022","title":"Nipple, duct excision & microdochectomy","blocks":"Embed in entirety in sequential order. Slice perpendicular to the duct axis at 2–3 mm; for nipple specimens include full-thickness epidermis with underlying lactiferous ducts.","clinical":["Side and the nature and colour of any nipple discharge.","Whether the duct was cannulated or probe-marked at operation.","Imaging findings, including ductography if performed.","Whether Paget disease is the clinical question."],"handling":["Do not remove a probe or marker until its position has been recorded.","Fix before slicing; duct specimens are small and distort easily.","Keep the specimen orientated along the duct axis."],"steps":["Record the procedure, the side and the indication.","Measure the specimen in three dimensions and identify the cannulated duct if marked.","Ink the specimen surface where margins are relevant and record the code.","Identify and open the duct along its axis; record any dilatation and the maximum diameter.","Describe the intraluminal contents: inspissated secretion, a papillary lesion or blood.","Measure any papillary lesion and record its distance from the nipple end.","Slice the specimen perpendicular to the duct axis at 2–3 mm, keeping the slices in sequence.","Embed in entirety, in order, so the length of the involved duct can be determined.","Nipple specimens: include full-thickness epidermis with the underlying lactiferous ducts in every block."],"pitfalls":["Cutting along the duct rather than across it, so the papillary lesion is not seen in cross-section.","Embedding out of sequence, so the extent of duct involvement cannot be assessed.","Failing to include epidermis in a nipple block when Paget disease is queried."],"prompts":[{"l":"Laterality","t":"c","o":["Right","Left"]},{"l":"Procedure","t":"c","o":["Microdochectomy","Major duct excision","Nipple biopsy/wedge","Nipple core"]},{"l":"Indication","t":"c","o":["Nipple discharge – colour: ______","?Paget disease","Duct ectasia","Mass"]},{"l":"Orientation marker present?","t":"c","o":["No","Yes"]},{"l":"Specimen dimensions (mm)","t":"t","h":"____ × ____ × ____"},{"l":"Cannulated / probe-marked duct visible?","t":"c","o":["No","Yes"]},{"l":"Duct dilatation present?","t":"c","o":["No","Yes – max diameter ____ mm"]},{"l":"Intraluminal contents","t":"c","o":["Nil","Inspissated secretion","Papillary lesion","Blood"]},{"l":"Papillary lesion dimensions (mm)","t":"t","h":""},{"l":"Nipple skin changes","t":"c","o":["Nil","Crusting","Erosion","Retraction"]},{"l":"Inking applied?","t":"c","o":["No","Yes – code: ______"]},{"l":"Entire specimen embedded?","t":"c","o":["Yes","No"]}]}]},{"key":"GI","name":"Gastrointestinal Tract","note":"Open hollow viscera along the antimesenteric border away from the lesion, pin out and fix before dissection wherever possible.","ink":"#B45309","forms":[{"id":"VNL-H-023","title":"Endoscopic gastrointestinal biopsies (multi-site)","blocks":"One site per cassette – never combine sites. Embed all fragments in entirety, on edge where orientation is possible. Use a marker dye and a fine sieve/nylon bag for small fragments.","clinical":["The endoscopic procedure and the findings at each site.","The site of each container, in the endoscopist's own words.","The clinical question: coeliac disease, inflammatory bowel disease, Helicobacter, malignancy or surveillance.","Current medication, particularly proton pump inhibitors, aspirin and immunosuppressants."],"handling":["Formalin. Small fragments float and are easily lost: use a fine sieve, a nylon bag or a mesh cassette.","Never combine containers. One endoscopic site equals one cassette.","Handle with a fine spatula; forceps crush the mucosa and mimic pathology."],"steps":["Record the number of containers and the site of each exactly as labelled.","For each container, count the fragments and record the size range.","Describe the colour and appearance of the fragments.","Apply a marker dye so the embedder can see and orientate every fragment.","Embed each site in its own cassette, in entirety, with fragments laid on edge where orientation is possible.","Where the endoscopist has orientated fragments on filter paper or mesh, preserve that orientation.","Count fragments into the cassette and record the number, so loss during processing is detectable.","Request three levels routinely; more for coeliac disease and graft-versus-host disease."],"pitfalls":["Combining sites into one cassette, which makes it impossible to report the distribution of disease.","Losing tiny fragments in the sieve or down the sink, with no record of how many were received.","Embedding fragments flat, so villous architecture cannot be assessed."],"prompts":[{"l":"Endoscopy type","t":"c","o":["Gastroscopy","Colonoscopy","Sigmoidoscopy","Capsule/other"]},{"l":"Number of containers","t":"t","h":""},{"l":"Sites as labelled (list in order)","t":"t","h":""},{"l":"Container 1 – site / fragments / size range (mm)","t":"t","h":""},{"l":"Container 2 – site / fragments / size range (mm)","t":"t","h":""},{"l":"Container 3 – site / fragments / size range (mm)","t":"t","h":""},{"l":"Container 4 – site / fragments / size range (mm)","t":"t","h":""},{"l":"Clinical question","t":"c","o":["?Coeliac","?IBD","?H. pylori","?Malignancy","Surveillance","Other"]},{"l":"Fragment colour / appearance","t":"t","h":""},{"l":"Marker dye used","t":"c","o":["Nil","Eosin","Other: ______"]},{"l":"All fragments accounted for and embedded?","t":"c","o":["Yes","No"]},{"l":"Levels requested","t":"c","o":["3 levels","Other: ______"]}]},{"id":"VNL-H-024","title":"Oesophagectomy / oesophagogastrectomy","blocks":"Ink the radial margin, pin and fix overnight. Blocks: tumour with deepest invasion (≥4), tumour–mucosa interface, radial margin, proximal and distal margins (shave or longitudinal), Barrett's segment at 10 mm intervals, and all nodes by station.","clinical":["The procedure and the site of the tumour on endoscopy, with its distance from the incisors.","Neoadjuvant chemotherapy or chemoradiotherapy, which requires assessment of regression.","The diagnosis and laboratory number of the diagnostic biopsy.","Any known Barrett's oesophagus and its endoscopic length."],"handling":["Ink the circumferential (radial) margin before opening.","Open the specimen longitudinally along the border furthest from the tumour, then pin the specimen flat on cork, mucosal surface up.","Fix pinned and unopened overnight before dissection.","Record the time into fixative."],"steps":["Record the components received and the length of each: oesophagus, stomach, omentum.","Ink the circumferential margin over and around the tumour before any incision.","Open along the border away from the tumour, pin flat and fix overnight.","Photograph the pinned specimen if a camera is available.","Record the tumour site, its three dimensions, its appearance and the proportion of the circumference involved.","Measure the distance from the tumour to the proximal margin, the distal margin and the circumferential margin.","Record the length of any Barrett's segment and its relationship to the gastro-oesophageal junction.","Submit at least four blocks through the tumour, including the deepest point of invasion and the circumferential margin in continuity.","Submit the tumour-to-mucosa interface, both longitudinal margins, the Barrett's segment sampled at 10 mm intervals, and the gastro-oesophageal junction.","Dissect and submit all lymph nodes, keeping surgeon-identified stations separate."],"pitfalls":["Opening through the tumour, which destroys the circumferential margin.","Failing to ink the radial margin, which is the margin most often involved.","Under-sampling the Barrett's segment, where a second focus of dysplasia is found."],"prompts":[{"l":"Procedure and length received (mm)","t":"t","h":""},{"l":"Neoadjuvant therapy?","t":"c","o":["No","Chemotherapy","Chemoradiotherapy"]},{"l":"Components","t":"c","o":["Oesophagus","+ proximal stomach","+ omentum"]},{"l":"Opened along which border, avoiding tumour?","t":"t","h":""},{"l":"Tumour site","t":"c","o":["Upper","Mid","Lower","GOJ – Siewert ____"]},{"l":"Tumour dimensions (mm) and appearance","t":"t","h":""},{"l":"Distance to proximal margin (mm)","t":"t","h":""},{"l":"Distance to distal margin (mm)","t":"t","h":""},{"l":"Circumferential (radial) margin inked and distance (mm)","t":"t","h":""},{"l":"Depth of invasion (macroscopic)","t":"c","o":["Mucosa","Muscularis","Adventitia/serosa"]},{"l":"Barrett's mucosa / background changes – length (mm)","t":"t","h":""},{"l":"Lymph nodes retrieved (total)","t":"t","h":""}]},{"id":"VNL-H-025","title":"Gastrectomy (partial / total)","blocks":"Open along the greater curve avoiding tumour, pin and fix. Blocks: ≥4 through tumour to deepest point and serosa, both margins, tumour–normal interface, background body and antral mucosa, and all nodes separated by station.","clinical":["The procedure and the site of the tumour on endoscopy.","Neoadjuvant therapy and the diagnosis on the prior biopsy.","Whether the surgeon has separated nodal stations.","Any known Helicobacter status or predisposing condition."],"handling":["Open along the greater curvature, avoiding the tumour; if the tumour lies on the greater curve, open along the lesser curve.","Pin flat, mucosa up, and fix overnight before dissection.","Separate the omentum and any attached spleen or duodenum before pinning."],"steps":["Record the procedure, the length along the greater and lesser curvatures, and every attached structure.","Open along the curvature away from the tumour, pin flat on cork and fix overnight.","Record the tumour site, three dimensions, appearance and the depth to which it appears to invade.","Note any serosal breach or perforation, and whether it lies at the tumou
